<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tour de France 2026 — Etapekalender</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f4f3ef;
  --paper:#fbfaf6;
  --panel:#ffffff;
  --ink:#171717;
  --muted:#707070;
  --faint:#9a9a9a;
  --line:#dedbd2;
  --line2:#ece8df;
  --accent:#111111;

  --flat:#477a9d;
  --hilly:#6f8f62;
  --mountain:#9d4a42;
  --tt:#b9824d;
  --rest:#8a8a8a;

  --radius:18px;
  --ease:180ms ease;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased;
}

.page{
  width:min(1420px, calc(100vw - 48px));
  margin:42px auto 56px;
}

.top{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:32px;
  align-items:end;
  margin-bottom:28px;
}

.eyebrow{
  font-size:12px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:clamp(56px, 9vw, 132px);
  line-height:.82;
  letter-spacing:-.075em;
  font-weight:650;
}

.sub{
  margin:18px 0 0;
  max-width:680px;
  font-size:15px;
  line-height:1.6;
  color:var(--muted);
}

.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
  max-width:620px;
}

.filter,
.smallBtn{
  height:34px;
  border:1px solid var(--line);
  background:transparent;
  border-radius:999px;
  padding:0 13px;
  color:var(--muted);
  cursor:pointer;
  transition:var(--ease);
  font-size:13px;
}

.filter:hover,
.smallBtn:hover{
  border-color:#b9b4aa;
  color:var(--ink);
}

.filter.active{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}

.search{
  height:34px;
  min-width:230px;
  border:1px solid var(--line);
  background:transparent;
  border-radius:999px;
  padding:0 14px;
  color:var(--ink);
  outline:none;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 390px;
  gap:22px;
  align-items:start;
}

.calendar{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}

.weekdays,
.monthgrid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
}

.weekdays{
  border-bottom:1px solid var(--line);
}

.weekdays div{
  height:44px;
  display:flex;
  align-items:center;
  padding:0 16px;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:650;
  border-right:1px solid var(--line2);
}

.weekdays div:last-child,
.day:nth-child(7n){border-right:0}

.day{
  min-width:0;
  min-height:160px;
  padding:13px 11px 12px;
  border-right:1px solid var(--line2);
  border-bottom:1px solid var(--line2);
  position:relative;
  background:rgba(255,255,255,.28);
  display:flex;
  flex-direction:column;
}

.day.empty{
  background:rgba(0,0,0,.015);
}

.date{
  font-size:15px;
  color:var(--faint);
  font-weight:520;
  margin-bottom:9px;
}

.date.has{
  color:var(--ink);
}

.stage{
  --stage-color:var(--accent);
  min-width:0;
  width:100%;
  flex:1;
  min-height:0;
  overflow:hidden;
  border:0;
  border-left:2px solid var(--stage-color);
  background:transparent;
  padding:0 0 0 10px;
  text-align:left;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:6px;
  color:var(--ink);
  transition:var(--ease);
}

.stage:hover{
  transform:translateX(2px);
}

.stage.sel{
  border-left-width:4px;
}

.stageTop{
  min-width:0;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
}

.stageCode{
  font-size:21px;
  line-height:1;
  letter-spacing:-.06em;
  font-weight:690;
}

.stageType{
  min-width:0;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--stage-color);
  font-weight:650;
  white-space:nowrap;
}

.route{
  min-width:0;
  overflow-wrap:anywhere;
  font-size:13px;
  line-height:1.22;
  letter-spacing:-.015em;
  font-weight:560;
}

.stageMeta{
  min-width:0;
  overflow-wrap:anywhere;
  font-size:11.5px;
  line-height:1.35;
  color:var(--muted);
}

.mini{
  margin-top:auto;
  width:100%;
  height:18px;
  opacity:.9;
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
}

.details{
  position:sticky;
  top:22px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 22px 20px;
  min-height:620px;
}

.detailsType{
  display:inline-flex;
  align-items:center;
  height:26px;
  color:var(--stage-color);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:700;
}

.details h2{
  margin:18px 0 8px;
  font-size:38px;
  line-height:.95;
  letter-spacing:-.055em;
  font-weight:690;
}

.detailsRoute{
  font-size:15px;
  line-height:1.35;
  color:var(--muted);
  margin-bottom:20px;
}

.profile{
  margin:18px 0 10px;
}

.profileImageWrap{
  border:1px solid var(--line2);
  background:#f8f7f3;
  overflow:hidden;
}

.profileImage{
  display:block;
  width:100%;
  height:auto;
}

.profile svg{
  display:block;
  width:100%;
  height:86px;
  border-top:1px solid var(--line2);
  border-bottom:1px solid var(--line2);
  padding:16px 0;
}

/* Route map — Leaflet + local GPX */
.routeMap{
  border-top:1px solid var(--line2);
  padding-top:16px;
  margin:18px 0 24px;
}

.routeMapHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}

.routeMapHeader .sectionTitle{
  margin:0;
}

.stageMap{
  width:100%;
  height:360px;
  border:1px solid var(--line2);
  border-radius:14px;
  background:#f3f1eb;
  overflow:hidden;
}

.stageMap.mapError{
  outline:1px solid rgba(157,74,66,.35);
  background:#f7f1ee;
}

.routeStatus{
  margin:8px 0 0;
  color:var(--faint);
  font-size:11.5px;
  line-height:1.4;
}

.routeStatus.error{
  color:#9d4a42;
}

.stageMap .leaflet-control-attribution{
  font-size:9px;
  background:rgba(251,250,246,.84);
}

.stageMap .leaflet-tile-pane{
  filter:saturate(.74) contrast(.96) brightness(1.03);
}

.facts{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:1px;
  background:var(--line2);
  border:1px solid var(--line2);
  margin:20px 0 24px;
}

.fact{
  background:#fff;
  min-height:66px;
  padding:12px;
}

.fact:last-child:nth-child(odd){grid-column:1/-1}

.factLabel{
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--faint);
  font-weight:650;
  margin-bottom:7px;
}

.factValue{
  font-size:14px;
  line-height:1.25;
  font-weight:600;
}

.section{
  border-top:1px solid var(--line2);
  padding-top:18px;
  margin-top:18px;
}

.sectionTitle{
  margin:0 0 8px;
  font-size:11px;
  letter-spacing:.16em;
  color:var(--faint);
  text-transform:uppercase;
  font-weight:700;
}

.section p{
  margin:0;
  font-size:14px;
  line-height:1.58;
  color:#2f2f2f;
}

.navBtns{
  display:flex;
  gap:8px;
  margin-top:22px;
}

.navBtns button{flex:1}

.sourceNote{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid var(--line2);
  color:var(--faint);
  font-size:11.5px;
  line-height:1.45;
}

.hidden{opacity:.16}
.mobileBackdrop{display:none}
.mobileClose{display:none}

@media (max-width:860px){
  .page{width:100%;margin:0;padding:18px 14px 28px}
  .top{display:block;margin-bottom:18px}
  .eyebrow{font-size:10px;margin-bottom:12px}
  h1{font-size:58px;line-height:.88;letter-spacing:-.06em}
  .sub{margin-top:12px;font-size:13px;line-height:1.45;max-width:100%}
  .controls{margin-top:18px;display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;gap:7px;padding:0 2px 8px;max-width:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .filter{flex:0 0 auto;height:32px;padding:0 12px;font-size:12px;background:#fbfaf6}
  .search{flex:0 0 210px;min-width:210px;height:32px;font-size:12px;background:#fbfaf6}
  .layout{display:block}
  .calendar{border:0;background:transparent;border-radius:0;overflow:visible}
  .weekdays{display:none}
  .monthgrid{display:block}
  .day{min-height:auto;display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:0;margin-bottom:9px;border:0;background:transparent}
  .day.empty{display:none}
  .date{margin:0;height:100%;min-height:82px;display:flex;align-items:flex-start;justify-content:center;padding-top:13px;color:#aaa;font-size:13px}
  .date.has{color:#333}
  .stage{min-height:82px;border-left-width:3px;background:#fbfaf6;border-radius:14px;padding:13px 13px 12px 14px;box-shadow:0 1px 0 rgba(0,0,0,.03);flex:none}
  .stage:hover{transform:none}
  .stage.sel{border-left-width:3px;outline:1px solid #d8d3c8}
  .stageCode{font-size:19px}
  .stageType{font-size:9px;max-width:50%;overflow:hidden;text-overflow:ellipsis}
  .route{font-size:13px}
  .stageMeta{font-size:11px}
  .mini{display:none}
  .details{position:fixed;z-index:30;left:0;right:0;bottom:0;top:auto;width:100%;min-height:0;max-height:88vh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;border-left:0;border-right:0;border-bottom:0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 24px));transition:transform 240ms ease;box-shadow:0 -18px 60px rgba(0,0,0,.20)}
  body.detailsOpen .details{transform:translateY(0)}
  .mobileBackdrop{display:block;position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.26);opacity:0;pointer-events:none;transition:opacity 220ms ease}
  body.detailsOpen .mobileBackdrop{opacity:1;pointer-events:auto}
  .mobileClose{display:flex;position:sticky;top:0;z-index:2;margin:-2px 0 10px auto;height:32px;min-width:32px;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:999px;color:#555;cursor:pointer}
  .details h2{margin-top:8px;font-size:34px}
  .detailsRoute{font-size:14px;margin-bottom:14px}
  .profile{margin-top:14px}
  .profileImageWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .profileImage{min-width:620px}
  .routeMap{margin:16px 0 20px;padding-top:14px}
  .stageMap{height:320px;border-radius:13px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));margin:16px 0 18px}
  .fact{min-height:58px;padding:10px}
  .factLabel{font-size:9px}
  .factValue{font-size:12.5px}
  .section{padding-top:14px;margin-top:14px}
  .section p{font-size:13.5px;line-height:1.5}
  .navBtns{position:sticky;bottom:0;background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));padding-top:18px;margin-bottom:-8px}
  .smallBtn{background:#fff}
}

@media (max-width:420px){
  .page{padding-left:10px;padding-right:10px}
  h1{font-size:52px}
  .day{grid-template-columns:34px minmax(0,1fr);gap:7px}
  .stage{padding:12px 11px 11px 12px}
  .stageType{max-width:46%}
  .facts{grid-template-columns:1fr 1fr}
  .stageMap{height:280px}
}
</style>
</head>

  <div class="page">
    <header class="top">
      <div>
        <div class="eyebrow">Tour de France 2026</div>
        <h1>Juli</h1>
        <p class="sub">En rolig, klikbar etapeoversigt med filtre for bjergafslutning, klassementsdage og udbrudsetaper. Klik på en etape for profil, analyse, se-værdi og rute.</p>
      </div>
      <div class="controls">
        <button class="filter active" data-filter="all">Alle</button>
        <button class="filter" data-filter="mountain">Bjerge</button>
        <button class="filter" data-filter="summit">Bjergafslutning</button>
        <button class="filter" data-filter="gcday">Klassementsdag</button>
        <button class="filter" data-filter="clearbreakaway">Oplagt udbrud</button>
        <button class="filter" data-filter="possiblebreakaway">Mulig udbrud</button>
        <button class="filter" data-filter="hilly">Kuperet</button>
        <button class="filter" data-filter="flat">Flad</button>
        <button class="filter" data-filter="tt">TT</button>
        <button class="filter" data-filter="rest">Hviledag</button>
        <input id="search" class="search" placeholder="Søg rute, rytter, etape…" />
      </div>
    </header>

    <main class="layout">
      <section class="calendar">
        <div class="weekdays">
          <div>Mandag</div><div>Tirsdag</div><div>Onsdag</div><div>Torsdag</div><div>Fredag</div><div>Lørdag</div><div>Søndag</div>
        </div>
        <div id="monthgrid" class="monthgrid"></div>
      </section>
      <aside id="details" class="details" aria-live="polite"></aside>
      <div id="mobileBackdrop" class="mobileBackdrop" onclick="closeMobileDetails()"></div>
    </main>
  </div>

function profile(type){const c=palette[type]||'#111';if(type==='flat')return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M4 24 L236 24" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;if(type==='hilly')return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M4 27 C28 12 52 34 78 20 S126 8 154 22 S200 33 236 13" stroke="${c}" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;if(type==='mountain')return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M4 34 L38 12 L72 34 L112 6 L154 34 L188 16 L236 34" stroke="${c}" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>`;if(type==='itt'||type==='ttt')return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><circle cx="120" cy="22" r="12" stroke="${c}" stroke-width="3" fill="none"/><path d="M120 22 L120 13 M120 22 L128 27 M111 6 H129" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M30 28 H210 M52 28 V16 H110 V28 M31 28 V10" stroke="${c}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

function setRouteStatus(message,isError=false){const el=document.getElementById('stage-route-status');if(!el)return;el.textContent=message;el.classList.toggle('error',isError)}
function parseGpxPoints(gpxText){const xml=new DOMParser().parseFromString(gpxText,'application/xml');if(xml.querySelector('parsererror'))throw new Error('GPX kunne ikke parses som XML.');const pointNodes=[...xml.querySelectorAll('trkpt'),...xml.querySelectorAll('rtept')];const points=pointNodes.map(node=>{const lat=Number(node.getAttribute('lat'));const lon=Number(node.getAttribute('lon'));return Number.isFinite(lat)&&Number.isFinite(lon)?[lat,lon]:null}).filter(Boolean);if(!points.length)throw new Error('GPX-filen indeholder ingen trkpt/rtept-punkter.');return points}
function initStageMap(){const mapEl=document.getElementById('stage-map');if(!mapEl)return null;if(!window.L){console.warn('[Tour26 GPX] Leaflet er ikke loadet endnu.');setRouteStatus('Kortbiblioteket er ikke loadet endnu.',true);return null}if(stageMap){stageMap.remove();stageMap=null}stageMap=window.L.map(mapEl,{zoomControl:false,attributionControl:true,gestureHandling:false,scrollWheelZoom:false,doubleClickZoom:true,dragging:true,tap:true});window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(stageMap);stageMap.setView([46.85,2.35],5);return stageMap}
async function showStageRoute(stage){const requestId=++activeRouteRequest;const mapEl=document.getElementById('stage-map');if(!stage||!stage.gpx||!mapEl)return;mapEl.classList.remove('mapError');setRouteStatus('Ruten loader fra GPX-fil.');const map=initStageMap();if(!map)return;const gpxUrl=new URL(stage.gpx,window.location.origin).href;try{console.info(`[Tour26 GPX] Loader ${stage.stage}: ${gpxUrl}`);const response=await fetch(gpxUrl,{cache:'force-cache'});if(requestId!==activeRouteRequest)return;if(!response.ok)throw new Error(`HTTP ${response.status} ${response.statusText}`);const points=parseGpxPoints(await response.text());activeRouteLayer=window.L.polyline(points,{color:'#9d4a42',weight:4,opacity:.94,lineCap:'round',lineJoin:'round'}).addTo(map);const start=window.L.circleMarker(points[0],{radius:4,color:'#171717',weight:2,fillColor:'#fbfaf6',fillOpacity:1}).addTo(map);const end=window.L.circleMarker(points[points.length-1],{radius:5,color:'#9d4a42',weight:2,fillColor:'#fbfaf6',fillOpacity:1}).addTo(map);activePointLayers=[start,end];const bounds=activeRouteLayer.getBounds();window.setTimeout(()=>{map.invalidateSize();if(bounds.isValid())map.fitBounds(bounds,{padding:[22,22],maxZoom:12})},160);setRouteStatus(`Rute indlæst · ${points.length.toLocaleString('da-DK')} punkter`);console.info(`[Tour26 GPX] ${stage.stage} OK · ${points.length} punkter`,gpxUrl)}catch(error){if(requestId!==activeRouteRequest)return;console.warn(`[Tour26 GPX] ${stage.stage} kunne ikke loade GPX-ruten:`,error,gpxUrl);mapEl.classList.add('mapError');setRouteStatus('GPX-ruten kunne ikke indlæses. Tjek filsti og console.',true)}}
function build(){const g=document.getElementById('monthgrid');g.innerHTML='';for(let i=0;i<2;i++){const c=document.createElement('div');c.className='day empty';g.appendChild(c)}for(let d=1;d<=31;d++){const date=dateString(d),s=stageOn(date),cell=document.createElement('div');cell.className='day';cell.innerHTML=`<div class="date ${s?'has':''}">${d}</div>`;if(s){const b=document.createElement('button');b.className='stage';b.dataset.date=s.date;b.dataset.type=s.typeKey;b.dataset.search=JSON.stringify(s).toLowerCase();b.style.setProperty('--stage-color',palette[s.typeKey]);b.innerHTML=`<div class="stageTop"><div class="stageCode">${s.stage==='REST'?'Hvile':s.stage}</div><div class="stageType">${s.gcDay?'GC · ':''}${s.clearBreakawayDay?'UD · ':''}${s.possibleBreakawayDay?'UD? · ':''}${s.summitFinish?'↗ ':''}${typeLabel[s.typeKey]}</div></div><div class="route">${s.route}</div><div class="stageMeta">${s.distance?`${s.distance} · ${s.time}`:'Hviledag'}</div><div class="mini">${profile(s.typeKey)}</div>`;b.onclick=()=>selectStage(s.date);cell.appendChild(b)}g.appendChild(cell)}for(let i=0;i<2;i++){const c=document.createElement('div');c.className='day empty';g.appendChild(c)}}
function selectStage(date){const s=stageOn(date);if(!s)return;if(window.matchMedia('(max-width:860px)').matches)document.body.classList.add('detailsOpen');document.querySelectorAll('.stage').forEach(el=>el.classList.toggle('sel',el.dataset.date===date));const details=document.getElementById('details');details.style.setProperty('--stage-color',palette[s.typeKey]);details.innerHTML=`<button class="mobileClose" onclick="closeMobileDetails()" aria-label="Luk detaljer">×</button><div class="detailsType">${typeLabel[s.typeKey]}</div><h2>${s.title}</h2><div class="detailsRoute">${fmtDate(s.date)}<br>${s.route}</div><div class="profile">${s.profileImage?`<div class="profileImageWrap"><img class="profileImage" src="${s.profileImage}" alt="Etapeprofil for ${s.title}" loading="lazy" onerror="this.closest('.profile').innerHTML=profile('${s.typeKey}')"></div>`:profile(s.typeKey)}</div>${s.gpx?`<div class="routeMap"><div class="routeMapHeader"><h3 class="sectionTitle">Rute</h3></div><div id="stage-map" class="stageMap" aria-label="Kort med GPX-ruten for ${s.title}"></div><p id="stage-route-status" class="routeStatus">Ruten loader fra GPX-fil.</p></div>`:''}<div class="facts"><div class="fact"><div class="factLabel">Distance</div><div class="factValue">${s.distance||'—'}</div></div><div class="fact"><div class="factLabel">Højdemeter</div><div class="factValue">${s.elevation||'—'}</div></div><div class="fact"><div class="factLabel">TV-tid</div><div class="factValue">${s.time||'—'}</div></div><div class="fact"><div class="factLabel">Se-værdi</div><div class="factValue">${s.watch}</div></div><div class="fact"><div class="factLabel">GC-relevans</div><div class="factValue">${s.gc}${s.gcDay?' · Klassementsdag':''}</div></div><div class="fact"><div class="factLabel">Profil</div><div class="factValue">${s.type}</div></div><div class="fact"><div class="factLabel">Måltype</div><div class="factValue">${finish(s)}</div></div><div class="fact"><div class="factLabel">Udbrud</div><div class="factValue">${breakaway(s)}</div></div></div><div class="section"><h3 class="sectionTitle">Analyse</h3><p>${s.summary}</p></div><div class="section"><h3 class="sectionTitle">Hold øje med</h3><p>${s.watchFor}</p></div>${s.favorites?`<div class="section"><h3 class="sectionTitle">Ryttertyper</h3><p>${s.favorites}</p></div>`:''}<div class="section"><h3 class="sectionTitle">Kalendernote</h3><p>${s.note}</p></div><div class="navBtns"><button class="smallBtn" onclick="step(-1)">Forrige</button><button class="smallBtn" onclick="step(1)">Næste</button></div><div class="sourceNote">Internt overblik baseret på TV 2-etapenoter, officielle routedistancer, etapeprofiler og lokale GPX-ruter.</div>`;window.setTimeout(()=>showStageRoute(s),120)}
function closeMobileDetails(){document.body.classList.remove('detailsOpen')}
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMobileDetails()});
function currentStageIndex(){const selected=document.querySelector('.stage.sel');return Math.max(0,stages.findIndex(s=>s.date===(selected&&selected.dataset.date)))}
function step(n){let i=currentStageIndex()+n;if(i<0)i=stages.length-1;if(i>=stages.length)i=0;selectStage(stages[i].date)}
function setupFilters(){let filter='all';const buttons=document.querySelectorAll('.filter'),search=document.getElementById('search');function apply(){const q=search.value.trim().toLowerCase();document.querySelectorAll('.stage').forEach(el=>{const type=el.dataset.type,data=JSON.parse(el.dataset.search);const ok=filter==='all'||filter===type||(filter==='tt'&&(type==='itt'||type==='ttt'))||(filter==='summit'&&data.summitfinish)||(filter==='gcday'&&data.gcday)||(filter==='clearbreakaway'&&data.clearbreakawayday)||(filter==='possiblebreakaway'&&data.possiblebreakawayday);const so=!q||el.dataset.search.includes(q);el.classList.toggle('hidden',!(ok&&so))})}buttons.forEach(btn=>btn.onclick=()=>{buttons.forEach(b=>b.classList.remove('active'));btn.classList.add('active');filter=btn.dataset.filter;apply()});search.oninput=apply}
build();setupFilters();selectStage('2026-07-04');if(window.matchMedia('(max-width:860px)').matches)closeMobileDetails();
</script>
