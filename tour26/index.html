function dateStr(d){return`2026-07-${String(d).padStart(2,'0')}`}function onDay(d){return stages.find(s=>s.d===d)}function fmt(d){return new Date(d+'T12:00').toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function profile(t){const c=C[t]||'#111';if(t==='flat')return`<svg viewBox='0 0 240 40' preserveAspectRatio='none'><path d='M4 24 L236 24' stroke='${c}' stroke-width='3' fill='none' stroke-linecap='round'/></svg>`;if(t==='hilly')return`<svg viewBox='0 0 240 40' preserveAspectRatio='none'><path d='M4 27 C28 12 52 34 78 20 S126 8 154 22 S200 33 236 13' stroke='${c}' stroke-width='3.5' fill='none' stroke-linecap='round'/></svg>`;if(t==='mountain')return`<svg viewBox='0 0 240 40' preserveAspectRatio='none'><path d='M4 34 L38 12 L72 34 L112 6 L154 34 L188 16 L236 34' stroke='${c}' stroke-width='3.5' fill='none' stroke-linejoin='round' stroke-linecap='round'/></svg>`;if(t==='itt'||t==='ttt')return`<svg viewBox='0 0 240 40' preserveAspectRatio='none'><circle cx='120' cy='22' r='12' stroke='${c}' stroke-width='3' fill='none'/><path d='M120 22 L120 13 M120 22 L128 27 M111 6 H129' stroke='${c}' stroke-width='3' stroke-linecap='round'/></svg>`;return''}
function img(s){return s.n?`/tour26/profiles/e${s.n}.avif`:''}function gpx(s){return s.n?`/tour26/routes/gpx/tdf2026_stage_${String(s.n).padStart(2,'0')}.gpx`:''}function finish(s){return s.summit?'Bjergafslutning':s.k==='mountain'?'Bjergetape uden klar bjergafslutning':s.rest?'Hviledag':'Ikke bjergafslutning'}function br(s){return s.clearBreak?'Oplagt udbrudsetape':s.maybeBreak?'Mulig udbrudsetape':'Ikke primær udbrudsetape'}
let map=null,routeLayer=null,req=0;function statusMsg(m,e=false){const el=document.getElementById('route-status');if(el){el.textContent=m;el.classList.toggle('error',e)}}function parseGpx(txt){const xml=new DOMParser().parseFromString(txt,'application/xml');if(xml.querySelector('parsererror'))throw Error('GPX parse error');const pts=[...xml.querySelectorAll('trkpt'),...xml.querySelectorAll('rtept')].map(n=>{const lat=Number(n.getAttribute('lat')),lon=Number(n.getAttribute('lon'));return Number.isFinite(lat)&&Number.isFinite(lon)?[lat,lon]:null}).filter(Boolean);if(!pts.length)throw Error('Ingen punkter');return pts}function initMap(){const el=document.getElementById('stage-map');if(!el||!window.L)return null;if(map){map.remove();map=null}map=window.L.map(el,{zoomControl:false,attributionControl:true,scrollWheelZoom:false,doubleClickZoom:true,dragging:true,tap:true});window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);map.setView([46.85,2.35],5);return map}async function showRoute(s){const id=++req,el=document.getElementById('stage-map');if(!s||!s.n||!el)return;el.classList.remove('mapError');statusMsg('Ruten loader fra GPX-fil.');const m=initMap();if(!m){statusMsg('Kortbiblioteket kunne ikke indlæses.',true);return}const url=new URL(gpx(s),location.origin).href;try{const res=await fetch(url,{cache:'force-cache'});if(id!==req)return;if(!res.ok)throw Error(`HTTP ${res.status}`);const pts=parseGpx(await res.text());window.L.polyline(pts,{color:'#171717',weight:7,opacity:.22,lineCap:'round',lineJoin:'round'}).addTo(m);routeLayer=window.L.polyline(pts,{color:'#FEDD00',weight:4,opacity:.98,lineCap:'round',lineJoin:'round'}).addTo(m);window.L.circleMarker(pts[0],{radius:4,color:'#171717',weight:2,fillColor:'#fbfaf6',fillOpacity:1}).addTo(m);window.L.circleMarker(pts[pts.length-1],{radius:5,color:'#171717',weight:2,fillColor:'#FEDD00',fillOpacity:1}).addTo(m);const b=routeLayer.getBounds();setTimeout(()=>{m.invalidateSize();if(b.isValid())m.fitBounds(b,{padding:[22,22],maxZoom:12})},160);statusMsg(`Rute indlæst · ${pts.length.toLocaleString('da-DK')} punkter`)}catch(e){if(id!==req)return;el.classList.add('mapError');statusMsg('GPX-ruten kunne ikke indlæses. Tjek filsti og console.',true)}}
function build(){const g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<2;i++){const e=document.createElement('div');e.className='day empty';g.appendChild(e)}for(let d=1;d<=31;d++){const s=onDay(dateStr(d)),cell=document.createElement('div');cell.className='day';cell.innerHTML=`<div class='date ${s?'has':''}'>${d}</div>`;if(s){const b=document.createElement('button');b.className='stage';b.dataset.date=s.d;b.dataset.type=s.k;b.dataset.search=JSON.stringify(s).toLowerCase();b.style.setProperty('--c',C[s.k]);if(s.rest){b.innerHTML=`<div class='code'>Hviledag</div><div class='route'>${s.r}</div>`}else{b.innerHTML=`<div class='code'>${s.n}. etape</div><div class='type'>${T[s.k]}</div><div class='route'>${s.r}</div><div class='meta'>${s.km} · ${s.time}</div><div class='mini'>${profile(s.k)}</div>`}b.onclick=()=>select(s.d);cell.appendChild(b)}g.appendChild(cell)}for(let i=0;i<2;i++){const e=document.createElement('div');e.className='day empty';g.appendChild(e)}}
function select(date){const s=onDay(date);if(!s)return;if(matchMedia('(max-width:860px)').matches)document.body.classList.add('open');document.querySelectorAll('.stage').forEach(e=>e.classList.toggle('sel',e.dataset.date===date));const d=document.getElementById('details');d.style.setProperty('--c',C[s.k]);d.innerHTML=`<button class='close' onclick='closeDetails()'>×</button><div class='detailsType'>${T[s.k]}</div><h2>${s.t}</h2><div class='detailsRoute'>${fmt(s.d)}<br>${s.r}</div><div class='profile'>${img(s)?`<div class='profileBox'><img src='${img(s)}' alt='Etapeprofil for ${s.t}' loading='lazy' onerror='this.closest(".profile").innerHTML=profile("${s.k}")'></div>`:profile(s.k)}</div>${s.n?`<div class='routeMap'><h3 class='sectionTitle'>Rute</h3><div id='stage-map' class='stageMap'></div><p id='route-status' class='routeStatus'>Ruten loader fra GPX-fil.</p></div>`:''}<div class='facts'><div class='fact'><div class='lab'>Distance</div><div class='val'>${s.km||'—'}</div></div><div class='fact'><div class='lab'>Højdemeter</div><div class='val'>${s.hm||'—'}</div></div><div class='fact'><div class='lab'>TV-tid</div><div class='val'>${s.time||'—'}</div></div><div class='fact'><div class='lab'>Se-værdi</div><div class='val'>${s.w}</div></div><div class='fact'><div class='lab'>GC-relevans</div><div class='val'>${s.gc}${s.gcDay?' · Klassementsdag':''}</div></div><div class='fact'><div class='lab'>Profil</div><div class='val'>${s.ty}</div></div><div class='fact'><div class='lab'>Måltype</div><div class='val'>${finish(s)}</div></div><div class='fact'><div class='lab'>Udbrud</div><div class='val'>${br(s)}</div></div></div><div class='section'><h3 class='sectionTitle'>Analyse</h3><p>${s.s}</p></div><div class='section'><h3 class='sectionTitle'>Hold øje med</h3><p>${s.watch}</p></div>${s.fav?`<div class='section'><h3 class='sectionTitle'>Ryttertyper</h3><p>${s.fav}</p></div>`:''}<div class='section'><h3 class='sectionTitle'>Kalendernote</h3><p>${s.note}</p></div><div class='nav'><button class='small' onclick='step(-1)'>Forrige</button><button class='small' onclick='step(1)'>Næste</button></div>`;setTimeout(()=>showRoute(s),120)}function closeDetails(){document.body.classList.remove('open')}addEventListener('keydown',e=>{if(e.key==='Escape')closeDetails()});function idx(){const e=document.querySelector('.stage.sel');return Math.max(0,stages.findIndex(s=>s.d===(e&&e.dataset.date)))}function step(n){let i=idx()+n;if(i<0)i=stages.length-1;if(i>=stages.length)i=0;select(stages[i].d)}function filters(){let f='all';const bs=document.querySelectorAll('.filter'),q=document.getElementById('search');function apply(){const x=q.value.trim().toLowerCase();document.querySelectorAll('.stage').forEach(e=>{const t=e.dataset.type,data=JSON.parse(e.dataset.search),ok=f==='all'||f===t||(f==='tt'&&(t==='itt'||t==='ttt'))||(f==='summit'&&data.summit)||(f==='gcday'&&data.gcday)||(f==='clearbreakaway'&&data.clearbreak)||(f==='possiblebreakaway'&&data.maybebreak),so=!x||e.dataset.search.includes(x);e.classList.toggle('hidden',!(ok&&so))})}bs.forEach(b=>b.onclick=()=>{bs.forEach(a=>a.classList.remove('active'));b.classList.add('active');f=b.dataset.filter;apply()});q.oninput=apply}build();filters();select('2026-07-04');if(matchMedia('(max-width:860px)').matches)closeDetails();
</script></body></html>
