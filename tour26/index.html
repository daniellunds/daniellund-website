<script>
const stages=[['2026-07-04','E1','1. etape','Barcelona → Barcelona','19,6 km','Hold-TT','ttt','ca. 220 hm','ca. 17.05–19.15','Middel/høj','Middel','Kort og teknisk holdtidskørsel i Barcelona. Mostly flat, men med et afgørende Montjuïc-afsnit mod slutningen.','Tidlige forskelle mellem klassementsholdene. Særligt UAE, Visma og Red Bull — Pogacar vs. Vingegaard.','Stærke holdtidskørselshold.','Ikke forventet at skabe enorme tidsforskelle, men vigtig som første tekniske test.',0,0,0,0],['2026-07-05','E2','2. etape','Tarragona → Barcelona','182 km','Kuperet','hilly','ca. 2384 hm','ca. 13.55–17.25','Høj','Høj','Første rigtige “se den sidste time”-etape. Montjuïc-finale med punchy stigninger i Barcelona.','Mulig tidlig duel mellem puncheurs og eksplosive klassementsryttere.','Pogacar, Mathieu van der Poel, Mads Pedersen og muligvis Vingegaard.','Høj se-værdi især i Barcelona-finalen.',0,1,0,0],['2026-07-06','E3','3. etape','Granollers → Les Angles','196 km','Bjerge','mountain','ca. 3987 hm','ca. 12.20–16.50','Høj','Høj','Første Pyrenæer-test og første reelle bjergetape.','Den lange afslutning mod Les Angles kan afsløre svaghed hos klassementsryttere.','Eksplosive klassementsryttere.','Første dag hvor klassementet for alvor kan flytte sig.',1,1,0,0],['2026-07-07','E4','4. etape','Carcassonne → Foix','182 km','Kuperet','hilly','ca. 2778 hm','ca. 13.25–17.20','Middel/høj','Middel','Kuperet Pyrenæer-overgang og meget oplagt udbrudsetape.','Sidste større stigning ligger langt nok fra mål til, at stærke udbrudsryttere kan holde hjem.','Van der Poel, Van Aert, Mads Pedersen, Magnus Cort, Andreas Kron.','God taktisk udbrudsdag, men mindre GC-kritisk end E3.',0,0,1,0],['2026-07-08','E5','5. etape','Lannemezan → Pau','158 km','Flad','flat','ca. 1990 hm','ca. 14.15–17.30','Middel','Lav','Formentlig første reelle sprinteretape.','De sidste små bakker inden for ca. 15 km kan gøre finalen mere selektiv.','Milan, Merlier, Kooij. Hårdt løb kan give Mads P bedre chance.','Primært sprintdag, men ikke helt uden finale-nuance.',0,0,0,0],['2026-07-09','E6','6. etape','Pau → Gavarnie-Gèdre','186 km','Bjerge','mountain','ca. 4158 hm','ca. 12.40–17.25','Meget høj','Meget høj','Tourens store Pyrenæer-mulighed. Col d’Aspin, Tourmalet og afslutning ved Gavarnie-Gèdre.','Hvis der skal skabes store GC-forskelle, skal angreb sandsynligvis komme allerede på Tourmalet.','Pogacar, Vingegaard, Evenepoel, Pidcock, Onley — eller bjergudbrud.','Se fra Tourmalet og frem, ikke kun finalestigningen.',1,1,0,0],['2026-07-10','E7','7. etape','Hagetmau → Bordeaux','175 km','Flad','flat','ca. 1675 hm','ca. 13.25–17.05','Lav/middel','Lav','En af løbets nemmere og mest oplagte massespurter.','Bordeaux-finale på bred boulevard; topfart tæller mest.','Rene topsprintere og stærke leadout-tog.','Se sandsynligvis kun de sidste 10–15 km.',0,0,0,0],['2026-07-11','E8','8. etape','Périgueux → Bergerac','182 km','Flad','flat','ca. 1322 hm','ca. 13.25–17.15','Lav/middel','Lav','Sandsynlig massespurt. Ikke fuldstændig flad, men de sidste ca. 40 km er sprintervenlige.','Tog, positionering og eventuel sidevind/løbsdynamik.','Pure sprinters.','Primært finalen er interessant.',0,0,0,0],['2026-07-12','E9','9. etape','Malemort → Ussel','185 km','Kuperet','hilly','ca. 3412 hm','ca. 13.45–17.40','Middel/høj','Middel/lav','Massif Central-udbrudsetape. For hård til rene sprintere, næppe hård nok til fuld GC-krig.','Bredt udbrud med puncheurs, klassikertyper og stærke rouleurs.','Ardenner-/puncheurtyper, Van Aert, Mads P i topform.','God udbrudsdag før hviledagen.',0,0,1,0],['2026-07-13','REST','Hviledag','Cantal','','Hviledag','rest','','','-','-','Første hviledag.','Opsamling på Pyrenæerne og Massif Central-starten.','','God dag til highlights.',0,0,0,0],['2026-07-14','E10','10. etape','Aurillac → Le Lioran','167 km','Bjerge','mountain','ca. 3789 hm','ca. 13.25–17.05','Høj','Høj','Stor Massif Central-bjergetape efter hviledagen. Minder om 2024-terrænet, hvor Vingegaard slog Pogacar.','Finale over taktisk kuperet terræn; angreb kan komme før selve målområdet.','Pogacar, Vingegaard og GC-klatrere — eller stærkt bjergudbrud.','Se især de sidste 40–50 km.',0,1,0,1],['2026-07-15','E11','11. etape','Vichy → Nevers','161 km','Flad','flat','ca. 1827 hm','ca. 14.05–17.25','Lav','Lav','En af løbets mest oplagte sprinteretaper.','Ren massespurt, hvis intet uventet sker.','Pure sprinters og leadout-tog.','Sandsynligvis nok at se de sidste 10 km.',0,0,0,0],['2026-07-16','E12','12. etape','Nevers Magny-Cours → Chalon-sur-Saône','181 km','Flad','flat','ca. 1397 hm','ca. 13.40–17.25','Lav/middel','Lav','Endnu en sandsynlig sprinteretape, lidt mere krævende end E11.','Kontrol fra sprinterholdene og relativt ukompliceret finale.','Pure sprinters.','Primært finalen er interessant.',0,0,0,0],['2026-07-17','E13','13. etape','Dole → Belfort','205 km','Kuperet','hilly','ca. 2611 hm','ca. 13.20–17.40','Middel/høj','Middel/lav','Oplagt overgangs-/udbrudsetape efter sprintdagene.','Ballon d’Alsace gør etapen for hård til normal spurt, men ligger for langt fra mål til stor GC-sortering.','Stærke udbrudsryttere, puncheurs, klassikertyper og muligvis Mads P.','God Vosges-optakt før bjergweekenden.',0,0,1,0],['2026-07-18','E14','14. etape','Mulhouse → Le Markstein Fellering','155 km','Bjerge','mountain','ca. 3941 hm','ca. 13.30–17.20','Høj','Høj','Kort, intens Vogeser-etape med mange stejle stigninger i serie.','Grand Ballon, Col du Page, Ballon d’Alsace og Col du Haag/Le Markstein-sekvensen.','Pogacar/Vingegaard ved hårdt GC-løb; ellers stærkt klatreudbrud.','Ikke undervurdér dagen — stigningerne er stejle og tæt pakkede.',0,1,0,1],['2026-07-19','E15','15. etape','Champagnole → Plateau de Solaison','184 km','Bjerge','mountain','ca. 4701 hm','ca. 13.20–17.35','Meget høj','Meget høj','Første Alpe-etape og ifølge TV 2 løbets sværeste bjergafslutning.','Col de la Croisette/Le Salève og finalen på Plateau de Solaison.','Pogacar, Vingegaard og de stærkeste rene klatrere.','En af løbets vigtigste etaper. Se gerne fra de sidste store stigninger.',1,1,0,0],['2026-07-20','REST','Hviledag','Haute-Savoie','','Hviledag','rest','','','-','-','Anden hviledag.','Status før enkeltstart og den afgørende Alpe-blok.','','God dag til klassementsoverblik.',0,0,0,0],['2026-07-21','E16','16. etape','Évian-les-Bains → Thonon-les-Bains','26 km','Enkeltstart','itt','ca. 465 hm','ca. 13.00–17.45','Høj','Høj','Løbets eneste individuelle enkeltstart. Kuperet og teknisk — ikke en ren flad specialist-TT.','Skift mellem stigning, nedkørsel og flade tekniske passager.','Evenepoel som oplagt TT-favorit; ruten kan også passe Pogacar/Vingegaard.','Høj GC-værdi, især hvis klassementet er tæt.',0,1,0,0],['2026-07-22','E17','17. etape','Chambéry → Voiron','175 km','Flad','flat','ca. 2361 hm','ca. 13.35–17.15','Middel','Lav','Officielt flad, men mere tricky end standard sprintdag.','Tidlig elevation og en finale, der kan blive hårdere hvis feltet er træt.','Milan, Merlier, Kooij ved kontrol; Mads P/Wout hvis det bliver hårdt.','Se de sidste 20–30 km.',0,0,0,0],['2026-07-23','E18','18. etape','Voiron → Orcières-Merlette','185 km','Bjerge','mountain','ca. 3950 hm','ca. 12.50–17.05','Høj','Høj','Første del af den sene Alpe-blok. Finalen er hård, men ikke brutal.','Orcières-Merlette-finalen, ca. 7,1 km omkring 6,7 %.','Pogacar, Vingegaard, Evenepoel, Pidcock, Onley — eller stærkt bjergudbrud.','Vigtig, men sandsynligvis mindre afgørende end E19/E20.',1,1,0,1],['2026-07-24','E19','19. etape','Gap → Alpe d’Huez','128 km','Bjerge','mountain','ca. 3605 hm','ca. 14.15–17.20','Høj','Høj','Kort Alpe-etape med ikonisk afslutning på Alpe d’Huez.','Col du Noyer før den afsluttende Alpe d’Huez.','Pogacar og Vingegaard, hvis GC-holdene kontrollerer; udbrudschance findes.','Høj prestige og GC-værdi, men E20 ligner den endnu større dag.',1,1,0,1],['2026-07-25','E20','20. etape','Le Bourg d’Oisans → Alpe d’Huez','171 km','Bjerge','mountain','ca. 5601 hm','ca. 11.30–16.05','Meget høj','Meget høj','Kongeetapen. Meget hård alperute med Croix de Fer, Télégraphe, Galibier, Sarenne og Alpe d’Huez.','Højden, den enorme samlede stigning og muligheden for langdistancepres.','Vingegaard kan have terræn til udholdenheds-/højdepreset; Pogacar er stadig central.','Top 2–3 must-watch etape. Se fra tidlige store stigninger hvis muligt.',1,1,0,0],['2026-07-26','E21','21. etape','Thoiry → Paris Champs-Élysées','130 km','Flad','flat','ca. 1847 hm','ca. 16.25–19.30','Middel/høj','Lav','Paris-finale med Montmartre og Champs-Élysées.','Montmartre kan gøre finalen mere selektiv, men placeringen længere fra mål giver sprinterhold tid til at samle sig.','Merlier, Milan, Philipsen-typer; hardføre sprintere/klassikertyper kan få fordel.','Mere interessant end klassisk parade/sprint, men nok ikke GC-relevant.',0,0,0,0]].map(a=>({date:a[0],stage:a[1],title:a[2],route:a[3],distance:a[4],type:a[5],typeKey:a[6],elevation:a[7],time:a[8],watch:a[9],gc:a[10],summary:a[11],watchFor:a[12],favorites:a[13],note:a[14],summitFinish:!!a[15],gcDay:!!a[16],clearBreakawayDay:!!a[17],possibleBreakawayDay:!!a[18]}));
const palette={flat:'#477a9d',hilly:'#6f8f62',mountain:'#9d4a42',ttt:'#b9824d',itt:'#b9824d',rest:'#8a8a8a'},typeLabel={flat:'Flad etape',hilly:'Kuperet etape',mountain:'Bjergetape',ttt:'Holdtidskørsel',itt:'Enkeltstart',rest:'Hviledag'};
function stageOn(d){return stages.find(s=>s.date===d)}function dateString(d){return`2026-07-${String(d).padStart(2,'0')}`}function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function profile(type){const c=palette[type]||'#111';if(type==='flat')return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M4 24 L236 24" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;if(type==='hilly')return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M4 27 C28 12 52 34 78 20 S126 8 154 22 S200 33 236 13" stroke="${c}" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;if(type==='mountain')return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M4 34 L38 12 L72 34 L112 6 L154 34 L188 16 L236 34" stroke="${c}" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>`;if(type==='itt'||type==='ttt')return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><circle cx="120" cy="22" r="12" stroke="${c}" stroke-width="3" fill="none"/><path d="M120 22 L120 13 M120 22 L128 27 M111 6 H129" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;return`<svg viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M30 28 H210 M52 28 V16 H110 V28 M31 28 V10" stroke="${c}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function build(){const g=document.getElementById('monthgrid');g.innerHTML='';for(let i=0;i<2;i++){const c=document.createElement('div');c.className='day empty';g.appendChild(c)}for(let d=1;d<=31;d++){const date=dateString(d),s=stageOn(date),cell=document.createElement('div');cell.className='day';cell.innerHTML=`<div class="date ${s?'has':''}">${d}</div>`;if(s){const b=document.createElement('button');b.className='stage';b.dataset.date=s.date;b.dataset.type=s.typeKey;b.dataset.search=JSON.stringify(s).toLowerCase();b.style.setProperty('--c',palette[s.typeKey]);b.innerHTML=`<div class="stageTop"><div class="code">${s.stage==='REST'?'Hvile':s.stage}</div><div class="type">${s.gcDay?'GC · ':''}${s.clearBreakawayDay?'UD · ':''}${s.possibleBreakawayDay?'UD? · ':''}${s.summitFinish?'↗ ':''}${typeLabel[s.typeKey]}</div></div><div class="route">${s.route}</div><div class="meta">${s.distance?`${s.distance} · ${s.time}`:'Hviledag'}</div><div class="mini">${profile(s.typeKey)}</div>`;b.onclick=()=>select(s.date);cell.appendChild(b)}g.appendChild(cell)}for(let i=0;i<2;i++){const c=document.createElement('div');c.className='day empty';g.appendChild(c)}}
function select(date){const s=stageOn(date);if(!s)return;if(matchMedia('(max-width:860px)').matches)document.body.classList.add('detailsOpen');document.querySelectorAll('.stage').forEach(e=>e.classList.toggle('sel',e.dataset.date===date));const d=document.getElementById('details');d.style.setProperty('--c',palette[s.typeKey]);d.innerHTML=`<button class="mobileClose" onclick="closeMobileDetails()" aria-label="Luk detaljer">×</button><div class="detailsType">${typeLabel[s.typeKey]}</div><h2>${s.title}</h2><div class="detailsRoute">${fmtDate(s.date)}<br>${s.route}</div><div class="profile">${profile(s.typeKey)}</div><div class="facts"><div class="fact"><div class="lab">Distance</div><div class="val">${s.distance||'—'}</div></div><div class="fact"><div class="lab">Højdemeter</div><div class="val">${s.elevation||'—'}</div></div><div class="fact"><div class="lab">TV-tid</div><div class="val">${s.time||'—'}</div></div><div class="fact"><div class="lab">Se-værdi</div><div class="val">${s.watch}</div></div><div class="fact"><div class="lab">GC-relevans</div><div class="val">${s.gc}${s.gcDay?' · Klassementsdag':''}</div></div><div class="fact"><div class="lab">Profil</div><div class="val">${s.type}</div></div><div class="fact"><div class="lab">Måltype</div><div class="val">${s.summitFinish?'Bjergafslutning':s.typeKey==='mountain'?'Bjergetape uden klar bjergafslutning':'Ikke bjergafslutning'}</div></div><div class="fact"><div class="lab">Udbrud</div><div class="val">${s.clearBreakawayDay?'Oplagt udbrudsetape':s.possibleBreakawayDay?'Mulig udbrudsetape':'Ikke primær udbrudsetape'}</div></div></div><div class="section"><h3 class="sectionTitle">Analyse</h3><p>${s.summary}</p></div><div class="section"><h3 class="sectionTitle">Hold øje med</h3><p>${s.watchFor}</p></div>${s.favorites?`<div class="section"><h3 class="sectionTitle">Ryttertyper</h3><p>${s.favorites}</p></div>`:''}<div class="section"><h3 class="sectionTitle">Kalendernote</h3><p>${s.note}</p></div><div class="navBtns"><button class="smallBtn" onclick="step(-1)">Forrige</button><button class="smallBtn" onclick="step(1)">Næste</button></div><div class="sourceNote">Internt overblik baseret på TV 2-etapenoter og officielle routedistancer. Udbrud er opdelt i oplagt og mulig ud fra analysen.</div>`}
function closeMobileDetails(){document.body.classList.remove('detailsOpen')}addEventListener('keydown',e=>{if(e.key==='Escape')closeMobileDetails()});function idx(){const e=document.querySelector('.stage.sel');return Math.max(0,stages.findIndex(s=>s.date===(e&&e.dataset.date)))}function step(n){let i=idx()+n;if(i<0)i=stages.length-1;if(i>=stages.length)i=0;select(stages[i].date)}function filters(){let f='all';const bs=document.querySelectorAll('.filter'),q=document.getElementById('search');function apply(){const x=q.value.trim().toLowerCase();document.querySelectorAll('.stage').forEach(e=>{const t=e.dataset.type,data=JSON.parse(e.dataset.search),ok=f==='all'||f===t||(f==='tt'&&(t==='itt'||t==='ttt'))||(f==='summit'&&data.summitfinish)||(f==='gcday'&&data.gcday)||(f==='clearbreakaway'&&data.clearbreakawayday)||(f==='possiblebreakaway'&&data.possiblebreakawayday),so=!x||e.dataset.search.includes(x);e.classList.toggle('hidden',!(ok&&so))})}bs.forEach(b=>b.onclick=()=>{bs.forEach(a=>a.classList.remove('active'));b.classList.add('active');f=b.dataset.filter;apply()});q.oninput=apply}build();filters();select('2026-07-04');if(matchMedia('(max-width:860px)').matches)closeMobileDetails();
</script>
</body>
