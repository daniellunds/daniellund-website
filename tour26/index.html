p.mapError{outline:1px solid rgba(157,74,66,.35);background:#f7f1ee}.routeStatus{margin:8px 0 0;color:#999;font-size:11.5px;line-height:1.4}.routeStatus.error{color:#9d4a42}.stageMap .leaflet-control-attribution{font-size:9px;background:rgba(251,250,246,.84)}.stageMap .leaflet-tile-pane{filter:saturate(.74) contrast(.96) brightness(1.03)}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);margin:20px 0 24px}.fact{background:#fff;min-height:64px;padding:12px}.lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#999;font-weight:750;margin-bottom:7px}.val{font-size:14px;line-height:1.25;font-weight:650}.section{border-top:1px solid var(--line2);padding-top:18px;margin-top:18px}.sectionTitle{margin:0 0 8px;font-size:11px;letter-spacing:.16em;color:#999;text-transform:uppercase}.section p{margin:0;font-size:14px;line-height:1.58;color:#2f2f2f}.nav{display:flex;gap:8px;margin-top:22px}.nav button{flex:1}.hidden{opacity:.16}.backdrop,.close{display:none}@media(max-width:1120px){.top{grid-template-columns:1fr}.controls{justify-content:flex-start}.layout{grid-template-columns:1fr}.details{position:relative;top:0;min-height:0}}@media(max-width:860px){.page{width:100%;margin:0;padding:18px 14px 28px}.top{display:block;margin-bottom:18px}.eyebrow{font-size:10px;margin-bottom:12px}h1{font-size:clamp(76px,22vw,100px);line-height:.84;letter-spacing:-.075em}.controls{margin-top:18px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:7px;padding:0 2px 8px;max-width:none;scrollbar-width:none}.controls::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;height:32px;font-size:12px}.search{flex:0 0 210px;min-width:210px;height:32px;font-size:12px}.layout{display:block}.calendar{border:0;background:transparent;border-radius:0;overflow:visible;box-shadow:none}.weekdays{display:none}.grid{display:block}.day{min-height:auto;display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:0;margin-bottom:9px;border:0;background:transparent}.empty{display:none}.date{margin:0;min-height:82px;display:flex;align-items:flex-start;justify-content:center;padding-top:13px;color:#5c5000;font-size:13px}.date.has{color:#171717}.stage{min-height:82px;border-left-width:3px;background:#fbfaf6;border-radius:14px;padding:13px 13px 12px 14px;box-shadow:0 1px 0 rgba(0,0,0,.04)}.stage.sel{border-left-width:3px;outline:1px solid #171717;background:linear-gradient(90deg,rgba(254,221,0,.24),#fbfaf6 55%)}.code{font-size:19px}.type{font-size:9px;max-width:50%}.route{font-size:13px}.meta{font-size:11px}.mini{display:none}.details{position:fixed;z-index:30;left:0;right:0;bottom:0;top:auto;width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;border-left:0;border-right:0;border-bottom:0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 24px));transition:transform 240ms ease;box-shadow:0 -18px 60px rgba(0,0,0,.2)}body.open .details{transform:translateY(0)}.backdrop{display:block;position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.26);opacity:0;pointer-events:none}body.open .backdrop{opacity:1;pointer-events:auto}.close{display:flex;position:sticky;top:0;margin:-2px 0 10px auto;height:32px;min-width:32px;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:999px;color:#555}.details h2{font-size:34px}.profileBox{overflow:hidden;width:100%}.profileBox img{width:100%;max-width:100%;min-width:0;height:auto}.stageMap{height:320px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.page{padding-left:10px;padding-right:10px}h1{font-size:clamp(76px,22vw,100px)}.day{grid-template-columns:34px minmax(0,1fr);gap:7px}.stageMap{height:280px}}

<script>
const stages=[
{d:'2026-07-04',n:1,t:'1. etape',r:'Barcelona → Barcelona',km:'19,6 km',ty:'Hold-TT',k:'ttt',hm:'ca. 220 hm',time:'ca. 17.05–19.15',w:'Middel/høj',gc:'Middel',s:`Kort og teknisk holdtidskørsel i Barcelona, hvor det først og fremmest handler om at komme sikkert og samlet gennem byen. Ruten er ikke lang nok til at afgøre Touren, men Montjuïc-afsnittet mod slutningen giver et tidligt fingerpeg om, hvilke klassementshold der har styr på organisation, fart og kommunikation. Små fejl i sving, rytmeskift eller holdformation kan hurtigt koste sekunder.`,watch:'Tidlige forskelle mellem klassementsholdene. Særligt UAE, Visma og Red Bull — Pogacar vs. Vingegaard.',fav:'Stærke holdtidskørselshold.',note:'Ikke forventet at skabe enorme tidsforskelle, men vigtig som første tekniske test.'},
{d:'2026-07-05',n:2,t:'2. etape',r:'Tarragona → Barcelona',km:'182 km',ty:'Kuperet',k:'hilly',hm:'ca. 2384 hm',time:'ca. 13.55–17.25',w:'Høj',gc:'Høj',s:`Første almindelige linjeetape har en markant hårdere finale, end man normalt ser så tidligt i Touren. Montjuïc gør Barcelona-afslutningen eksplosiv og svær at kontrollere, især hvis klassikertyper og klassementsryttere lugter en mulighed. Det er en etape, hvor ren topfart betyder mindre end placering, timing og evnen til at accelerere gentagne gange på korte stigninger. Den kan give både etapenervøsitet og de første små klassementsmarkeringer.`,watch:'Mulig tidlig duel mellem puncheurs og eksplosive klassementsryttere.',fav:'Pogacar, Mathieu van der Poel, Mads Pedersen og muligvis Vingegaard.',note:'Høj se-værdi især i Barcelona-finalen.',gcDay:1},
{d:'2026-07-06',n:3,t:'3. etape',r:'Granollers → Les Angles',km:'196 km',ty:'Bjerge',k:'mountain',hm:'ca. 3987 hm',time:'ca. 12.20–16.50',w:'Høj',gc:'Høj',s:`Den første store bjergdag kommer meget tidligt og fungerer som løbets første reelle stresstest for klassementet. Afslutningen mod Les Angles er lang nok til at afsløre manglende form, men sandsynligvis ikke brutal nok til at skabe enorme forskelle, medmindre et af topholdene vælger at køre hårdt langt udefra. Dagen er derfor vigtig som temperaturmåling: hvem sidder let, hvem bruger holdkammerater tidligt, og hvem må allerede køre defensivt?`,watch:'Den lange afslutning mod Les Angles kan afsløre svaghed hos klassementsryttere.',fav:'Eksplosive klassementsryttere.',note:'Første dag hvor klassementet for alvor kan flytte sig.',summit:1,gcDay:1},
{d:'2026-07-07',n:4,t:'4. etape',r:'Carcassonne → Foix',km:'182 km',ty:'Kuperet',k:'hilly',hm:'ca. 2778 hm',time:'ca. 13.25–17.20',w:'Middel/høj',gc:'Middel',s:`Terrænet er hårdt nok til at splitte feltet og gøre dagen vanskelig for sprinterne, men finalens profil peger mere mod udbrud end mod et rent klassementsopgør. Den afgørende dynamik bliver, hvor stærkt et udbrud der får lov at køre, og om nogen hold stadig har interesse i at kontrollere efter de første Pyrenæer-dage. Det er en god dag for alsidige ryttere, der kan klatre, køre stærkt på flad vej og afslutte taktisk.`,watch:'Sidste større stigning ligger langt nok fra mål til, at stærke udbrudsryttere kan holde hjem.',fav:'Van der Poel, Van Aert, Mads Pedersen, Magnus Cort, Andreas Kron.',note:'God taktisk udbrudsdag, men mindre GC-kritisk end E3.',clearBreak:1},
{d:'2026-07-08',n:5,t:'5. etape',r:'Lannemezan → Pau',km:'158 km',ty:'Flad',k:'flat',hm:'ca. 1990 hm',time:'ca. 14.15–17.30',w:'Middel',gc:'Lav',s:`På papiret ligner det den første reelle mulighed for sprinterne, men finalen ind mod Pau er ikke helt ukompliceret. De små bakker tæt på mål giver stærke hold mulighed for at gøre spurten mere selektiv og slide på de tungeste sprintere, hvis de ønsker det. Hvis feltet holder sammen, bør de hurtigste folk stadig være favoritter, men en hård kørt finale kan flytte balancen mod mere robuste sprintere og klassikertyper.`,watch:'De sidste små bakker inden for ca. 15 km kan gøre finalen mere selektiv.',fav:'Milan, Merlier, Kooij. Hårdt løb kan give Mads Pedersen bedre chance.',note:'Primært sprintdag, men ikke helt uden finale-nuance.'},
{d:'2026-07-09',n:6,t:'6. etape',r:'Pau → Gavarnie-Gèdre',km:'186 km',ty:'Bjerge',k:'mountain',hm:'ca. 4158 hm',time:'ca. 12.40–17.25',w:'Meget høj',gc:'Meget høj',s:`Dette er Tourens store Pyrenæer-dag og en af de første etaper, hvor klassementsholdene for alvor kan forsøge at flytte løbet. Afslutningen er ikke nødvendigvis den hårdeste del af dagen, så hvis der skal skabes store forskelle, skal presset sandsynligvis komme allerede på Tourmalet eller i overgangen derefter. Det gør etapen taktisk interessant: hold med stærke bjergdomestiques kan forsøge at isolere rivaler tidligt, mens et mere afventende løb kan åbne for et stærkt bjergudbrud.`,watch:'Hvis der skal skabes store GC-forskelle, skal angreb sandsynligvis komme allerede på Tourmalet.',fav:'Pogacar, Vingegaard, Evenepoel, Pidcock, Onley — eller bjergudbrud.',note:'Se fra Tourmalet og frem, ikke kun finalestigningen.',summit:1,gcDay:1},
{d:'2026-07-10',n:7,t:'7. etape',r:'Hagetmau → Bordeaux',km:'175 km',ty:'Flad',k:'flat',hm:'ca. 1675 hm',time:'ca. 13.25–17.05',w:'Lav/middel',gc:'Lav',s:`Efter flere krævende dage bør dette være en relativt klassisk sprinteretape. Bordeaux-finalen er historisk forbundet med massespurter, og ruten giver sprinterholdene gode betingelser for at holde udbruddet under kontrol. Det interessante bliver primært positioneringen i de sidste kilometer og hvor friske leadout-togene er efter den hårde start på Touren. Hvis vinden ikke spiller en rolle, vil topfart sandsynligvis veje tungere end taktisk list.`,watch:'Bordeaux-finale på bred boulevard; topfart tæller mest.',fav:'Rene topsprintere og stærke leadout-tog.',note:'Se sandsynligvis kun de sidste 10–15 km.'},
{d:'2026-07-11',n:8,t:'8. etape',r:'Périgueux → Bergerac',km:'182 km',ty:'Flad',k:'flat',hm:'ca. 1322 hm',time:'ca. 13.25–17.15',w:'Lav/middel',gc:'Lav',s:`Endnu en dag, hvor sprinterholdene bør have gode muligheder for at kontrollere løbet. Ruten er ikke helt pandekageflad, men den afsluttende del er tilpas let til, at et samlet felt er det mest sandsynlige udfald. Den største risiko for sprinterne er typisk manglende kontrol, træthed eller et stærkt sammensat udbrud, men under normale omstændigheder bør finalen handle om tog, timing og placering mere end om ruteprofilen.`,watch:'Tog, positionering og eventuel sidevind/løbsdynamik.',fav:'Pure sprinters.',note:'Primært finalen er interessant.'},
{d:'2026-07-12',n:9,t:'9. etape',r:'Malemort → Ussel',km:'185 km',ty:'Kuperet',k:'hilly',hm:'ca. 3412 hm',time:'ca. 13.45–17.40',w:'Middel/høj',gc:'Middel/lav',s:`Massif Central-terrænet gør denne etape meget velegnet til et stort og stærkt udbrud. Den er for kuperet til de rene sprintere, men sandsynligvis ikke hård nok til at klassementsholdene nødvendigvis vil bruge mange ressourcer før hviledagen. Derfor kan et tidligt udbrud få lang snor, særligt hvis det ikke indeholder farlige ryttere i klassementet. Den åbne profil passer godt til puncheurs, klassikertyper og ryttere med stor motor.`,watch:'Bredt udbrud med puncheurs, klassikertyper og stærke rouleurs.',fav:'Ardenner-/puncheurtyper, Van Aert, Mads P i topform.',note:'God udbrudsdag før hviledagen.',clearBreak:1},
{d:'2026-07-13',rest:1,t:'Hviledag',r:'Cantal',ty:'Hviledag',k:'rest',w:'-',gc:'-',s:`Første hviledag kommer efter en meget varieret åbning med både Barcelona, Pyrenæer og Massif Central. Det er et naturligt tidspunkt at gøre status på de første tegn i klassementet, sprinternes styrkeforhold og hvilke hold der allerede har brugt mange kræfter. Dagen handler især om restitution før en ny hård blok.`,watch:'Opsamling på Pyrenæerne og Massif Central-starten.',note:'God dag til highlights.'},
{d:'2026-07-14',n:10,t:'10. etape',r:'Aurillac → Le Lioran',km:'167 km',ty:'Bjerge',k:'mountain',hm:'ca. 3789 hm',time:'ca. 13.25–17.05',w:'Høj',gc:'Høj',s:`Efter hviledagen kommer en klassisk farlig etape: ikke den højeste eller mest brutale på papiret, men fuld af terræn hvor ryttere kan blive fanget forkert. Finalen omkring Le Lioran minder om et område, hvor små stigninger, nedkørsler og rytmeskift kan gøre lige så ondt som én lang bjergafslutning. Hvis klassementsholdene kører offensivt, kan dagen skabe overraskelser; hvis de tøver, er det en oplagt chance for et stærkt klatreudbrud.`,watch:'Finale over taktisk kuperet terræn; angreb kan komme før selve målområdet.',fav:'Pogacar, Vingegaard og GC-klatrere — eller stærkt bjergudbrud.',note:'Se især de sidste 40–50 km.',gcDay:1,maybeBreak:1},
{d:'2026-07-15',n:11,t:'11. etape',r:'Vichy → Nevers',km:'161 km',ty:'Flad',k:'flat',hm:'ca. 1827 hm',time:'ca. 14.05–17.25',w:'Lav',gc:'Lav',s:`Denne etape ligner en af løbets mest kontrollerbare sprinterdage. Efter bjerg- og udbrudsterræn vil sprinterholdene sandsynligvis se den som en nødvendig mulighed, og det gør det svært for et tidligt udbrud at holde hjem. Klassementsholdene vil primært fokusere på at undgå styrt, spare kræfter og komme sikkert gennem dagen. Den sportslige spænding ligger derfor næsten udelukkende i finalens positionering og leadout.`,watch:'Ren massespurt, hvis intet uventet sker.',fav:'Pure sprinters og leadout-tog.',note:'Sandsynligvis nok at se de sidste 10 km.'},
{d:'2026-07-16',n:12,t:'12. etape',r:'Nevers Magny-Cours → Chalon-sur-Saône',km:'181 km',ty:'Flad',k:'flat',hm:'ca. 1397 hm',time:'ca. 13.40–17.25',w:'Lav/middel',gc:'Lav',s:`Ruten er lidt mere levende end den foregående sprinteretape, men stadig klart sprintervenlig. Det afgørende bliver, om de hurtige holds mandskaber stadig er stærke nok til at kontrollere hele dagen, eller om et stort udbrud kan gøre det besværligt. Finalen virker ikke så teknisk, at den i sig selv ændrer favoritbilledet markant, så hvis feltet samles, bør de hurtigste sprintere og bedst organiserede tog igen stå med de bedste kort.`,watch:'Kontrol fra sprinterholdene og relativt ukompliceret finale.',fav:'Pure sprinters.',note:'Primært finalen er interessant.'},
{d:'2026-07-17',n:13,t:'13. etape',r:'Dole → Belfort',km:'205 km',ty:'Kuperet',k:'hilly',hm:'ca. 2611 hm',time:'ca. 13.20–17.40',w:'Middel/høj',gc:'Middel/lav',s:`Etapen ind mod Belfort ligner en klassisk overgangsdag, hvor et udbrud bør have rigtig gode muligheder. Ballon d’Alsace er hård nok til at gøre sprinterkontrol usandsynlig, men ligger for langt fra mål til automatisk at skabe et stort klassementsopgør. Det giver en bred favoritkreds: stærke rouleurs, puncheurs, klassikertyper og ryttere der kan overleve en hård stigning og stadig have fart i finalen.`,watch:'Ballon d’Alsace gør etapen for hård til normal spurt, men ligger for langt fra mål til stor GC-sortering.',fav:'Stærke udbrudsryttere, puncheurs, klassikertyper og muligvis Mads P.',note:'God Vosges-optakt før bjergweekenden.',clearBreak:1},
{d:'2026-07-18',n:14,t:'14. etape',r:'Mulhouse → Le Markstein Fellering',km:'155 km',ty:'Bjerge',k:'mountain',hm:'ca. 3941 hm',time:'ca. 13.30–17.20',w:'Høj',gc:'Høj',s:`Vosges-etapen er kortere end mange klassiske bjergetaper, men den bør ikke undervurderes. De gentagne stejle stigninger kan gøre dagen meget eksplosiv, og ryttere der har svært ved tempoændringer, kan hurtigt blive presset. Etapen passer godt til aggressiv kørsel, fordi der er flere steder at åbne løbet før finalen. Hvis klassementsholdene har modet, kan den blive en reel GC-dag; ellers er et stærkt klatreudbrud et meget sandsynligt scenarie.`,watch:'Grand Ballon, Col du Page, Ballon d’Alsace og Col du Haag/Le Markstein-sekvensen.',fav:'Pogacar/Vingegaard ved hårdt GC-løb; ellers stærkt klatreudbrud.',note:'Ikke undervurdér dagen — stigningerne er stejle og tæt pakkede.',gcDay:1,maybeBreak:1},
{d:'2026-07-19',n:15,t:'15. etape',r:'Champagnole → Plateau de Solaison',km:'184 km',ty:'Bjerge',k:'mountain',hm:'ca. 4701 hm',time:'ca. 13.20–17.35',w:'Meget høj',gc:'Meget høj',s:`Dette er en af løbets helt store klassementsdage. Den afsluttende stigning mod Plateau de Solaison er stejl og lang nok til, at de stærkeste rene klatrere bør komme til deres ret, især hvis tempoet allerede har været højt på de foregående stigninger. Etapen ligger lige før anden hviledag, hvilket ofte kan friste klassementshold til at bruge flere kræfter. Hvis UAE eller Visma kontrollerer hårdt, kan udbruddet blive neutraliseret, og så bør finalen give tydelige forskelle.`,watch:'Col de la Croisette/Le Salève og finalen på Plateau de Solaison.',fav:'Pogacar, Vingegaard og de stærkeste rene klatrere.',note:'En af løbets vigtigste etaper. Se gerne fra de sidste store stigninger.',summit:1,gcDay:1},
{d:'2026-07-20',rest:1,t:'Hviledag',r:'Haute-Savoie',ty:'Hviledag',k:'rest',w:'-',gc:'-',s:`Anden hviledag falder på et afgørende tidspunkt, lige efter en meget hård bjergafslutning og før enkeltstarten samt den sidste Alpe-blok. Den bør give et klart billede af, hvem der stadig er i kamp om klassementet, og hvilke hold der har ressourcer tilbage. Dagen er især vigtig til at vurdere, om nogen ryttere er på vej op eller ned i tredje uge.`,watch:'Status før enkeltstart og den afgørende Alpe-blok.',note:'God dag til klassementsoverblik.'},
{d:'2026-07-21',n:16,t:'16. etape',r:'Évian-les-Bains → Thonon-les-Bains',km:'26 km',ty:'Enkeltstart',k:'itt',hm:'ca. 465 hm',time:'ca. 13.00–17.45',w:'Høj',gc:'Høj',s:`Den eneste individuelle enkeltstart kan få stor betydning, især hvis klassementet stadig er tæt efter Plateau de Solaison. Ruten er ikke en ren tempomaskine-etape; den kræver rytmeskift, teknisk sikkerhed og evnen til både at klatre, descendere og holde fart på de fladere passager. Det gør den interessant for alsidige klassementsryttere og ikke kun for specialister. Små forskelle i pacing kan blive dyre, fordi der ikke er mange kilometer at rette fejl på.`,watch:'Skift mellem stigning, nedkørsel og flade tekniske passager.',fav:'Evenepoel som oplagt TT-favorit; ruten kan også passe Pogacar/Vingegaard.',note:'Høj GC-værdi, især hvis klassementet er tæt.',gcDay:1},
{d:'2026-07-22',n:17,t:'17. etape',r:'Chambéry → Voiron',km:'175 km',ty:'Flad',k:'flat',hm:'ca. 2361 hm',time:'ca. 13.35–17.15',w:'Middel',gc:'Lav',s:`Officielt er dette en flad etape, men den kommer efter en hård bjergblok og en enkeltstart, så feltets træthed kan gøre den mere åben end profilen antyder. Sprinterne får formentlig en af deres sidste reelle chancer før Paris, men holdene kan være slidte, og det kan give et udbrud lidt bedre muligheder. Hvis sprinterholdene stadig har kontrol, ender den samlet; hvis ikke, kan stærke allroundere udnytte et mere uroligt løb.`,watch:'Tidlig elevation og en finale, der kan blive hårdere hvis feltet er træt.',fav:'Milan, Merlier, Kooij ved kontrol; Mads P/Wout hvis det bliver hårdt.',note:'Se de sidste 20–30 km.'},
{d:'2026-07-23',n:18,t:'18. etape',r:'Voiron → Orcières-Merlette',km:'185 km',ty:'Bjerge',k:'mountain',hm:'ca. 3950 hm',time:'ca. 12.50–17.05',w:'Høj',gc:'Høj',s:`Første del af den afsluttende Alpe-blok er hård, men finalestigningen er mere jævn og mindre brutal end de største bjergafslutninger. Det kan gøre etapen taktisk: klassementsholdene skal beslutte, om de vil bruge kræfter her, eller gemme ammunition til Alpe d’Huez-dagene. Hvis klassementet er tæt, kan der stadig komme angreb på finalen, men hvis favoritterne markerer hinanden, er det en dag hvor et stærkt bjergudbrud kan holde hele vejen.`,watch:'Orcières-Merlette-finalen, ca. 7,1 km omkring 6,7 %.',fav:'Pogacar, Vingegaard, Evenepoel, Pidcock, Onley — eller stærkt bjergudbrud.',note:'Vigtig, men sandsynligvis mindre afgørende end E19/E20.',summit:1,gcDay:1,maybeBreak:1},
{d:'2026-07-24',n:19,t:'19. etape',r:'Gap → Alpe d’Huez',km:'128 km',ty:'Bjerge',k:'mountain',hm:'ca. 3605 hm',time:'ca. 14.15–17.20',w:'Høj',gc:'Høj',s:`En kort og prestigefyldt Alpe-etape med mål på Alpe d’Huez. Den kompakte længde kan gøre løbet eksplosivt, men også lidt mindre udmattende end en klassisk maraton-bjergdag. Col du Noyer før finalen kan bruges til at sætte træthed i benene, men meget afhænger af, om klassementet stadig er åbent, og om holdene vil bruge kræfter dagen før kongeetapen. Alpe d’Huez alene kan dog stadig skabe store forskelle, hvis de stærkeste angriber tidligt.`,watch:'Col du Noyer før den afsluttende Alpe d’Huez.',fav:'Pogacar og Vingegaard, hvis GC-holdene kontrollerer; udbrudschance findes.',note:'Høj prestige og GC-værdi, men E20 ligner den endnu større dag.',summit:1,gcDay:1,maybeBreak:1},
{d:'2026-07-25',n:20,t:'20. etape',r:'Le Bourg d’Oisans → Alpe d’Huez',km:'171 km',ty:'Bjerge',k:'mountain',hm:'ca. 5601 hm',time:'ca. 11.30–16.05',w:'Meget høj',gc:'Meget høj',s:`Kongeetapen er den store finaletest i Tour de France 2026. Kombinationen af Croix de Fer, Télégraphe, Galibier, Sarenne og Alpe d’Huez giver både højdemeter, højde og mulighed for langdistancepres. Det er en etape, hvor holdstyrke kan være lige så afgørende som den sidste acceleration, fordi favoritter kan isoleres længe før finalestigningen. Hvis klassementet stadig er tæt, er dette dagen hvor løbet kan knække helt åbent.`,watch:'Højden, den enorme samlede stigning og muligheden for langdistancepres.',fav:'Vingegaard kan have terræn til udholdenheds-/højdepreset; Pogacar er stadig central.',note:'Top 2–3 must-watch etape. Se fra tidlige store stigninger hvis muligt.',summit:1,gcDay:1},
{d:'2026-07-26',n:21,t:'21. etape',r:'Thoiry → Paris Champs-Élysées',km:'130 km',ty:'Flad',k:'flat',hm:'ca. 1847 hm',time:'ca. 16.25–19.30',w:'Middel/høj',gc:'Lav',s:`Finalen i Paris er ikke længere nødvendigvis den helt klassiske parade frem mod en ren Champs-Élysées-spurt. Montmartre-elementet kan gøre finalen mere uforudsigelig og give klassikertyper eller stærke sprintere en mulighed for at sætte løbet under pres. Samtidig ligger stigningen sandsynligvis langt nok fra mål til, at sprinterholdene kan nå at samle sig igen, hvis de stadig har mandskab tilbage. Derfor balancerer etapen mellem traditionel sprintafslutning og en mere taktisk Paris-finale.`,watch:'Montmartre kan gøre finalen mere selektiv, men placeringen længere fra mål giver sprinterhold tid til at samle sig.',fav:'Merlier, Milan, Philipsen-typer; hardføre sprintere/klassikertyper kan få fordel.',note:'Mere interessant end klassisk parade/sprint, men nok ikke GC-relevant.'}
];
const C={flat:'#477a9d',hilly:'#6f8f62',mountain:'#9d4a42',ttt:'#b9824d',itt:'#b9824d',rest:'#888'},T={flat:'Flad etape',hilly:'Kuperet etape',mountain:'Bjergetape',ttt:'Holdtidskørsel',itt:'Enkeltstart',rest:'Hviledag'};
function dateStr(d){return`2026-07-${String(d).padStart(2,'0')}`}function onDay(d){return stages.find(s=>s.d===d)}function fmt(d){return new Date(d+'T12:00').toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function profile(t){const c=C[t]||'#111';if(t==='flat')return`<svg viewBox='0 0 240 40' preserveAspectRatio='none'><path d='M4 24 L236 24' stroke='${c}' stroke-width='3' fill='none' stroke-linecap='round'/></svg>`;if(t==='hilly')return`<svg viewBox='0 0 240 40' preserveAspectRatio='none'><path d='M4 27 C28 12 52 34 78 20 S126 8 154 22 S200 33 236 13' stroke='${c}' stroke-width='3.5' fill='none' stroke-linecap='round'/></svg>`;if(t==='mountain')return`<svg viewBox='0 0 240 40' preserveAspectRatio='none'><path d='M4 34 L38 12 L72 34 L112 6 L154 34 L188 16 L236 34' stroke='${c}' stroke-width='3.5' fill='none' stroke-linejoin='round' stroke-linecap='round'/></svg>`;if(t==='itt'||t==='ttt')return`<svg viewBox='0 0 240 40' preserveAspectRatio='none'><circle cx='120' cy='22' r='12' stroke='${c}' stroke-width='3' fill='none'/><path d='M120 22 L120 13 M120 22 L128 27 M111 6 H129' stroke='${c}' stroke-width='3' stroke-linecap='round'/></svg>`;return''}function img(s){return s.n?`/tour26/profiles/e${s.n}.avif`:''}function gpx(s){return s.n?`/tour26/routes/gpx/tdf2026_stage_${String(s.n).padStart(2,'0')}.gpx`:''}function finish(s){return s.summit?'Bjergafslutning':s.k==='mountain'?'Bjergetape uden klar bjergafslutning':s.rest?'Hviledag':'Ikke bjergafslutning'}function br(s){return s.clearBreak?'Oplagt udbrudsetape':s.maybeBreak?'Mulig udbrudsetape':'Ikke primær udbrudsetape'}
let map=null,routeLayer=null,req=0;function statusMsg(m,e=false){const el=document.getElementById('route-status');if(el){el.textContent=m;el.classList.toggle('error',e)}}function parseGpx(txt){const xml=new DOMParser().parseFromString(txt,'application/xml');if(xml.querySelector('parsererror'))throw Error('GPX parse error');const pts=[...xml.querySelectorAll('trkpt'),...xml.querySelectorAll('rtept')].map(n=>{const lat=Number(n.getAttribute('lat')),lon=Number(n.getAttribute('lon'));return Number.isFinite(lat)&&Number.isFinite(lon)?[lat,lon]:null}).filter(Boolean);if(!pts.length)throw Error('Ingen punkter');return pts}function initMap(){const el=document.getElementById('stage-map');if(!el||!window.L)return null;if(map){map.remove();map=null}map=window.L.map(el,{zoomControl:false,attributionControl:true,scrollWheelZoom:false,doubleClickZoom:true,dragging:true,tap:true});window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);map.setView([46.85,2.35],5);return map}async function showRoute(s){const id=++req,el=document.getElementById('stage-map');if(!s||!s.n||!el)return;el.classList.remove('mapError');statusMsg('Ruten loader fra GPX-fil.');const m=initMap();if(!m){statusMsg('Kortbiblioteket kunne ikke indlæses.',true);return}const url=new URL(gpx(s),location.origin).href;try{const res=await fetch(url,{cache:'force-cache'});if(id!==req)return;if(!res.ok)throw Error(`HTTP ${res.status}`);const pts=parseGpx(await res.text());window.L.polyline(pts,{color:'#171717',weight:7,opacity:.22,lineCap:'round',lineJoin:'round'}).addTo(m);routeLayer=window.L.polyline(pts,{color:'#FEDD00',weight:4,opacity:.98,lineCap:'round',lineJoin:'round'}).addTo(m);window.L.circleMarker(pts[0],{radius:4,color:'#171717',weight:2,fillColor:'#fbfaf6',fillOpacity:1}).addTo(m);window.L.circleMarker(pts[pts.length-1],{radius:5,color:'#171717',weight:2,fillColor:'#FEDD00',fillOpacity:1}).addTo(m);const b=routeLayer.getBounds();setTimeout(()=>{m.invalidateSize();if(b.isValid())m.fitBounds(b,{padding:[22,22],maxZoom:12})},160);statusMsg(`Rute indlæst · ${pts.length.toLocaleString('da-DK')} punkter`)}catch(e){if(id!==req)return;el.classList.add('mapError');statusMsg('GPX-ruten kunne ikke indlæses. Tjek filsti og console.',true)}}
function build(){const g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<2;i++){const e=document.createElement('div');e.className='day empty';g.appendChild(e)}for(let d=1;d<=31;d++){const s=onDay(dateStr(d)),cell=document.createElement('div');cell.className='day';cell.innerHTML=`<div class='date ${s?'has':''}'>${d}</div>`;if(s){const b=document.createElement('button');b.className='stage';b.dataset.date=s.d;b.dataset.type=s.k;b.dataset.search=JSON.stringify(s).toLowerCase();b.style.setProperty('--c',C[s.k]);if(s.rest){b.innerHTML=`<div class='code'>Hviledag</div><div class='route'>${s.r}</div>`}else{b.innerHTML=`<div class='code'>${s.n}. etape</div><div class='type'>${T[s.k]}</div><div class='route'>${s.r}</div><div class='meta'>${s.km} · ${s.time}</div><div class='mini'>${profile(s.k)}</div>`}b.onclick=()=>select(s.d);cell.appendChild(b)}g.appendChild(cell)}for(let i=0;i<2;i++){const e=document.createElement('div');e.className='day empty';g.appendChild(e)}}
function select(date){const s=onDay(date);if(!s)return;if(matchMedia('(max-width:860px)').matches)document.body.classList.add('open');document.querySelectorAll('.stage').forEach(e=>e.classList.toggle('sel',e.dataset.date===date));const d=document.getElementById('details');d.style.setProperty('--c',C[s.k]);d.innerHTML=`<button class='close' onclick='closeDetails()'>×</button><div class='detailsType'>${T[s.k]}</div><h2>${s.t}</h2><div class='detailsRoute'>${fmt(s.d)}<br>${s.r}</div><div class='profile'>${img(s)?`<div class='profileBox'><img src='${img(s)}' alt='Etapeprofil for ${s.t}' loading='lazy' onerror='this.closest(".profile").innerHTML=profile("${s.k}")'></div>`:profile(s.k)}</div>${s.n?`<div class='routeMap'><h3 class='sectionTitle'>Rute</h3><div id='stage-map' class='stageMap'></div><p id='route-status' class='routeStatus'>Ruten loader fra GPX-fil.</p></div>`:''}<div class='facts'><div class='fact'><div class='lab'>Distance</div><div class='val'>${s.km||'—'}</div></div><div class='fact'><div class='lab'>Højdemeter</div><div class='val'>${s.hm||'—'}</div></div><div class='fact'><div class='lab'>TV-tid</div><div class='val'>${s.time||'—'}</div></div><div class='fact'><div class='lab'>Se-værdi</div><div class='val'>${s.w}</div></div><div class='fact'><div class='lab'>GC-relevans</div><div class='val'>${s.gc}${s.gcDay?' · Klassementsdag':''}</div></div><div class='fact'><div class='lab'>Profil</div><div class='val'>${s.ty}</div></div><div class='fact'><div class='lab'>Måltype</div><div class='val'>${finish(s)}</div></div><div class='fact'><div class='lab'>Udbrud</div><div class='val'>${br(s)}</div></div></div><div class='section'><h3 class='sectionTitle'>Analyse</h3><p>${s.s}</p></div><div class='section'><h3 class='sectionTitle'>Hold øje med</h3><p>${s.watch}</p></div>${s.fav?`<div class='section'><h3 class='sectionTitle'>Ryttertyper</h3><p>${s.fav}</p></div>`:''}<div class='section'><h3 class='sectionTitle'>Kalendernote</h3><p>${s.note}</p></div><div class='nav'><button class='small' onclick='step(-1)'>Forrige</button><button class='small' onclick='step(1)'>Næste</button></div>`;setTimeout(()=>showRoute(s),120)}function closeDetails(){document.body.classList.remove('open')}addEventListener('keydown',e=>{if(e.key==='Escape')closeDetails()});function idx(){const e=document.querySelector('.stage.sel');return Math.max(0,stages.findIndex(s=>s.d===(e&&e.dataset.date)))}function step(n){let i=idx()+n;if(i<0)i=stages.length-1;if(i>=stages.length)i=0;select(stages[i].d)}function filters(){let f='all';const bs=document.querySelectorAll('.filter'),q=document.getElementById('search');function apply(){const x=q.value.trim().toLowerCase();document.querySelectorAll('.stage').forEach(e=>{const t=e.dataset.type,data=JSON.parse(e.dataset.search),ok=f==='all'||f===t||(f==='tt'&&(t==='itt'||t==='ttt'))||(f==='summit'&&data.summit)||(f==='gcday'&&data.gcday)||(f==='clearbreakaway'&&data.clearbreak)||(f==='possiblebreakaway'&&data.maybebreak),so=!x||e.dataset.search.includes(x);e.classList.toggle('hidden',!(ok&&so))})}bs.forEach(b=>b.onclick=()=>{bs.forEach(a=>a.classList.remove('active'));b.classList.add('active');f=b.dataset.filter;apply()});q.oninput=apply}build();filters();select('2026-07-04');if(matchMedia('(max-width:860px)').matches)closeDetails();
</script></body></html>
