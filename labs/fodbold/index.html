<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sweco vs COWI — 1v1 fodbold</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#07120a;color:#ecfdf5;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 0,#1b4d22 0,#07120a 62%)}
  .wrap{width:min(1040px,98vw)}
  .top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:10px}.top a{color:#bbf7d0;text-decoration:none;font-size:13px;opacity:.8}.top a:hover{opacity:1}.top h1{font-size:clamp(20px,3vw,34px);margin:0;letter-spacing:-.03em}.top p{margin:.25rem 0 0;color:#cbd5e1;font-size:14px}
  .panel{position:relative;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:12px;box-shadow:0 22px 60px rgba(0,0,0,.38)}
  canvas{display:block;width:100%;height:auto;border-radius:12px;background:#113f19;outline:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}.hint{font-size:13px;color:#d1fae5;opacity:.9}.buttons{display:flex;gap:8px}button{border:1px solid rgba(255,255,255,.18);background:#0f172a;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}
  #overlay{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center}.msg{max-width:min(900px,92vw);text-align:center;font-weight:950;font-size:clamp(32px,6.8vw,88px);line-height:1.02;text-shadow:0 10px 28px rgba(0,0,0,.55);opacity:0;color:white}.show{animation:wiggle 1.45s ease,fade 1.55s ease forwards}@keyframes wiggle{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-1.4deg)}40%{transform:translateX(7px) rotate(1.4deg)}60%{transform:translateX(-5px) rotate(-1deg)}80%{transform:translateX(5px) rotate(1deg)}}@keyframes fade{0%,78%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><a href="/lab/">← Tilbage til laboratoriet</a><h1>1v1 fodbold</h1><p>Sweco vs COWI — først til 5 mål.</p></div></div>
  <div class="panel">
    <canvas id="game" width="940" height="640" tabindex="0" aria-label="Sweco mod COWI 1v1 fodboldspil"></canvas>
    <div class="bar">
      <div class="hint"><strong>Sweco:</strong> WASD, Left Shift spark, Space sprint · <strong>COWI:</strong> piletaster, Right Shift spark, Numpad 0 sprint · P pause · R reset</div>
      <div class="buttons"><button id="pause">Pause</button><button id="reset">Reset</button></div>
    </div>
  </div>
</div>
<div id="overlay"><div id="overlayText" class="msg"></div></div>
<script>
(()=>{'use strict';
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),pauseBtn=document.getElementById('pause'),resetBtn=document.getElementById('reset'),overlayText=document.getElementById('overlayText');
const C={W:900,H:540,PAD:20,TOP:74,GOAL:178,PR:23,BR:14,ACC:.46,FRIC:.88,BFRIC:.992,WALL:.92,KICK:9.8,WIN:5,MAX:6.6,SMAX:8.9,SMULT:1.78,DRAIN:.42,REGEN:.30,MIN:.06};
const keys=new Set(); let last=performance.now();
const mouth1=C.H/2-C.GOAL/2,mouth2=C.H/2+C.GOAL/2;
const state={paused:false,scoreL:0,scoreR:0,winner:''};
const left={team:'L',name:'Sweco',x:C.W*.25,y:C.H/2,vx:0,vy:0,r:C.PR,m:2.2,base:'#fff',ring:'#0f2e77',lastKick:0,stamina:1,sprinting:false};
const right={team:'R',name:'COWI',x:C.W*.75,y:C.H/2,vx:0,vy:0,r:C.PR,m:2.2,base:'#fff3d6',ring:'#0f2e77',lastKick:0,stamina:1,sprinting:false};
const ball={x:C.W/2,y:C.H/2,vx:0,vy:0,r:C.BR,m:1};
const gameKeys=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','Space','Numpad0','KeyP','KeyR'];
function keyHandler(e,down){if(gameKeys.includes(e.code)){e.preventDefault();e.stopPropagation()} if(down){keys.add(e.code); if(e.code==='KeyP')togglePause(); if(e.code==='KeyR')reset(true)} else keys.delete(e.code)}
window.addEventListener('keydown',e=>keyHandler(e,true),{capture:true}); window.addEventListener('keyup',e=>keyHandler(e,false),{capture:true});
cvs.addEventListener('pointerdown',()=>cvs.focus()); pauseBtn.onclick=()=>togglePause(); resetBtn.onclick=()=>reset(true);
function clamp(v,a,b){return Math.max(a,Math.min(b,v))} function nrm(x,y){const d=Math.hypot(x,y)||1;return[x/d,y/d]} function cap(p,m){const v=Math.hypot(p.vx,p.vy);if(v>m){p.vx*=m/v;p.vy*=m/v}}
function react(l,r){const t={'0:0':'Kampen er i gang – hvem scorer først?','1:1':'Et mål hver – nu bliver det spændende!','2:2':'De følger hinanden tæt!','3:3':'Det er en vaskeægte gyser!','4:4':'Næste mål kan være afgørende!'};const h={'1:0':'Hjemmeholdet stikker næsen frem!','2:0':'Er det her starten på en ydmygelse?','3:0':'Av – udeholdet skal vågne op!','4:0':'Det ligner en massakre!','5:0':'Game over! Hjemmeholdet smadrer alt!','2:1':'Hjemmeholdet holder snuden foran.','3:1':'Hjemmeholdet begynder at trække fra!','4:1':'Hjemmeholdet lugter blod!','5:1':'Hjemmeholdet vinder med stil!','3:2':'Det er tæt – men hjemmeholdet fører!','4:2':'Hjemmeholdet ser stærke ud!','5:2':'Solid sejr til hjemmeholdet!','4:3':'Hårfin føring – hvem har nerverne?','5:3':'Hjemmeholdet lukker kampen – flot spillet!','5:4':'Sikke en afslutning – hjemmeholdet hiver sejren hjem!'};const a={'0:1':'Udeholdet starter stærkt!','0:2':'Er hjemmeholdet faldet i søvn?','0:3':'Det sejler for hjemmeholdet!','0:4':'Publikum vender sig væk...','0:5':'Game over! Udeholdet udklasserer dem!','1:2':'Udeholdet holder teten!','1:3':'Udeholdet trækker fra!','1:4':'Hjemmeholdet er i knæ!','1:5':'Udeholdet slår til – kampen er slut!','2:3':'Tæt kamp, men udeholdet fører!','2:4':'Udeholdet har styr på det!','2:5':'Flot sejr til udeholdet!','3:4':'Udeholdet holder lige nøjagtigt fast!','3:5':'Udeholdet lukker kampen – stærkt spillet!','4:5':'Udeholdet vinder i en sand thriller!'};const k=l+':'+r;return l===r&&t[k]?t[k]:l>r&&h[k]?h[k]:r>l&&a[k]?a[k]:(l>r?'Hjemmeholdet er foran.':r>l?'Udeholdet er foran.':'Spillet er i gang!')}
function show(txt){overlayText.textContent=txt;overlayText.classList.remove('show');void overlayText.offsetWidth;overlayText.classList.add('show')}
function togglePause(){state.paused=!state.paused;pauseBtn.textContent=state.paused?'Resume':'Pause'}
function reset(score){if(score){state.scoreL=0;state.scoreR=0;state.winner=''} kickoff(false); state.paused=false; pauseBtn.textContent='Pause'}
function kickoff(random=true){ball.x=C.W/2;ball.y=C.H/2;ball.vx=random?(Math.random()<.5?-3:3):0;ball.vy=random?(Math.random()-.5)*3:0;left.x=C.W*.25;left.y=C.H/2;right.x=C.W*.75;right.y=C.H/2;for(const p of [left,right]){p.vx=p.vy=0;p.stamina=1;p.sprinting=false}}
function applyPlayer(p,ax,ay,wantsSprint,dt){const moving=ax||ay;const canSprint=wantsSprint&&moving&&p.stamina>C.MIN;if(moving){const [x,y]=nrm(ax,ay),mul=canSprint?C.SMULT:1;p.vx+=x*C.ACC*mul;p.vy+=y*C.ACC*mul;cap(p,canSprint?C.SMAX:C.MAX)}p.sprinting=!!canSprint;if(canSprint)p.stamina=clamp(p.stamina-C.DRAIN*dt,0,1);else p.stamina=clamp(p.stamina+C.REGEN*dt,0,1)}
function inputs(dt){let ax=0,ay=0;if(keys.has('KeyA'))ax--;if(keys.has('KeyD'))ax++;if(keys.has('KeyW'))ay--;if(keys.has('KeyS'))ay++;applyPlayer(left,ax,ay,keys.has('Space'),dt);ax=0;ay=0;if(keys.has('ArrowLeft'))ax--;if(keys.has('ArrowRight'))ax++;if(keys.has('ArrowUp'))ay--;if(keys.has('ArrowDown'))ay++;applyPlayer(right,ax,ay,keys.has('Numpad0'),dt)}
function step(dt){for(const p of [left,right]){p.x+=p.vx;p.y+=p.vy;p.vx*=C.FRIC;p.vy*=C.FRIC;p.x=clamp(p.x,p.r,C.W-p.r);p.y=clamp(p.y,p.r,C.H-p.r)}ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=C.BFRIC;ball.vy*=C.BFRIC;if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=-ball.vy*C.WALL}if(ball.y+ball.r>C.H){ball.y=C.H-ball.r;ball.vy=-ball.vy*C.WALL}if(ball.x-ball.r<0&&(ball.y<mouth1||ball.y>mouth2)){ball.x=ball.r;ball.vx=-ball.vx*C.WALL}if(ball.x+ball.r>C.W&&(ball.y<mouth1||ball.y>mouth2)){ball.x=C.W-ball.r;ball.vx=-ball.vx*C.WALL}collide(left,right);collide(left,ball);collide(right,ball);kick(left,keys.has('ShiftLeft'));kick(right,keys.has('ShiftRight'));goals()}
function collide(a,b){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.0001,min=a.r+b.r;if(d>=min)return;const nx=dx/d,ny=dy/d,over=min-d,ia=1/a.m,ib=1/b.m,sum=ia+ib;a.x-=nx*over*(ia/sum);a.y-=ny*over*(ia/sum);b.x+=nx*over*(ib/sum);b.y+=ny*over*(ib/sum);const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;if(vn<0){const j=-(1+1)*vn/sum,ix=j*nx,iy=j*ny;a.vx-=ix*ia;a.vy-=iy*ia;b.vx+=ix*ib;b.vy+=iy*ib}}
function kick(p,held){if(!held)return;const now=performance.now();if(now-p.lastKick<150)return;const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);if(d<p.r+ball.r+9){const [nx,ny]=nrm(dx,dy);ball.vx+=nx*C.KICK+p.vx*.25;ball.vy+=ny*C.KICK+p.vy*.25;p.vx-=nx*1.8;p.vy-=ny*1.8;p.lastKick=now}}
function goals(){if(ball.y>mouth1&&ball.y<mouth2){if(ball.x-ball.r>C.W)score('L');if(ball.x+ball.r<0)score('R')}}
function score(team){if(team==='L')state.scoreL++;else state.scoreR++;const txt=react(state.scoreL,state.scoreR);show(txt);if((team==='L'?state.scoreL:state.scoreR)>=C.WIN){state.winner=(team==='L'?'Sweco':'COWI')+' vinder!';state.paused=true;pauseBtn.textContent='Resume'}else{state.paused=true;setTimeout(()=>{if(!state.winner){kickoff(true);state.paused=false}},700)}}
function draw(){const ox=C.PAD,oy=C.PAD+C.TOP;ctx.clearRect(0,0,cvs.width,cvs.height);ctx.save();ctx.translate(ox,oy);pitch();player(left);player(right);ballDraw();ctx.restore();board()}
function pitch(){const g=ctx.createLinearGradient(0,0,0,C.H);g.addColorStop(0,'#1b5b23');g.addColorStop(1,'#0f3616');ctx.fillStyle=g;ctx.fillRect(0,0,C.W,C.H);for(let i=0;i<10;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.035)':'rgba(0,0,0,.035)';ctx.fillRect(i*C.W/10,0,C.W/10,C.H)}ctx.strokeStyle='rgba(255,255,255,.86)';ctx.lineWidth=2;ctx.strokeRect(0,0,C.W,C.H);ctx.beginPath();ctx.moveTo(C.W/2,0);ctx.lineTo(C.W/2,C.H);ctx.stroke();ctx.beginPath();ctx.arc(C.W/2,C.H/2,72,0,Math.PI*2);ctx.stroke();ctx.strokeRect(0,C.H/2-120,118,240);ctx.strokeRect(C.W-118,C.H/2-120,118,240);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,mouth1);ctx.lineTo(14,mouth1);ctx.moveTo(0,mouth2);ctx.lineTo(14,mouth2);ctx.moveTo(C.W-14,mouth1);ctx.lineTo(C.W,mouth1);ctx.moveTo(C.W-14,mouth2);ctx.lineTo(C.W,mouth2);ctx.stroke()}
function player(p){const rr=p.r+9,ang=-Math.PI/2+p.stamina*Math.PI*2;ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,rr,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=4;ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,rr,-Math.PI/2,ang);ctx.strokeStyle=p.stamina>.55?'#22c55e':p.stamina>.22?'#facc15':'#ef4444';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();if(p.sprinting){ctx.beginPath();ctx.arc(p.x,p.y,p.r+15,0,Math.PI*2);ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(250,204,21,.7)';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([])}const age=performance.now()-p.lastKick;if(age<140){ctx.beginPath();ctx.arc(p.x,p.y,p.r+7*(1-age/140),0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=3;ctx.stroke()}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.base;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=p.ring;ctx.stroke();ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,p.r-6,0,Math.PI*2);ctx.clip();p.team==='L'?swecoLogo(p.x,p.y,.118):cowiLogo(p.x,p.y,(p.r-6)*2,(p.r-7)*1.5);ctx.restore();ctx.restore()}
function poly(a){ctx.beginPath();ctx.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)ctx.lineTo(a[i][0],a[i][1]);ctx.closePath();ctx.fill()}
function swecoLogo(x,y,s){ctx.save();ctx.translate(x,y+1);ctx.scale(s,s);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-84,22,0,Math.PI*2);ctx.fill();poly([[-92,-56],[-70,-78],[0,-8],[70,-78],[92,-56],[20,16],[92,88],[70,110],[0,40],[-70,110],[-92,88],[-20,16]]);ctx.fillRect(-110,-15,220,30);ctx.lineWidth=30;ctx.lineJoin='miter';ctx.lineCap='butt';ctx.strokeStyle='#111';ctx.beginPath();ctx.moveTo(-76,52);ctx.lineTo(-76,116);ctx.lineTo(76,116);ctx.lineTo(76,52);ctx.stroke();ctx.restore()}
function cowiLogo(x,y,maxW,maxH){ctx.save();ctx.font='900 92px Georgia,Times New Roman,serif';ctx.textAlign='center';ctx.textBaseline='middle';const m=ctx.measureText('COWI'),h=(m.actualBoundingBoxAscent||75)+(m.actualBoundingBoxDescent||18),s=Math.min(maxW/m.width,maxH/h);ctx.translate(x,y+1);ctx.scale(s,s);ctx.fillStyle='#f04a23';ctx.fillText('COWI',0,0);ctx.restore()}
function ballDraw(){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(ball.x-4,ball.y-4,4,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.12)';ctx.fill()}
function board(){const y=14,h=56,x=C.PAD,w=C.W;ctx.fillStyle='rgba(2,6,23,.7)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.strokeRect(x+.5,y+.5,w-1,h-1);swecoLogo(x+34,y+h/2,.10);cowiLogo(x+w-44,y+h/2,58,22);ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.font='800 26px system-ui';ctx.textAlign='center';ctx.fillText(state.scoreL+' : '+state.scoreR,x+w/2,y+h/2);ctx.font='700 15px system-ui';ctx.textAlign='left';ctx.fillText('Sweco',x+60,y+h/2);ctx.textAlign='right';ctx.fillText('COWI',x+w-82,y+h/2);if(state.winner){ctx.fillStyle='#fde68a';ctx.font='800 18px system-ui';ctx.textAlign='center';ctx.fillText(state.winner,x+w/2,y+h-8)}}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(!state.paused){inputs(dt);step(dt)}draw();requestAnimationFrame(loop)}
try{reset(true);show(react(0,0));requestAnimationFrame(loop)}catch(err){document.body.innerHTML='<pre style="white-space:pre-wrap;color:#111;background:white;padding:20px">JS error: '+err.message+'</pre>';console.error(err)}
})();
</script>
</body>
</html>
