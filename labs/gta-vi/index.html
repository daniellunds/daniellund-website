<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fff8f0">
<meta name="description" content="One frame closer to Grand Theft Auto VI. One frame every minute until November 19, 2026.">
<title>One Frame Closer — GTA VI Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme:light; --paper:#fff8f0; --text:#272b2b; --muted:#8e8c86; --accent:#bd7756; }
  * { box-sizing:border-box; }
  html { min-height:100%; }
  body { margin:0; min-height:100%; background:var(--paper); color:var(--text); font-family:'Outfit',sans-serif; }
  .page {
    isolation:isolate; position:relative; z-index:1; min-height:100vh; min-height:100dvh;
    padding:12px 0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(8px,1.4vh,16px);
  }
  .countdown-area { text-align:center; width:min(100%,930px); padding:0 18px; flex:0 0 auto; }
  .kicker { margin:0 0 5px; font-weight:500; font-size:clamp(10px,1vw,12px); letter-spacing:.26em; text-transform:uppercase; color:#6f736d; }
  .clock { display:flex; align-items:flex-start; justify-content:center; gap:clamp(12px,3.8vw,76px); }
  .clock-unit { min-width:0; text-align:center; }
  .clock-value { display:block; font-size:clamp(40px,5.5vw,70px); line-height:1.0; letter-spacing:-.055em; font-variant-numeric:tabular-nums; font-weight:500; }
  .clock-label { display:block; font-size:clamp(9px,.85vw,11px); font-weight:500; letter-spacing:.19em; color:var(--muted); padding-top:5px; text-transform:uppercase; }
  /* Reserve enough viewport height for the countdown and frame metadata.
     On a 16:9 screen the image scales down slightly so it is all visible. */
  .visual { margin:0; width:min(100vw,calc((100dvh - 235px) * 16 / 9)); max-width:100vw; flex:0 0 auto; }
  .frame { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:linear-gradient(160deg,#243252,#bc6186,#f2b48e); }
  .frame img { display:block; width:100%; height:100%; object-fit:contain; }
  .progress { height:2px; width:100%; background:#e2d9cf; }
  .progress-fill { height:100%; background:var(--accent); width:0%; }
  .metadata { padding:11px 2px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; color:#747872; font-size:clamp(10px,1vw,12px); font-weight:400; letter-spacing:.08em; font-variant-numeric:tabular-nums; }
  .metadata span:last-child { text-align:right; }
  .demo-note { margin:0; padding:0 10px; text-align:center; font-size:10px; color:#a19d96; letter-spacing:.06em; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media(max-width:600px) {
    .page { gap:11px; padding:12px 0; }
    .kicker { margin-bottom:10px; }
    .clock { gap:clamp(13px,4.5vw,24px); }
    .clock-value { font-size:clamp(34px,10vw,60px); }
    .clock-label { font-size:9px; letter-spacing:.12em; }
    .visual { width:min(100vw,calc((100dvh - 178px) * 16 / 9)); }
    .metadata { padding:10px 12px 0; font-size:10px; letter-spacing:0; }
    .demo-note { font-size:9px; }
  }
  @media(max-height:460px) and (orientation:landscape) {
    .page { gap:5px; padding:6px 0; }
    .kicker { margin-bottom:1px; }
    .clock-value { font-size:clamp(25px,7vh,36px); }
    .clock-label { font-size:8px; padding-top:1px; }
    .visual { width:min(100vw,calc((100dvh - 125px) * 16 / 9)); }
    .metadata { padding-top:5px; font-size:9px; }
    .demo-note { font-size:8px; }
  }
</style>
</head>
<body>
<div class="fixed inset-0 z-0 pointer-events-none"
     style="background-image:
       radial-gradient(circle at 20% 80%, rgba(255, 182, 153, 0.3) 0%, transparent 50%),
       radial-gradient(circle at 80% 20%, rgba(255, 244, 214, 0.5) 0%, transparent 50%),
       radial-gradient(circle at 40% 40%, rgba(255, 182, 153, 0.1) 0%, transparent 50%);">
</div>
<main class="page">
  <section class="countdown-area" aria-label="Countdown to Grand Theft Auto VI">
    <h1 class="kicker">GTA VI · NOVEMBER 19, 2026</h1>
    <div class="clock" role="timer" aria-label="Time until release">
      <div class="clock-unit"><span class="clock-value" id="days">--</span><span class="clock-label">Days</span></div>
      <div class="clock-unit"><span class="clock-value" id="hours">--</span><span class="clock-label">Hours</span></div>
      <div class="clock-unit"><span class="clock-value" id="minutes">--</span><span class="clock-label">Minutes</span></div>
      <div class="clock-unit"><span class="clock-value" id="seconds">--</span><span class="clock-label">Seconds</span></div>
    </div>
  </section>
  <figure class="visual">
    <div class="frame">
      <img id="frameImage" src="/api/gta-frame" alt="A simulated frame of a sunset city skyline, displayed at the globally synchronized minute." fetchpriority="high">
    </div>
    <div class="progress" role="progressbar" aria-label="Frames revealed so far" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="trailerProgress">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <figcaption class="metadata">
      <span id="frameCounter">FRAME — / 48,240</span>
      <span id="nextFrame">NEXT FRAME IN 00:--</span>
    </figcaption>
  </figure>
  <p class="demo-note">ONE FRAME EVERY MINUTE · SIMULATED FOOTAGE FOR TESTING</p>
  <span id="syncStatus" role="status" class="sr-only" aria-live="polite"></span>
</main>
<script>
(() => {
  'use strict';
  const RELEASE = Date.parse('2026-11-18T23:00:00Z');
  const TOTAL = 48240; // Provisional 26:48 at 30 fps
  const STEP = 60000;
  const START = RELEASE - TOTAL * STEP;
  const byId = id => document.getElementById(id);
  const ui = {
    days:byId('days'), hours:byId('hours'), minutes:byId('minutes'), seconds:byId('seconds'),
    next:byId('nextFrame'), counter:byId('frameCounter'), fill:byId('progressFill'),
    progress:byId('trailerProgress'), sync:byId('syncStatus'), image:byId('frameImage')
  };
  const pad = value => String(value).padStart(2, '0');
  let offset = 0;
  let synced = false;
  let lastFrame = -1;
  let syncing = false;
  const serverTime = () => Date.now() + offset;
  const frameIndex = t => Math.max(0, Math.min(TOTAL - 1, Math.floor((t - START) / STEP)));

  async function sync() {
    if (syncing) return;
    syncing = true;
    const before = Date.now();
    try {
      const response = await fetch('/api/gta-frame?format=state', { cache:'no-store' });
      if (!response.ok) throw new Error('Frame service unavailable');
      const state = await response.json();
      if (state.launchAt !== RELEASE || state.totalFrames !== TOTAL || state.frameIntervalMs !== STEP) {
        throw new Error('Clock configuration mismatch');
      }
      offset = state.serverNow - (before + Date.now()) / 2;
      synced = true;
      ui.sync.textContent = 'Server clock synchronized';
      update();
    } catch (error) {
      ui.sync.textContent = 'Server clock connection lost';
      console.warn(error);
    } finally { syncing = false; }
  }

  function update() {
    const t = serverTime();
    const remaining = Math.max(0, Math.ceil((RELEASE - t) / 1000));
    ui.days.textContent = pad(Math.floor(remaining / 86400));
    ui.hours.textContent = pad(Math.floor(remaining % 86400 / 3600));
    ui.minutes.textContent = pad(Math.floor(remaining % 3600 / 60));
    ui.seconds.textContent = pad(remaining % 60);

    const index = frameIndex(t);
    const frame = index + 1;
    const progress = Math.max(0, Math.min(1, (t - START) / (RELEASE - START)));
    ui.counter.textContent = 'FRAME ' + String(frame).padStart(5, '0') + ' / ' + TOTAL.toLocaleString('en-US');
    ui.fill.style.width = (progress * 100).toFixed(4) + '%';
    ui.progress.setAttribute('aria-valuenow', String(Math.round(progress * 100)));
    const nextAt = Math.min(RELEASE, START + (index + 1) * STEP);
    const secs = Math.max(0, Math.ceil((nextAt - t) / 1000));
    ui.next.textContent = t >= RELEASE ? 'OUT NOW' : 'NEXT FRAME IN ' + pad(Math.floor(secs / 60)) + ':' + pad(secs % 60);

    if (synced && index !== lastFrame) {
      lastFrame = index;
      // The server chooses the actual frame; the cache-buster does not allow seeking.
      ui.image.src = '/api/gta-frame?tick=' + Math.floor(t / STEP);
    }
  }

  sync();
  update();
  setInterval(update, 250);
  setInterval(sync, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); update(); } });
  window.addEventListener('pageshow', () => { sync(); update(); });
})();
</script>
</body>
</html>
