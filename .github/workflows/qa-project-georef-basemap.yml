name: QA project georef and basemap
on:
  push:
    paths:
      - 'labs/spildevandskort/projects.js'
      - 'labs/spildevandskort/project-geocoder.js'
      - 'labs/spildevandskort/projects.css'
      - 'labs/spildevandskort/index.html'
      - 'labs/spildevandskort/basemaps.js'
      - 'labs/spildevandskort/data/project-*.json'
      - 'labs/spildevandskort/data/*.geojson'
      - 'scripts/check-project-geography.cjs'
      - '.github/workflows/qa-project-georef-basemap.yml'
  pull_request:
    paths:
      - 'labs/spildevandskort/projects.js'
      - 'labs/spildevandskort/project-geocoder.js'
      - 'labs/spildevandskort/projects.css'
      - 'labs/spildevandskort/index.html'
      - 'labs/spildevandskort/basemaps.js'
      - 'labs/spildevandskort/data/project-*.json'
      - 'labs/spildevandskort/data/*.geojson'
      - 'scripts/check-project-geography.cjs'
      - '.github/workflows/qa-project-georef-basemap.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            labs/spildevandskort/basemaps.js \
            labs/spildevandskort/project-geocoder.js \
            labs/spildevandskort/projects.js \
            labs/spildevandskort/data/project-geocodes.json \
            labs/spildevandskort/data/project-geometries-index.json \
            labs/spildevandskort/data/valby-skybrudstunnel.geojson \
            labs/spildevandskort/data/roende-etape-5.geojson; do test -s "$f"; done
          node scripts/check-project-geography.cjs
          node --check labs/spildevandskort/basemaps.js
          node --check labs/spildevandskort/project-geocoder.js
          node --check labs/spildevandskort/projects.js
          ! grep -q 'Tilbage til laboratoriet' labs/spildevandskort/index.html
          ! grep -q 'MARKEDS- OG KUNDEOVERBLIK' labs/spildevandskort/index.html
          grep -q 'Vis georefererede projekter' labs/spildevandskort/index.html
          grep -q 'skematiske projektområder' labs/spildevandskort/index.html
          grep -q 'skematisk, kildebaseret projektområde' labs/spildevandskort/index.html
          grep -q 'no utility-area fallback' labs/spildevandskort/project-geocoder.js
          python - <<'PY'
          import json
          p=json.load(open('labs/spildevandskort/data/project-geocodes.json',encoding='utf-8'))
          assert p['count']==len(p['projects'])==26,p.get('count')
          assert len({x['id'] for x in p['projects']})==26
          assert all(54<=float(x['lat'])<=58.5 and 7.5<=float(x['lon'])<=16 for x in p['projects'])
          forbidden={'aalborg-forsyning:0','faxe-forsyning:0','nyborg-forsyning:0','halsnaes-forsyning:1','thisted-vand:0'}
          assert not forbidden.intersection(x['id'] for x in p['projects'])
          print('STATIC_PROJECT_GEOCODES_OK',p['count'])
          PY
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/map-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4174/labs/spildevandskort/ >/dev/null && break; sleep 1; done
      - name: Browser QA
        env:
          MAP_URL: http://127.0.0.1:4174/labs/spildevandskort/
        run: |
          cat > /tmp/qa.py <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def check(browser,mobile=False):
              viewport={"width":390,"height":844} if mobile else {"width":1440,"height":900}
              context=await browser.new_context(viewport=viewport,is_mobile=mobile)
              page=await context.new_page(); errors=[]; dawa=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.on('request',lambda r:dawa.append(r.url) if 'api.dataforsyningen.dk' in r.url else None)
              r=await page.goto(os.environ['MAP_URL'],wait_until='domcontentloaded',timeout=60000); assert r and r.ok
              await page.wait_for_selector('.leaflet-container',timeout=30000)
              await page.wait_for_function("typeof projectGeorefState==='function' && projectGeorefState().staticLoaded===17 && projectGeorefState().geometryFiles===3",timeout=30000)
              await page.wait_for_function("Number(document.querySelector('#projectCount')?.textContent)>100",timeout=30000)
              assert not dawa,dawa[:3]

              labels=page.locator('.leaflet-control-layers-base label'); texts=await labels.all_inner_texts()
              assert any('Kort' in x for x in texts) and any('Luftfoto' in x for x in texts),texts
              for i,t in enumerate(texts):
                  if 'Luftfoto' in t: await labels.nth(i).click(force=True); break
              await page.wait_for_function("spildevandskortBasemapState().active==='Luftfoto' && spildevandskortBasemapState().imageryOnMap",timeout=10000)
              await page.wait_for_timeout(1000)
              assert await page.locator('img.leaflet-tile[src*="World_Imagery"]').count()>0

              await page.locator('.tab[data-tab="projects"]').click(); await page.wait_for_timeout(500)
              controls=(await page.locator('#projectControls').inner_text()).lower(); assert 'skematiske projektområder' in controls,controls
              qa=await page.evaluate("projectGeorefState()")
              assert qa['staticLoaded']==17 and qa['ignored']==9 and qa['geometryFiles']==3 and qa['errors']==0,qa
              assert qa['strategies']['dawa']==17 and qa['strategies']['geometry']==6 and qa['withheldLinear']==4,qa

              # Svanemøllen: only source GIS must render for the targeted search.
              await page.locator('#search').fill('Svanemøllen'); await page.wait_for_timeout(100)
              assert await page.locator('.project-row').count()==3
              counts={
                  'source_routes':await page.locator('.project-route-source').count(),
                  'source_points':await page.locator('.project-anchor-source').count(),
                  'schematic_routes':await page.locator('.project-route-schematic').count(),
                  'schematic_areas':await page.locator('.project-area-schematic').count()
              }
              assert counts=={'source_routes':32,'source_points':16,'schematic_routes':0,'schematic_areas':0},counts
              await page.locator('.project-row').first.click(); detail=await page.locator('#detailContent').inner_text()
              assert 'Offentliggjort projektgeometri' in detail and 'Kilde til kortplacering' in detail,detail
              await page.locator('#closeDetail').click()

              # Valby: only the separately labelled schematic trace must render.
              await page.locator('#search').fill('Valby Skybrudstunnel'); await page.wait_for_timeout(100)
              assert await page.locator('.project-row').count()==2
              counts={
                  'source_routes':await page.locator('.project-route-source').count(),
                  'schematic_routes':await page.locator('.project-route-schematic').count(),
                  'schematic_points':await page.locator('.project-anchor-schematic').count(),
                  'schematic_areas':await page.locator('.project-area-schematic').count()
              }
              assert counts=={'source_routes':0,'schematic_routes':1,'schematic_points':5,'schematic_areas':0},counts
              await page.locator('.project-row').first.click(); detail=await page.locator('#detailContent').inner_text()
              assert 'Skematisk, kildebaseret tracé' in detail and 'ikke den projekterede centerlinje' in detail,detail
              await page.locator('#closeDetail').click()

              # The four remaining line projects still have no fabricated route.
              await page.locator('#search').fill(''); await page.locator('#projectGeometryFilter').select_option('line')
              assert await page.locator('.project-row').count()==9
              assert await page.locator('.project-area').count()==0
              for name in ['Kloakledninger ved E20 og Søparken','Ny udløbsledning fra Brande Renseanlæg','Spildevandsprojekt ved Horne','Transportrør ved Nakskov Havn']:
                  await page.locator('#search').fill(name); assert await page.locator('.project-row').count()==1
                  assert await page.locator('.project-row').first.evaluate("el=>el.classList.contains('unmapped')"),name
                  assert await page.locator('.project-route').count()==0,name

              # Rønde Etape 5: reviewed schematic area, not a city-centre point and not a trace.
              await page.locator('#search').fill(''); await page.locator('#projectGeometryFilter').select_option('polygon')
              await page.locator('#search').fill('Rønde kloakseparering'); await page.wait_for_timeout(100)
              assert await page.locator('.project-row').count()==1
              row=page.locator('.project-row').first
              assert not await row.evaluate("el=>el.classList.contains('unmapped')")
              assert await row.get_attribute('data-geometry-kind')=='area' and await row.get_attribute('data-geometry-precision')=='schematic'
              counts={'areas':await page.locator('.project-area-schematic').count(),'routes':await page.locator('.project-route').count(),'markers':await page.locator('.project-marker-shell').count()}
              assert counts=={'areas':2,'routes':0,'markers':0},counts
              await row.click(); detail=await page.locator('#detailContent').inner_text()
              for needle in ['Rønde · separatkloakering etape 5','Skematisk, kildebaseret projektområde','ikke matrikelgrænse','27.02.2025']:
                  assert needle in detail,(needle,detail)
              await page.locator('#closeDetail').click()

              await page.locator('#search').fill(''); await page.locator('#projectGeometryFilter').select_option('unmapped')
              assert await page.locator('.project-row').count()>0 and await page.locator('.project-row:not(.unmapped)').count()==0
              assert await page.locator('.project-route').count()==0 and await page.locator('.project-area').count()==0
              assert not errors,errors
              if mobile:
                  overflow=await page.evaluate("document.documentElement.scrollWidth-document.documentElement.clientWidth"); assert overflow<=3,overflow
              label='mobile' if mobile else 'desktop'; await page.screenshot(path=f'qa-georef-{label}.png',full_page=True)
              print(label.upper(),'PROJECT_GEO_QA_OK',qa)
              await context.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(); await check(browser); await check(browser,True); await browser.close()
          asyncio.run(main())
          PY
          python /tmp/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-georef-basemap-qa
          path: qa-georef-*.png
          if-no-files-found: ignore