name: QA project georef and basemap
on:
  push:
    paths:
      - 'labs/spildevandskort/projects.js'
      - 'labs/spildevandskort/data/project-geography.json'
      - 'labs/spildevandskort/data/project-geometries-index.json'
      - 'labs/spildevandskort/data/svanemoellen.geojson'
      - 'labs/spildevandskort/data/valby-skybrudstunnel.geojson'
      - 'labs/spildevandskort/data/roende-etape-5.geojson'
      - 'labs/spildevandskort/data/tuse-naes.geojson'
      - 'scripts/check-project-geography.cjs'
      - 'labs/spildevandskort/index.html'
      - 'labs/spildevandskort/projects.css'
      - 'labs/spildevandskort/basemaps.js'
      - 'labs/spildevandskort/project-geocoder.js'
      - 'labs/spildevandskort/data/project-geocodes.json'
      - '.github/workflows/qa-project-georef-basemap.yml'
  pull_request:
    paths:
      - 'labs/spildevandskort/projects.js'
      - 'labs/spildevandskort/data/project-geography.json'
      - 'labs/spildevandskort/data/project-geometries-index.json'
      - 'labs/spildevandskort/data/svanemoellen.geojson'
      - 'labs/spildevandskort/data/valby-skybrudstunnel.geojson'
      - 'labs/spildevandskort/data/roende-etape-5.geojson'
      - 'labs/spildevandskort/data/tuse-naes.geojson'
      - 'scripts/check-project-geography.cjs'
      - 'labs/spildevandskort/index.html'
      - 'labs/spildevandskort/projects.css'
      - 'labs/spildevandskort/basemaps.js'
      - 'labs/spildevandskort/project-geocoder.js'
      - 'labs/spildevandskort/data/project-geocodes.json'
      - '.github/workflows/qa-project-georef-basemap.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          test -s labs/spildevandskort/basemaps.js
          test -s labs/spildevandskort/project-geocoder.js
          test -s labs/spildevandskort/data/project-geocodes.json
          test -s labs/spildevandskort/data/project-geometries-index.json
          test -s labs/spildevandskort/data/valby-skybrudstunnel.geojson
          test -s labs/spildevandskort/data/roende-etape-5.geojson
          test -s labs/spildevandskort/data/tuse-naes.geojson
          node scripts/check-project-geography.cjs
          node --check labs/spildevandskort/basemaps.js
          node --check labs/spildevandskort/project-geocoder.js
          node --check labs/spildevandskort/projects.js
          ! grep -q 'Tilbage til laboratoriet' labs/spildevandskort/index.html
          ! grep -q 'MARKEDS- OG KUNDEOVERBLIK' labs/spildevandskort/index.html
          grep -q 'Vis georefererede projekter' labs/spildevandskort/index.html
          grep -q 'skematiske projektområder' labs/spildevandskort/index.html
          grep -q 'no utility-area fallback' labs/spildevandskort/project-geocoder.js
          python - <<'PY'
          import json
          p=json.load(open('labs/spildevandskort/data/project-geocodes.json',encoding='utf-8'))
          assert p['count']==len(p['projects'])==26,p.get('count')
          assert len({x['id'] for x in p['projects']})==26
          assert all(54<=float(x['lat'])<=58.5 and 7.5<=float(x['lon'])<=16 for x in p['projects'])
          forbidden={'aalborg-forsyning:0','faxe-forsyning:0','nyborg-forsyning:0','halsnaes-forsyning:1','thisted-vand:0'}
          assert not forbidden.intersection(x['id'] for x in p['projects'])
          print('STATIC_PROJECT_GEOCODES_OK',p['count'])
          PY
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/map-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4174/labs/spildevandskort/ >/dev/null && break; sleep 1; done
      - name: Browser QA
        env:
          MAP_URL: http://127.0.0.1:4174/labs/spildevandskort/
        run: |
          cat > /tmp/qa.py <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def check(browser,mobile=False):
              viewport={"width":390,"height":844} if mobile else {"width":1440,"height":900}
              context=await browser.new_context(viewport=viewport,is_mobile=mobile)
              page=await context.new_page()
              errors=[]; dawa=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.on('request',lambda r:dawa.append(r.url) if 'api.dataforsyningen.dk' in r.url else None)
              r=await page.goto(os.environ['MAP_URL'],wait_until='domcontentloaded',timeout=60000)
              assert r and r.ok
              await page.wait_for_selector('.leaflet-container',timeout=30000)
              await page.wait_for_function("typeof window.spildevandskortBasemapState==='function' && typeof window.projectGeorefState==='function'",timeout=30000)
              await page.wait_for_function("projectGeorefState().mode==='static' && projectGeorefState().staticLoaded===17 && projectGeorefState().geometryFiles===4",timeout=30000)
              await page.wait_for_function("Number(document.querySelector('#projectCount')?.textContent)>100",timeout=30000)

              body=await page.locator('body').inner_text()
              assert 'Tilbage til laboratoriet' not in body
              assert 'MARKEDS- OG KUNDEOVERBLIK' not in body
              assert 'Dansk spildevandskort' in body
              assert not dawa,dawa[:3]

              control=page.locator('.leaflet-control-layers')
              assert await control.count()==1
              labels=page.locator('.leaflet-control-layers-base label')
              texts=await labels.all_inner_texts()
              assert any('Kort' in x for x in texts),texts
              assert any('Luftfoto' in x for x in texts),texts
              for i,t in enumerate(texts):
                  if 'Luftfoto' in t:
                      await labels.nth(i).click(force=True);break
              await page.wait_for_function("spildevandskortBasemapState().active==='Luftfoto' && spildevandskortBasemapState().imageryOnMap",timeout=10000)
              await page.wait_for_timeout(1200)
              imagery_tiles=await page.locator('img.leaflet-tile[src*="World_Imagery"]').count()
              assert imagery_tiles>0,imagery_tiles

              await page.locator('.tab[data-tab="projects"]').click()
              await page.wait_for_timeout(500)
              controls=await page.locator('#projectControls').inner_text()
              assert 'skematiske projektområder' in controls.lower(),controls
              qa=await page.evaluate("projectGeorefState()")
              assert qa['staticLoaded'] + qa['ignored'] == 26,qa
              assert qa['staticLoaded'] == 17 and qa['ignored'] == 9,qa
              assert qa['geometryFiles']==4,qa
              assert qa['errors']==0,qa
              assert qa['strategies']['dawa']==16 and qa['strategies']['geometry']==7,qa
              assert qa['strategies']['withheld']>0,qa
              assert qa['withheldLinear']==4,qa
              assert 'fallback' not in qa['strategies'] or qa['strategies']['fallback']==0,qa

              svan=await page.evaluate("""() => {
                const p=state.projects.find(x=>x.brandId==='novafos' && x.name.includes('Svanemøllen Skybrudstunnel'));
                const g=p&&projectGeometry(p);
                return p ? {linear:projectNeedsLinearGeometry(p),location:projectLocation(p),geometry:!!g,precision:projectGeometryPrecision(g),id:p.id} : null;
              }""")
              assert svan and svan['linear'] is True and svan['location'] is None and svan['geometry'] is True and svan['precision']=='source',svan

              valby=await page.evaluate("""() => {
                const p=state.projects.find(x=>x.brandId==='hofor' && x.name==='Valby Skybrudstunnel');
                const g=p&&projectGeometry(p);
                return p ? {linear:projectNeedsLinearGeometry(p),location:projectLocation(p),geometry:!!g,precision:projectGeometryPrecision(g),key:projectGeometryKey(p),id:p.id} : null;
              }""")
              assert valby and valby['linear'] is True and valby['location'] is None and valby['geometry'] is True and valby['precision']=='schematic' and valby['key']=='valby-skybrudstunnel',valby

              assert await page.locator('.project-route-source').count()==32
              assert await page.locator('.project-anchor-source').count()==16
              assert await page.locator('.project-route-schematic').count()==1
              assert await page.locator('.project-anchor-schematic').count()==5
              assert await page.locator('.project-area-schematic').count()==5

              await page.locator('#projectGeometryFilter').select_option('line')
              assert await page.locator('.project-row').count()==9
              assert await page.locator('.project-marker-shell').count()==0
              await page.locator('#search').fill('Valby Skybrudstunnel')
              assert await page.locator('.project-row').count()==2
              await page.locator('.project-row').first.click()
              detail=await page.locator('#detailContent').inner_text()
              assert 'Skematisk, kildebaseret tracé' in detail and 'ikke den projekterede centerlinje' in detail,detail
              await page.locator('#closeDetail').click()

              await page.locator('#projectGeometryFilter').select_option('all')
              await page.locator('#search').fill('Kloakering på Tuse Næs')
              assert await page.locator('.project-row').count()==1
              tuse=page.locator('.project-row').first
              assert not await tuse.evaluate("el=>el.classList.contains('unmapped')")
              assert await tuse.get_attribute('data-geometry-role')=='project-area'
              assert await tuse.get_attribute('data-geometry-precision')=='schematic'
              await tuse.click()
              detail=await page.locator('#detailContent').inner_text()
              assert 'Skematisk, kildebaseret projektområde' in detail,detail
              assert 'Tuse Næs · fire navngivne delområder' in detail,detail
              assert 'må ikke læses som matrikel' in detail,detail
              await page.locator('#closeDetail').click()

              await page.locator('#search').fill('Rønde kloakseparering')
              assert await page.locator('.project-row').count()==1
              roende=page.locator('.project-row').first
              assert not await roende.evaluate("el=>el.classList.contains('unmapped')")
              assert await roende.get_attribute('data-geometry-role')=='project-area'
              assert await roende.get_attribute('data-geometry-precision')=='schematic'
              await roende.click()
              detail=await page.locator('#detailContent').inner_text()
              assert 'Skematisk, kildebaseret projektområde' in detail,detail
              assert 'Rønde · etape 5' in detail,detail
              assert 'matrikel' in detail.lower(),detail
              await page.locator('#closeDetail').click()

              await page.locator('#search').fill('')
              await page.locator('#projectGeometryFilter').select_option('polygon')
              assert await page.locator('.project-row[data-project-id="fors:0"]').count()==1
              assert await page.locator('.project-row[data-project-id="syddjurs-spildevand:1"]').count()==1
              assert await page.locator('.project-area-schematic').count()==5

              for name in ['Kloakledninger ved E20 og Søparken','Ny udløbsledning fra Brande Renseanlæg','Spildevandsprojekt ved Horne','Transportrør ved Nakskov Havn']:
                  await page.locator('#projectGeometryFilter').select_option('all')
                  await page.locator('#search').fill(name)
                  assert await page.locator('.project-row').count()==1,name
                  assert await page.locator('.project-row').first.evaluate("el=>el.classList.contains('unmapped')"),name
              await page.locator('#search').fill('')
              await page.locator('#projectGeometryFilter').select_option('unmapped')
              assert await page.locator('.project-row').count()>0
              assert await page.locator('.project-row:not(.unmapped)').count()==0
              assert await page.locator('.project-route').count()==0
              assert await page.locator('.project-area').count()==0

              if mobile:
                  overflow=await page.evaluate("document.documentElement.scrollWidth-document.documentElement.clientWidth")
                  assert overflow<=3,overflow
              assert not errors,errors
              label='mobile' if mobile else 'desktop'
              await page.screenshot(path=f'qa-georef-{label}.png',full_page=True)
              print(label.upper(),'geo',qa,'imageryTiles',imagery_tiles,'dawaRequests',len(dawa))
              await context.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  await check(browser,False)
                  await check(browser,True)
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-georef-basemap-qa
          path: qa-georef-*.png
          if-no-files-found: ignore
