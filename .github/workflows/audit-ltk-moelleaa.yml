name: Audit Lyngby-Taarbæk Mølleåværket catchments

on:
  push:
    paths:
      - '.github/workflows/audit-ltk-moelleaa.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Match current Plandata against LTK Bilag 7 MV rows
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          import io,json,re,urllib.parse,urllib.request
          from pypdf import PdfReader
          def get(url,timeout=120):
              req=urllib.request.Request(url,headers={'User-Agent':'daniellund-spildevandskort-audit/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.read()
          def keynorm(v):return re.sub(r'[^a-z0-9æøå]','',str(v or '').lower())
          def pick(p,cs):
              by={keynorm(k):v for k,v in p.items()}
              for c in cs:
                  if keynorm(c) in by:return by[keynorm(c)]
              return None
          pdf='https://www.ltk.dk/media/5zzf1jim/kf-spildevandsplan-2014-2018-vers-10-2-2021.pdf'
          reader=PdfReader(io.BytesIO(get(pdf)))
          # Bilag 7 table occupies the final part of the plan. Extract all explicit "opland MV" rows.
          text='\n'.join((p.extract_text() or '') for p in reader.pages[76:87])
          mv=set()
          for m in re.finditer(r'(?<![A-Za-z0-9._-])([A-ZÆØÅ]{1,4}[A-ZÆØÅ0-9._-]*\d[A-ZÆØÅ0-9._-]*)\s+MV\b',text,re.I):
              mv.add(m.group(1).upper())
          print('LTK_PDF_MV_CODES',len(mv),json.dumps(sorted(mv),ensure_ascii=False))
          base='https://geoserver.plandata.dk/geoserver/wfs';start=0;current=[]
          while True:
              qs=urllib.parse.urlencode({'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':'pdk:theme_pdk_kloakopland_vedtaget','outputFormat':'application/json','srsName':'EPSG:4326','count':5000,'startIndex':start})
              data=json.loads(get(base+'?'+qs).decode())
              fs=data.get('features',[])
              for f in fs:
                  p=f.get('properties') or {};mc=pick(p,['kommunekode','kommune_kode','komnr','komkode','kommunenr','kommuneid'])
                  try:mc=int(float(mc))
                  except:continue
                  if mc!=173:continue
                  pn=str(pick(p,['plannr','plannummer','plan_nr','oplandnr','oplandnummer']) or '').strip()
                  sc=pick(p,['nuvkode','nuv_kode','kloaktype','kloak_type','sewertype','kloaktypekode'])
                  try:sc=int(float(sc))
                  except:sc=None
                  current.append({'planNumber':pn,'sewerCode':sc,'id':f.get('id')})
              if len(fs)<5000:break
              start+=len(fs)
          matches=sorted({r['planNumber'] for r in current if r['planNumber'].upper() in mv and r['sewerCode'] not in (4,5)})
          excluded=sorted({r['planNumber'] for r in current if r['planNumber'].upper() in mv and r['sewerCode'] in (4,5)})
          missing=sorted(mv-{r['planNumber'].upper() for r in current})
          print('LTK_CURRENT_MV_MATCHED',len(matches),json.dumps(matches,ensure_ascii=False))
          print('LTK_MV_EXCLUDED_CODE_4_5',len(excluded),json.dumps(excluded,ensure_ascii=False))
          print('LTK_PDF_MV_NOT_CURRENT',len(missing),json.dumps(missing,ensure_ascii=False))
          assert {'TA22','TA25'}.issubset(set(matches)),matches
          assert len(matches)>50,len(matches)
          PY
