name: Audit Mølleåværket PULS record

on:
  push:
    paths:
      - '.github/workflows/audit-moelleaavaerket-puls.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query PULS WFS for Mølleåværket
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://pulsgeo.miljoeportal.dk/geoserver/wfs'
          params={
            'service':'WFS','version':'2.0.0','request':'GetFeature',
            'typeNames':'puls:Renseanlaeg','outputFormat':'application/json',
            'srsName':'EPSG:4326','count':2000
          }
          url=base+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'daniellund-spildevandskort-audit/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r:
              data=json.load(r)
          matches=[]
          for f in data.get('features',[]):
              p=f.get('properties') or {}
              blob=' '.join(str(v) for v in p.values() if v is not None).lower()
              if 'mølleå' in blob or 'mollea' in blob or 'lundtofte' in blob:
                  matches.append({'id':f.get('id'),'properties':p})
          print('PULS_MATCHES='+json.dumps(matches,ensure_ascii=False))
          PY
