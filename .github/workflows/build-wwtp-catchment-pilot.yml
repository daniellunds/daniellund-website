name: Build WWTP catchment pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'labs/spildevandskort/data/wwtp-catchment-relations.json'
      - 'scripts/build_wwtp_catchment_pilot.py'
      - '.github/workflows/build-wwtp-catchment-pilot.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install geometry dependency
        run: python -m pip install --quiet shapely
      - name: Build documented treatment-plant catchments
        # Includes all source-backed municipality relations, including Rudersdal.
        run: python scripts/build_wwtp_catchment_pilot.py
      - name: Commit generated pilot data
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/wwtp-catchment-pilot.geojson labs/spildevandskort/data/wwtp-catchment-pilot-meta.json
          if git diff --cached --quiet; then
            echo 'No generated data changes'
          else
            git commit -m 'Build documented WWTP catchment pilot data'
            git fetch origin main
            LOCAL_REL=$(git rev-parse HEAD^:labs/spildevandskort/data/wwtp-catchment-relations.json)
            REMOTE_REL=$(git rev-parse origin/main:labs/spildevandskort/data/wwtp-catchment-relations.json)
            if [ "$LOCAL_REL" != "$REMOTE_REL" ]; then
              echo 'Relation table changed during build; refusing to push stale generated data.'
              exit 0
            fi
            git rebase origin/main
            git push origin HEAD:main
          fi
