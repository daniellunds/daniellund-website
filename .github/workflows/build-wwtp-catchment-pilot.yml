name: Build WWTP catchment pilot

on:
  push:
    paths:
      - 'labs/spildevandskort/data/wwtp-catchment-relations.json'
      - '.github/workflows/build-wwtp-catchment-pilot.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install geometry dependency
        run: python -m pip install --quiet shapely

      - name: Fetch Plandata and build pilot geometries
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from collections import defaultdict
          from pathlib import Path
          from shapely.geometry import shape, mapping
          from shapely.ops import unary_union

          root=Path('labs/spildevandskort/data')
          relations=json.loads((root/'wwtp-catchment-relations.json').read_text(encoding='utf-8'))

          def norm(v):
              return re.sub(r'\s+','',str(v or '')).upper()
          def keynorm(v):
              return re.sub(r'[^a-z0-9æøå]','',str(v or '').lower())
          def pick(props,candidates):
              by={keynorm(k):v for k,v in props.items()}
              for c in candidates:
                  if keynorm(c) in by:return by[keynorm(c)]
              return None
          def get_json(url,timeout=90):
              req=urllib.request.Request(url,headers={'User-Agent':'daniellund-spildevandskort-qa/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.load(r)

          wanted={}
          relation_sources={}
          for plant in relations['plants']:
              pkey=plant['plantKey']
              for rel in plant['relations']:
                  for pn in rel['planNumbers']:
                      n=norm(pn)
                      wanted[(plant['municipalityCode'],n)]=pkey
                      relation_sources.setdefault((pkey,n),[]).append({'label':rel['sourceLabel'],'url':rel['sourceUrl']})

          base='https://geoserver.plandata.dk/geoserver/wfs'
          page_size=5000
          start=0
          raw_count=0
          schema_keys=None
          groups=defaultdict(list)
          sewer_codes=defaultdict(set)
          element_ids=defaultdict(list)
          matched_raw=0
          while True:
              qs=urllib.parse.urlencode({
                  'service':'WFS','version':'2.0.0','request':'GetFeature',
                  'typeNames':'pdk:theme_pdk_kloakopland_vedtaget',
                  'outputFormat':'application/json','srsName':'EPSG:4326',
                  'count':page_size,'startIndex':start
              })
              data=get_json(base+'?'+qs)
              feats=data.get('features',[])
              if feats and schema_keys is None:
                  schema_keys=sorted(feats[0].get('properties',{}).keys())
                  print('PLANDATA_SCHEMA_KEYS',schema_keys)
              for f in feats:
                  raw_count+=1
                  p=f.get('properties') or {}
                  pn=pick(p,['plannr','plannummer','plan_nr','oplandnr','oplandnummer'])
                  if pn is None: continue
                  mcode=pick(p,['kommunekode','kommune_kode','komnr','komkode','kommunenr','kommuneid'])
                  try:mcode=int(float(mcode))
                  except:mcode=None
                  key=(mcode,norm(pn))
                  pkey=wanted.get(key)
                  if not pkey: continue
                  sewer=pick(p,['kloaktype','kloak_type','sewertype','kloaktypekode'])
                  try:sewer_i=int(float(sewer))
                  except:sewer_i=None
                  # Treatment-plant catchments represent wastewater flow: exclude rainwater-only and unsewered.
                  if sewer_i in (4,5):
                      continue
                  try:
                      geom=shape(f.get('geometry'))
                      if geom.is_empty: continue
                      if not geom.is_valid: geom=geom.buffer(0)
                      geom=geom.simplify(0.00001,preserve_topology=True)
                      if geom.is_empty: continue
                  except Exception as e:
                      print('GEOMETRY_SKIP',f.get('id'),e)
                      continue
                  gkey=(pkey,norm(pn))
                  groups[gkey].append(geom)
                  sewer_codes[gkey].add(sewer_i)
                  eid=pick(p,['elementid','element_id','id']) or f.get('id')
                  if eid is not None: element_ids[gkey].append(str(eid))
                  matched_raw+=1
              print('PLANDATA_PAGE',start,len(feats),'raw',raw_count,'matched',matched_raw)
              if len(feats)<page_size:break
              start+=len(feats)
              if start>100000: raise RuntimeError('Unexpected Plandata pagination')

          if not groups:
              raise RuntimeError(f'No pilot relations matched. First schema keys: {schema_keys}')

          plant_by_key={p['plantKey']:p for p in relations['plants']}
          features=[]
          found=defaultdict(set)
          for (pkey,pn),geoms in sorted(groups.items()):
              merged=unary_union(geoms)
              if not merged.is_valid: merged=merged.buffer(0)
              found[pkey].add(pn)
              features.append({
                  'type':'Feature',
                  'properties':{
                      'plantKey':pkey,
                      'plantName':plant_by_key[pkey]['plantName'],
                      'municipalityCode':plant_by_key[pkey]['municipalityCode'],
                      'planNumber':pn,
                      'sourceFeatureCount':len(geoms),
                      'sewerTypeCodes':sorted(x for x in sewer_codes[(pkey,pn)] if x is not None),
                      'elementIds':element_ids[(pkey,pn)][:100],
                      'sources':relation_sources.get((pkey,pn),[]),
                      'coverageStatus':'documented-pilot'
                  },
                  'geometry':mapping(merged)
              })

          # Resolve only the exact main PULS plant record. Broad substring matching can hit bypass/overflow subrecords.
          puls_base='https://pulsgeo.miljoeportal.dk/geoserver/wfs'
          pqs=urllib.parse.urlencode({'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':'puls:Renseanlaeg','outputFormat':'application/json','srsName':'EPSG:4326','count':2000})
          puls=get_json(puls_base+'?'+pqs)
          puls_resolved={}
          expected_names={pkey:keynorm(plant['plantName']) for pkey,plant in plant_by_key.items()}
          for f in puls.get('features',[]):
              p=f.get('properties') or {}
              name=pick(p,['Name','Navn','PlantName','Renseanlægsnavn'])
              if not name:continue
              nn=keynorm(name)
              for pkey,expected in expected_names.items():
                  if nn==expected:
                      pid=pick(p,['WwtpId','Id','ID','PulsId','PULS_ID']) or f.get('id')
                      puls_resolved[pkey]={'id':str(pid),'name':str(name),'featureId':f.get('id')}

          requested={}
          for p in relations['plants']:
              requested[p['plantKey']]=sorted({norm(n) for r in p['relations'] for n in r['planNumbers']})
          meta={
              'version':1,
              'coverageStatus':'partial-documented-pilot',
              'source':'Plandata.dk vedtagne kloakoplande + Københavns Kommunes spildevandsplan',
              'rawPlandataFeaturesScanned':raw_count,
              'matchedRawFeatures':matched_raw,
              'mapFeatureCount':len(features),
              'plants':{}
          }
          for pkey in plant_by_key:
              req=requested[pkey]
              got=sorted(found[pkey])
              meta['plants'][pkey]={
                  'plantName':plant_by_key[pkey]['plantName'],
                  'requestedPlanNumbers':req,
                  'matchedPlanNumbers':got,
                  'missingPlanNumbers':sorted(set(req)-set(got)),
                  'puls':puls_resolved.get(pkey),
                  'isCompleteCatchment':False
              }

          (root/'wwtp-catchment-pilot.geojson').write_text(json.dumps({'type':'FeatureCollection','features':features},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (root/'wwtp-catchment-pilot-meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('WWTP_PILOT_BUILT',json.dumps(meta,ensure_ascii=False))
          PY

      - name: Commit generated pilot data
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/wwtp-catchment-pilot.geojson labs/spildevandskort/data/wwtp-catchment-pilot-meta.json
          if git diff --cached --quiet; then
            echo 'No generated data changes'
          else
            git commit -m 'Build documented WWTP catchment pilot data'
            git push
          fi
