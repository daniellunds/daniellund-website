name: Audit Copenhagen project receiver mappings

on:
  push:
    paths:
      - '.github/workflows/audit-kk-project-receivers.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Crawl official Copenhagen project pages
        run: python scripts/audit_kk_project_receivers.py
      - name: Commit source audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/kk-project-receiver-audit.json
          git commit -m 'Capture Copenhagen treatment-plant source audit' || exit 0
          git push
