name: QA corrected wastewater catchments

on:
  push:
    paths:
      - 'labs/spildevandskort/data/spildevandsoplande-*.geojson.gz'
      - 'labs/spildevandskort/data/spildevandsoplande-meta.json'
      - 'labs/spildevandskort/app2.js'
      - '.github/workflows/qa-catchment-coverage.yml'
  pull_request:
    paths:
      - 'labs/spildevandskort/data/spildevandsoplande-*.geojson.gz'
      - 'labs/spildevandskort/data/spildevandsoplande-meta.json'
      - 'labs/spildevandskort/app2.js'
      - '.github/workflows/qa-catchment-coverage.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static geometry/data QA
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            test -s "labs/spildevandskort/data/spildevandsoplande-$i.geojson.gz"
            gzip -t "labs/spildevandskort/data/spildevandsoplande-$i.geojson.gz"
          done
          test -s labs/spildevandskort/data/spildevandsoplande-meta.json
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          root=Path('labs/spildevandskort/data')
          meta=json.loads((root/'spildevandsoplande-meta.json').read_text(encoding='utf-8'))
          features=[]
          total_compressed=0
          for i in range(1,5):
              p=root/f'spildevandsoplande-{i}.geojson.gz'
              total_compressed += p.stat().st_size
              with gzip.open(p,'rt',encoding='utf-8') as f:
                  features.extend(json.load(f).get('features',[]))
          codes={int(f['properties']['sewerTypeCode']) for f in features}
          municipalities={int(f['properties']['municipalityCode']) for f in features}
          assert meta['numberMatched'] >= 60000, meta
          assert meta['mapFeatureCount'] == len(features), (meta['mapFeatureCount'],len(features))
          assert meta['municipalityCount'] == 97 == len(municipalities), (meta['municipalityCount'],len(municipalities))
          assert codes == {1,2,3,4,6}, codes
          assert meta['includedCurrentSewerTypeCodes'] == [1,2,3,4,6], meta
          assert meta['excludedCurrentSewerTypeCodes'] == [5], meta
          assert meta['excludedUnseweredFeatureCount'] > 8000, meta
          assert meta['excludedKnownPrivateFeatureCount'] >= 1, meta
          assert meta['invalidOrEmptyGeometryCount'] == 0, meta
          assert total_compressed <= 15_000_000, total_compressed
          for f in features:
              p=f['properties']
              assert p.get('brandId') and p.get('municipality')
              assert p.get('displayType') and p.get('planStatus') == 'Vedtaget'
              assert int(p['sewerTypeCode']) != 5
          print('CORRECTED_CATCHMENT_STATIC_QA_OK',len(features),'features',len(municipalities),'municipalities','codes',sorted(codes),'compressed',total_compressed)
          PY

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4179 --bind 127.0.0.1 >/tmp/catchment-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4179/labs/spildevandskort/ >/dev/null && break; sleep 1; done

      - name: Desktop and mobile browser QA
        env:
          MAP_URL: http://127.0.0.1:4179/labs/spildevandskort/
        run: |
          cat >/tmp/qa.py <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def check(browser,mobile):
              context=await browser.new_context(viewport={'width':390,'height':844} if mobile else {'width':1440,'height':900},is_mobile=mobile)
              page=await context.new_page()
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              r=await page.goto(os.environ['MAP_URL'],wait_until='domcontentloaded',timeout=60000)
              assert r and r.ok
              await page.wait_for_selector('.leaflet-container',timeout=30000)
              await page.wait_for_function("window.state && Array.isArray(state.features) && state.features.length>=350",timeout=90000)
              qa=await page.evaluate("""() => ({
                features: state.features.length,
                codes: [...new Set(state.features.map(f=>Number(f.properties?.sewerTypeCode)))].sort((a,b)=>a-b),
                type4: state.features.filter(f=>Number(f.properties?.sewerTypeCode)===4).length,
                type6: state.features.filter(f=>Number(f.properties?.sewerTypeCode)===6).length,
                type5: state.features.filter(f=>Number(f.properties?.sewerTypeCode)===5).length,
                municipalities: new Set(state.features.map(f=>Number(f.properties?.municipalityCode))).size,
                rendered: document.querySelectorAll('.leaflet-overlay-pane path').length
              })""")
              assert qa['features']>=350,qa
              assert qa['codes']==[1,2,3,4,6],qa
              assert qa['type4']>0 and qa['type6']>0 and qa['type5']==0,qa
              assert qa['municipalities']==97,qa
              assert qa['rendered']>200,qa
              assert not errors,errors
              if mobile:
                  overflow=await page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')
                  assert overflow<=3,overflow
              print(('MOBILE' if mobile else 'DESKTOP'),'CORRECTED_CATCHMENT_BROWSER_QA_OK',qa)
              await context.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  await check(browser,False)
                  await check(browser,True)
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/qa.py
