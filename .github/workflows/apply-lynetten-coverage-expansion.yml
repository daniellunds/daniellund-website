name: Apply Lynetten coverage expansion

on:
  push:
    paths:
      - '.github/workflows/apply-lynetten-coverage-expansion.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source-backed Lynetten relations
        run: python scripts/expand_lynetten_coverage.py
      - name: Install dependencies
        run: |
          python -m pip install --quiet shapely playwright
          python -m playwright install --with-deps chromium
      - name: Rebuild treatment-plant catchments
        run: python scripts/build_wwtp_catchment_pilot.py
      - name: Static QA
        run: python scripts/qa_wwtp_catchment_pilot.py
      - name: Start local server
        run: |
          python3 -m http.server 4184 --bind 127.0.0.1 >/tmp/lynetten-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4184/labs/spildevandskort/ >/dev/null && break; sleep 1; done
      - name: Browser QA
        env:
          MAP_URL: http://127.0.0.1:4184/labs/spildevandskort/
        run: python scripts/qa_wwtp_catchment_browser.py
      - name: Commit expanded relations and generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/wwtp-catchment-relations.json labs/spildevandskort/data/wwtp-catchment-pilot.geojson labs/spildevandskort/data/wwtp-catchment-pilot-meta.json
          git commit -m 'Expand documented Lynetten catchment coverage' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
