name: QA live administrative coverage

on:
  push:
    paths:
      - '.github/workflows/qa-live-admin-coverage.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test live toggle
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              page=await browser.new_page(viewport={"width":1440,"height":900})
              errors=[]; page.on('pageerror',lambda e:errors.append(str(e)))
              r=await page.goto('https://www.daniellund.dk/labs/spildevandskort/',wait_until='domcontentloaded',timeout=60000)
              assert r and r.ok
              await page.wait_for_function("typeof spildevandskortCoverageState==='function'",timeout=30000)
              await page.wait_for_function("spildevandskortCoverageState() && (spildevandskortCoverageState().municipalities || spildevandskortCoverageState().error)",timeout=60000)
              qa=await page.evaluate('spildevandskortCoverageState()')
              checked=await page.locator('#showCoverage').is_checked()
              before=await page.locator('.leaflet-coverage-pane path').count()
              await page.locator('#showCoverage').uncheck(); await page.wait_for_timeout(300)
              off=await page.locator('.leaflet-coverage-pane path').count()
              await page.locator('#showCoverage').check(); await page.wait_for_timeout(300)
              after=await page.locator('.leaflet-coverage-pane path').count()
              print('LIVE_COVERAGE',{'qa':qa,'checked':checked,'before':before,'off':off,'after':after,'errors':errors})
              assert not qa.get('error'),qa
              assert checked
              assert before>0,before
              assert off==0,off
              assert after==before,(before,after)
              assert not errors,errors
              await browser.close()
          asyncio.run(main())
          PY
