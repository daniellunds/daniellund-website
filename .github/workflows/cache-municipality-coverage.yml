name: Cache municipality coverage

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/cache_municipality_coverage.py'
      - '.github/workflows/cache-municipality-coverage.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Dataforsyningen municipalities
        run: python scripts/cache_municipality_coverage.py
      - name: Commit cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/municipalities.geojson
          if git diff --cached --quiet; then
            echo 'No municipality cache changes'
          else
            git commit -m 'Cache municipality coverage geometry'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
