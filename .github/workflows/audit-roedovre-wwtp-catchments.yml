name: Audit Rødovre WWTP catchments

on:
  push:
    paths:
      - '.github/workflows/audit-roedovre-wwtp-catchments.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch current Rødovre Plandata catchments
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          params={
            'service':'WFS','version':'2.0.0','request':'GetFeature',
            'typeNames':'pdk:theme_pdk_kloakopland_vedtaget',
            'outputFormat':'application/json','srsName':'EPSG:4326',
            'count':1000,'CQL_FILTER':'komnr=175'
          }
          url='https://geoserver.plandata.dk/geoserver/wfs?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'daniellund-spildevandskort-audit/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r:
              data=json.load(r)
          rows={}
          for f in data.get('features',[]):
              p=f.get('properties') or {}
              key=str(p.get('plannr') or '')
              rows.setdefault(key,{'plannr':key,'plannavn':p.get('plannavn'),'nuvkoder':set(),'nuvtekster':set(),'objects':0})
              rows[key]['objects']+=1
              if p.get('nuvkode') is not None: rows[key]['nuvkoder'].add(p.get('nuvkode'))
              if p.get('nuvtekst'): rows[key]['nuvtekster'].add(p.get('nuvtekst'))
          out=[]
          for key in sorted(rows):
              r=rows[key]
              out.append({'plannr':key,'plannavn':r['plannavn'],'nuvkoder':sorted(r['nuvkoder']),'nuvtekster':sorted(r['nuvtekster']),'objects':r['objects']})
          print('ROEDOVRE_COUNT',len(data.get('features',[])),'UNIQUE',len(out))
          print('ROEDOVRE_CURRENT_CATCHMENTS='+json.dumps(out,ensure_ascii=False))
          PY
