name: Add Rødovre WWTP relations

on:
  push:
    paths:
      - '.github/workflows/add-roedovre-wwtp-relations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add source-backed Rødovre Hovedopland D relations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('labs/spildevandskort/data/wwtp-catchment-relations.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['version']=6
          data['scope']='Pilot: source-backed wastewater catchments for BIOFOS Lynetten and Damhusåen across Copenhagen, Gentofte, Frederiksberg, Herlev and Rødovre'

          plant=next(p for p in data['plants'] if p['plantKey']=='damhusaen')
          source_url='https://www.rk.dk/index.php?eID=tx_rkdoc_attachment&filename=%2FPunkt_127_Bilag_3_Bilag_1_Spildevandsplan_2022.pdf&uid=242770'
          source_label='Rødovre Kommune – Spildevandsplan 2022-2030, Hovedopland D'
          plans=['DAF01','DAF18','DAS','DB','DB1','DBS','DC','DD','DE','DF','DG','DH','DK','DL','DM','DMF17','DN','DP','DQS','DR','DR1','DS','DT']

          exists=any(r.get('municipalityCode')==175 and r.get('sourceLabel')==source_label for r in plant['relations'])
          if not exists:
              plant['relations'].append({
                  'municipalityCode':175,
                  'planNumbers':plans,
                  'sourceUrl':source_url,
                  'sourceLabel':source_label
              })

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/wwtp-catchment-relations.json
          if git diff --cached --quiet; then
            echo 'No relation changes'
          else
            git commit -m 'Add Rødovre Damhusåen catchment relations'
            git push
          fi
