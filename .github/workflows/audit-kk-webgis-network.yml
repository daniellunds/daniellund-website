name: Audit Copenhagen wastewater WebGIS network

on:
  push:
    paths:
      - '.github/workflows/audit-kk-webgis-network.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture official WebGIS network endpoints
        run: |
          python - <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright
          URL='https://webgis.digitaleplaner.dk/app/koebenhavn/spildevandsplan%2Cskybrudsplan/'
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              page=await b.new_page(viewport={'width':1400,'height':900})
              reqs=[]; responses=[]
              def on_req(r):
                u=r.url
                if any(x in u.lower() for x in ['wfs','wms','geojson','feature','layer','mapserver','geoserver','service','spildevand','kloak','digitaleplaner']): reqs.append({'method':r.method,'url':u,'resourceType':r.resource_type})
              page.on('request',on_req)
              page.on('response',lambda r: responses.append({'status':r.status,'url':r.url}) if any(x in r.url.lower() for x in ['wfs','wms','geojson','feature','layer','mapserver','geoserver','service','spildevand','kloak','digitaleplaner']) else None)
              try:
                await page.goto(URL,wait_until='domcontentloaded',timeout=90000)
                await page.wait_for_timeout(12000)
              except Exception as e: print('NAV_ERR',e)
              html=await page.content()
              scripts=await page.locator('script[src]').evaluate_all('(els)=>els.map(e=>e.src)')
              links=await page.locator('link[href]').evaluate_all('(els)=>els.map(e=>e.href)')
              out={'pageUrl':page.url,'title':await page.title(),'requests':reqs,'responses':responses,'scripts':scripts,'links':links,'htmlHints':sorted(set(re.findall(r'https?[^\"\'<> ]+',html)))[:500]}
              Path('labs/spildevandskort/data/kk-webgis-network-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('KK_WEBGIS_AUDIT_OK',len(reqs),len(responses),len(scripts))
              await b.close()
          asyncio.run(main())
          PY
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/kk-webgis-network-audit.json
          git commit -m 'Capture Copenhagen wastewater WebGIS endpoints' || exit 0
          git push
