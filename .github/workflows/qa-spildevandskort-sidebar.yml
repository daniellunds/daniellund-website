name: QA spildevandskort sidebar
on:
  push:
    paths:
      - 'labs/spildevandskort/sidebar.js'
      - 'labs/spildevandskort/index.html'
      - '.github/workflows/qa-spildevandskort-sidebar.yml'
  pull_request:
    paths:
      - 'labs/spildevandskort/sidebar.js'
      - 'labs/spildevandskort/index.html'
      - '.github/workflows/qa-spildevandskort-sidebar.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static QA
        run: |
          set -euo pipefail
          node --check labs/spildevandskort/sidebar.js
          grep -q 'sidebar.js' labs/spildevandskort/index.html
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 >/tmp/sidebar-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4178/labs/spildevandskort/ >/dev/null && break; sleep 1; done
      - name: Browser QA
        env:
          MAP_URL: http://127.0.0.1:4178/labs/spildevandskort/
        run: |
          cat >/tmp/sidebar_qa.py <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def check(browser,mobile=False):
            viewport={"width":390,"height":844} if mobile else {"width":1440,"height":900}
            ctx=await browser.new_context(viewport=viewport,is_mobile=mobile)
            page=await ctx.new_page(); errors=[]; page.on('pageerror',lambda e:errors.append(str(e)))
            r=await page.goto(os.environ['MAP_URL'],wait_until='domcontentloaded',timeout=60000); assert r and r.ok
            await page.wait_for_selector('.leaflet-container',timeout=30000)
            await page.wait_for_function("typeof spildevandskortSidebarState==='function'",timeout=30000)
            await page.wait_for_timeout(500)
            before=await page.locator('#map').bounding_box(); assert before
            selected_before=await page.evaluate('state.selected.size')
            assert await page.locator('#collapseSidebar').is_visible()
            assert not await page.locator('#expandSidebar').is_visible()
            await page.locator('#collapseSidebar').click(); await page.wait_for_timeout(400)
            assert (await page.evaluate('spildevandskortSidebarState()'))['collapsed'] is True
            assert await page.locator('#expandSidebar').is_visible()
            after=await page.locator('#map').bounding_box(); assert after
            if mobile: assert after['height'] > before['height'] + 200,(before,after)
            else: assert after['width'] > before['width'] + 250,(before,after)
            assert await page.evaluate('state.selected.size') == selected_before
            await page.locator('#expandSidebar').click(); await page.wait_for_timeout(400)
            assert (await page.evaluate('spildevandskortSidebarState()'))['collapsed'] is False
            restored=await page.locator('#map').bounding_box(); assert restored
            assert abs(restored['width']-before['width']) < 5,(before,restored)
            assert abs(restored['height']-before['height']) < 5,(before,restored)
            assert not errors,errors
            await ctx.close()

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              await check(browser,False)
              await check(browser,True)
              await browser.close()
          asyncio.run(main())
          PY
          python /tmp/sidebar_qa.py
