name: Enable Mølleåværket WWTP catchment support

on:
  push:
    paths:
      - '.github/workflows/enable-moelleaavaerket-wwtp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend builder, UI and QA
        run: python .github/scripts/enable-moelleaavaerket.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-wwtp-catchment-pilot.yml .github/workflows/qa-wwtp-catchment-pilot.yml labs/spildevandskort/wwtp-catchments.js
          git commit -m 'Enable Mølleåværket catchment highlighting'
          git push
