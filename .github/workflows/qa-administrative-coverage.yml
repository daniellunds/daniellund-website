name: QA administrative coverage
on:
  push:
    paths:
      - 'labs/spildevandskort/coverage-areas.js'
      - 'labs/spildevandskort/current-operators.js'
      - 'labs/spildevandskort/profile-integration.js'
      - 'labs/spildevandskort/map-colors.js'
      - 'labs/spildevandskort/data/coverage-verification.json'
      - 'labs/spildevandskort/index.html'
      - '.github/workflows/qa-administrative-coverage.yml'
  pull_request:
    paths:
      - 'labs/spildevandskort/coverage-areas.js'
      - 'labs/spildevandskort/current-operators.js'
      - 'labs/spildevandskort/profile-integration.js'
      - 'labs/spildevandskort/map-colors.js'
      - 'labs/spildevandskort/data/coverage-verification.json'
      - 'labs/spildevandskort/index.html'
      - '.github/workflows/qa-administrative-coverage.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static QA
        run: |
          set -euo pipefail
          node --check labs/spildevandskort/coverage-areas.js
          node --check labs/spildevandskort/current-operators.js
          node --check labs/spildevandskort/profile-integration.js
          node --check labs/spildevandskort/map-colors.js
          grep -q 'current-operators.js' labs/spildevandskort/index.html
          grep -q 'nordfyns-forsyning' labs/spildevandskort/current-operators.js
          grep -q 'vandcenter-syd' labs/spildevandskort/current-operators.js
          grep -q 'syddjurs-spildevand' labs/spildevandskort/current-operators.js
          grep -q 'aquadjurs' labs/spildevandskort/current-operators.js
          grep -q 'mariagerfjord-vand' labs/spildevandskort/current-operators.js
          grep -q 'Ren Forsyning Mariagerfjord' labs/spildevandskort/current-operators.js
          grep -q 'københavn' labs/spildevandskort/coverage-areas.js
          grep -q 'hofor' labs/spildevandskort/coverage-areas.js
          python - <<'PY'
          import json
          from pathlib import Path

          audit=json.loads(Path('labs/spildevandskort/data/coverage-verification.json').read_text(encoding='utf-8'))
          brands=json.loads(Path('labs/spildevandskort/data/brands.json').read_text(encoding='utf-8'))
          current_js=Path('labs/spildevandskort/current-operators.js').read_text(encoding='utf-8')
          groups=audit['verifiedGroups']
          changes=audit['verifiedOperatorChanges']
          assert audit['schemaVersion']==2
          assert len(groups)==7, len(groups)
          assert len({g['brandId'] for g in groups})==7
          assert len(changes)==5, len(changes)
          assert len({x['legacyBrandId'] for x in changes})==5
          assert all(x['sourceUrl'].startswith('https://') for x in groups+changes)
          municipalities=[m for g in groups for m in g['municipalities']]
          changed_municipalities=[m for x in changes for m in x['municipalities']]
          assert len(municipalities)==31, len(municipalities)
          assert len(set(municipalities))==31
          assert len(changed_municipalities)==5 and len(set(changed_municipalities))==5
          assert len(set(municipalities+changed_municipalities))==36
          by_id={b['id']:b for b in brands['brands']}
          def norm(name):
              name=name.strip().lower()
              return 'københavn' if name=='københavns' else name
          for g in groups:
              assert g['brandId'] in by_id, g['brandId']
              mapped={norm(m) for m in by_id[g['brandId']]['municipalities']}
              expected={norm(m) for m in g['municipalities']}
              assert mapped==expected,(g['brandId'],mapped,expected)
          for x in changes:
              legacy=x['legacyBrandId']; operator=x['operatorBrandId']
              assert legacy in by_id,legacy
              assert operator in by_id,operator
              mapped={norm(m) for m in by_id[legacy]['municipalities']}
              expected={norm(m) for m in x['municipalities']}
              assert mapped==expected,(legacy,mapped,expected)
              assert f'["{legacy}"' in current_js,legacy
              assert f'operatorBrandId:"{operator}"' in current_js,operator
          print('COVERAGE_SOURCE_AUDIT_OK',len(groups),'multi-brands',len(municipalities),'municipalities',len(changes),'operator-changes',len(set(municipalities+changed_municipalities)),'source-audited municipalities')
          PY
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 >/tmp/coverage-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4177/labs/spildevandskort/ >/dev/null && break; sleep 1; done
      - name: Browser QA
        env:
          MAP_URL: http://127.0.0.1:4177/labs/spildevandskort/
        run: |
          cat >/tmp/qa.py <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              for mobile in (False,True):
                ctx=await browser.new_context(viewport={"width":390,"height":844} if mobile else {"width":1440,"height":900},is_mobile=mobile)
                page=await ctx.new_page(); errors=[]; page.on('pageerror',lambda e:errors.append(str(e)))
                r=await page.goto(os.environ['MAP_URL'],wait_until='domcontentloaded',timeout=60000); assert r and r.ok
                await page.wait_for_function("typeof spildevandskortCoverageState==='function' && typeof spildevandskortCurrentOperatorState==='function'",timeout=30000)
                await page.wait_for_function("spildevandskortCoverageState() && (spildevandskortCoverageState().municipalities || spildevandskortCoverageState().error)",timeout=60000)
                await page.wait_for_function("typeof spildevandskortColorState==='function' && spildevandskortColorState()",timeout=60000)
                qa=await page.evaluate('spildevandskortCoverageState()')
                assert not qa.get('error'),qa
                assert qa['municipalities']==98 and qa['assigned']==98,qa
                assert qa['ambiguous']==[] and qa['unmapped']==[],qa
                assert any(x['name']=='København' and x['brandId']=='hofor' for x in qa.get('verifiedOverrides',[])),qa
                current=qa.get('currentOperatorOverrides',[])
                assert any(x['name']=='Nordfyns' and x['legacyBrandId']=='nordfyns-forsyning' and x['operatorBrandId']=='vandcenter-syd' for x in current),current
                assert any(x['name']=='Syddjurs' and x['legacyBrandId']=='syddjurs-spildevand' and x['operatorBrandId']=='aquadjurs' for x in current),current
                assert any(x['name']=='Mariagerfjord' and x['legacyBrandId']=='mariagerfjord-vand' for x in current),current
                colors=await page.evaluate("({nf:state.brandById.get('nordfyns-forsyning').color,vcs:state.brandById.get('vandcenter-syd').color,sd:state.brandById.get('syddjurs-spildevand').color,ad:state.brandById.get('aquadjurs').color})")
                assert colors['nf']==colors['vcs'],colors
                assert colors['sd']==colors['ad'],colors
                assert await page.locator('#showCoverage').is_checked()
                assert await page.locator('.leaflet-coverage-pane path').count()==98
                await page.locator('#search').fill('VandCenter Syd');await page.wait_for_timeout(150)
                assert await page.locator('.brand-row[data-current-operator-id="vandcenter-syd"]').count()==2
                await page.locator('#search').fill('AquaDjurs');await page.wait_for_timeout(150)
                assert await page.locator('.brand-row[data-current-operator-id="aquadjurs"]').count()==2
                await page.locator('#search').fill('Ren Forsyning Mariagerfjord');await page.wait_for_timeout(150)
                assert await page.locator('.brand-row[data-brand-id="mariagerfjord-vand"]').count()==1
                await page.locator('#search').fill('')
                await page.locator('#showCoverage').uncheck(); await page.wait_for_timeout(150)
                assert await page.locator('.leaflet-coverage-pane path').count()==0
                await page.locator('#showCoverage').check(); await page.wait_for_timeout(150)
                assert await page.locator('.leaflet-coverage-pane path').count()==98
                if mobile:
                  overflow=await page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth'); assert overflow<=3,overflow
                assert not errors,errors
                print(('MOBILE' if mobile else 'DESKTOP'),'CURRENT_OPERATOR_COVERAGE_QA',qa,colors)
                await page.screenshot(path=f"qa-coverage-{'mobile' if mobile else 'desktop'}.png",full_page=True)
                await ctx.close()
              await browser.close()
          asyncio.run(main())
          PY
          python /tmp/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: administrative-coverage-qa
          path: qa-coverage-*.png
          if-no-files-found: ignore
