name: Fetch Copenhagen official WWTP catchment layer

on:
  push:
    paths:
      - '.github/workflows/fetch-kk-official-wwtp-layer.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official GC2 data endpoint
        continue-on-error: true
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error
          from pathlib import Path

          host='https://webgis.digitaleplaner.dk'
          attempts=[]
          def hit(label,url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'daniellund-spildevandskort-source-audit/1.0','Accept':'application/json,*/*'})
              with urllib.request.urlopen(req,timeout=40) as r:
                body=r.read(); ct=r.headers.get('content-type','')
              txt=body.decode('utf-8','replace')
              attempts.append({'label':label,'url':url,'status':200,'contentType':ct,'bytes':len(body),'preview':txt[:1000]})
              try:
                obj=json.loads(txt)
                if isinstance(obj,dict) and (obj.get('features') is not None or obj.get('data') is not None or obj.get('success') is not None):
                  return obj
              except: pass
            except Exception as e:
              attempts.append({'label':label,'url':url,'error':repr(e)})
            return None

          def hit(label,url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'daniellund-spildevandskort-source-audit/1.0','Accept':'application/json,*/*'})
              with urllib.request.urlopen(req,timeout=60) as r:
                body=r.read(); ct=r.headers.get('content-type','')
              txt=body.decode('utf-8','replace')
              attempts.append({'label':label,'url':url,'status':200,'contentType':ct,'bytes':len(body),'preview':txt[:1000]})
              obj=json.loads(txt)
              return obj
            except Exception as e:
              attempts.append({'label':label,'url':url,'error':repr(e)})
              return None

          def summarize(obj):
            if not isinstance(obj,dict): return None
            features=obj.get('features') or []
            keys=sorted({k for f in features if isinstance(f,dict) for k in (f.get('properties') or {}).keys()})
            return {'success':obj.get('success'),'type':obj.get('type'),'featureCount':len(features),'propertyKeys':keys,'propertiesPreview':[f.get('properties',{}) for f in features[:5]]}

          sql='SELECT gid,id,opland,the_geom FROM spildevandsplan.oplande_renseanlaeg'
          source=host+'/api/sql/koebenhavn?'+urllib.parse.urlencode({'q':sql,'srs':'4326','client_encoding':'UTF8','format':'geojson'})
          result=hit('api-sql-oplande-renseanlaeg',source)

          status_sql='SELECT gid,id,label,kloaksystem_status,renseanlaeg,pe_status,pe_plan,ejer_spildevand,the_geom FROM spildevandsplan.kloakoplande_status'
          catch_source=host+'/api/sql/koebenhavn?'+urllib.parse.urlencode({'q':status_sql,'srs':'4326','client_encoding':'UTF8','format':'geojson'})
          catch=hit('api-sql-kloakoplande-status',catch_source)

          if isinstance(result,dict) and result.get('features') is not None:
            geo={'type':'FeatureCollection','features':result.get('features',[])}
            Path('labs/spildevandskort/data/kk-official-wwtp-catchment.geojson').write_text(json.dumps(geo,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
            meta={
              'version':1,
              'coverageStatus':'complete-official-source',
              'sourceUrl':'https://webgis.digitaleplaner.dk/app/koebenhavn/spildevandsplan%2Cskybrudsplan/',
              'queryUrl':source,
              'sourceLabel':'Københavns Kommunes officielle WebGIS, laget Oplande til Renseanlæg',
              'retrievedBy':'GitHub Actions',
              'features':[
                {'plantKey':'lynetten','plantName':'Renseanlæg Lynetten','oplandValue':'Renseanlæg Lynetten'},
                {'plantKey':'damhusaen','plantName':'Renseanlæg Damhusåen','oplandValue':'Renseanlæg Damhusåen'}
              ],
              'featureCount':len(result.get('features',[])),
              'propertyKeys':sorted({k for f in result.get('features',[]) for k in (f.get('properties') or {}).keys()})
            }
            Path('labs/spildevandskort/data/kk-official-wwtp-catchment-meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          out={
            'attempts':attempts,
            'wwtpLayerSource':source,
            'wwtpLayerSummary':summarize(result),
            'catchmentSource':catch_source,
            'catchmentSummary':summarize(catch)
          }
          Path('labs/spildevandskort/data/kk-official-wwtp-layer-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('OFFICIAL_WWTP_SOURCE',source)
          print('WWTP_SUMMARY',summarize(result))
          print('CATCHMENT_SOURCE',catch_source)
          print('CATCHMENT_SUMMARY',summarize(catch))
          if not isinstance(result,dict) or result.get('features') is None:
            raise SystemExit('No official WWTP catchment data resolved; inspect audit attempts')
          PY
      - name: Commit official source audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/kk-official-wwtp-layer-audit.json labs/spildevandskort/data/kk-official-wwtp-catchment.geojson labs/spildevandskort/data/kk-official-wwtp-catchment-meta.json
          git commit -m 'Capture Copenhagen official WWTP catchment data' || exit 0
          git push
