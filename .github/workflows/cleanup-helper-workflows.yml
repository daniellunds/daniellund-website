name: Cleanup WWTP helper workflows
on:
  push:
    paths:
      - '.github/workflows/cleanup-helper-workflows.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove completed one-off helpers
        run: |
          rm -f .github/workflows/audit-rudersdal-moelleaa.yml
          rm -f .github/workflows/audit-ltk-moelleaa.yml
          rm -f .github/workflows/add-ltk-gentofte-moelleaa.yml
          rm -f scripts/add_ltk_gentofte_moelleaa.py
          rm -f scripts/cleanup_note_tmp.txt
          rm -f .github/workflows/cleanup-helper-workflows.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed WWTP audit helpers'
          git push
