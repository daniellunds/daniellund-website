name: Add Frederiksberg WWTP relations

on:
  push:
    paths:
      - '.github/workflows/add-frederiksberg-wwtp-relations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add source-backed Frederiksberg relations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('labs/spildevandskort/data/wwtp-catchment-relations.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          src='https://www.frederiksberg.dk/media/zhfpmius/spildevandsplan_2019_2031_web.pdf'
          label='Frederiksberg Kommune – Spildevandsplan 2019-2031, hovedoplande'
          additions={
            'lynetten': {'municipalityCode':147,'planNumbers':['OPLAND1','OPLAND2','OPLAND3'],'sourceUrl':src,'sourceLabel':label},
            'damhusaen': {'municipalityCode':147,'planNumbers':['OPLAND4','OPLAND5'],'sourceUrl':src,'sourceLabel':label}
          }
          for plant in data['plants']:
              rel=additions.get(plant['plantKey'])
              if not rel: continue
              exists=any(r.get('municipalityCode',plant.get('municipalityCode'))==147 and set(r.get('planNumbers',[]))==set(rel['planNumbers']) for r in plant['relations'])
              if not exists: plant['relations'].append(rel)
          data['version']=4
          data['scope']='Pilot: source-backed wastewater catchments for BIOFOS Lynetten and Damhusåen across Copenhagen, Gentofte and Frederiksberg'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/wwtp-catchment-relations.json
          if git diff --cached --quiet; then
            echo 'No relation changes'
          else
            git commit -m 'Add Frederiksberg WWTP catchment relations'
            git push
          fi
