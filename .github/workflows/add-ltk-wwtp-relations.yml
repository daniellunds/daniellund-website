name: Add Lyngby-Taarbæk WWTP relations

on:
  push:
    paths:
      - '.github/workflows/add-ltk-wwtp-relations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add source-backed Lyngby-Taarbæk Lynetten relations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('labs/spildevandskort/data/wwtp-catchment-relations.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['version']=7
          data['scope']='Pilot: source-backed wastewater catchments for BIOFOS Lynetten and Damhusåen across Copenhagen, Gentofte, Frederiksberg, Herlev, Rødovre and Lyngby-Taarbæk'

          plant=next(p for p in data['plants'] if p['plantKey']=='lynetten')
          source_url='https://www.ltk.dk/media/5zzf1jim/kf-spildevandsplan-2014-2018-vers-10-2-2021.pdf'
          source_label='Lyngby-Taarbæk Kommune – Spildevandsplan 2014-2018, Bilag 7 kloakoplandsskema'
          plans=['ER01','ER02','ER03','ER04','NY02','TA01','TA02','TA03','TA04','TA05','TA06','TA07','TA08','TA09','TA10','TA11','TA12','TA13','TA14','TA15','TA16','TA17','TA18','TA19','TA20','TA21','TA23','TA24','TA26']

          exists=any(r.get('municipalityCode')==173 and r.get('sourceLabel')==source_label for r in plant['relations'])
          if not exists:
              plant['relations'].append({
                  'municipalityCode':173,
                  'planNumbers':plans,
                  'sourceUrl':source_url,
                  'sourceLabel':source_label
              })

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/wwtp-catchment-relations.json
          if git diff --cached --quiet; then
            echo 'No relation changes'
          else
            git commit -m 'Add Lyngby-Taarbæk Lynetten catchment relations'
            git push
          fi
