name: Audit Lynetten catchment completeness

on:
  push:
    paths:
      - '.github/workflows/audit-lynetten-completeness.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit all current wastewater catchments in Lynetten municipalities
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          from collections import defaultdict,Counter
          from pathlib import Path

          TARGET={101:'København',147:'Frederiksberg',157:'Gentofte',159:'Gladsaxe',173:'Lyngby-Taarbæk'}
          rel=json.loads(Path('labs/spildevandskort/data/wwtp-catchment-relations.json').read_text(encoding='utf-8'))
          def norm(v): return re.sub(r'\s+','',str(v or '')).upper()
          def keynorm(v): return re.sub(r'[^a-z0-9æøå]','',str(v or '').lower())
          def pick(p,cands):
              d={keynorm(k):v for k,v in p.items()}
              for c in cands:
                  if keynorm(c) in d:return d[keynorm(c)]
          classified=defaultdict(dict)
          source_by=defaultdict(dict)
          for plant in rel['plants']:
              default=plant.get('municipalityCode')
              for r in plant['relations']:
                  mc=int(r.get('municipalityCode',default))
                  for pn in r['planNumbers']:
                      n=norm(pn); classified[mc][n]=plant['plantKey']; source_by[mc][n]={'sourceUrl':r['sourceUrl'],'sourceLabel':r['sourceLabel']}
          base='https://geoserver.plandata.dk/geoserver/wfs'
          current=defaultdict(lambda:defaultdict(lambda:{'sewerTypes':set(),'features':0,'elementIds':[]}))
          start=0; page=5000
          while True:
              q=urllib.parse.urlencode({'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':'pdk:theme_pdk_kloakopland_vedtaget','outputFormat':'application/json','srsName':'EPSG:4326','count':page,'startIndex':start})
              req=urllib.request.Request(base+'?'+q,headers={'User-Agent':'lynetten-completeness-audit/1.0'})
              with urllib.request.urlopen(req,timeout=90) as f:data=json.load(f)
              feats=data.get('features',[])
              for ft in feats:
                  p=ft.get('properties') or {}
                  mc=pick(p,['kommunekode','kommune_kode','komnr','komkode','kommunenr','kommuneid'])
                  try:mc=int(float(mc))
                  except:continue
                  if mc not in TARGET:continue
                  pn=pick(p,['plannr','plannummer','plan_nr','oplandnr','oplandnummer'])
                  if pn is None:continue
                  sewer=pick(p,['nuvkode','nuv_kode','kloaktype','kloak_type','sewertype','kloaktypekode'])
                  try:sewer=int(float(sewer))
                  except:sewer=None
                  if sewer in (4,5):continue
                  n=norm(pn); row=current[mc][n]; row['features']+=1; row['sewerTypes'].add(sewer)
                  eid=pick(p,['elementid','element_id','id']) or ft.get('id')
                  if eid is not None and len(row['elementIds'])<10:row['elementIds'].append(str(eid))
              if len(feats)<page:break
              start+=len(feats)

          def inherited(mc,pn):
              candidates=[]
              for parent,plant in classified[mc].items():
                  if pn==parent or not pn.startswith(parent):continue
                  tail=pn[len(parent):]
                  # Safe subdivision inheritance: documented numeric parent followed by letter/dot suffix.
                  if not parent or not parent[0].isdigit() or not tail or tail[0].isdigit():continue
                  candidates.append((len(parent),parent,plant,source_by[mc].get(parent)))
              if not candidates:return None
              longest=max(x[0] for x in candidates)
              best=[x for x in candidates if x[0]==longest]
              plants={x[2] for x in best}
              if len(plants)!=1:return None
              _,parent,plant,src=best[0]
              return {'plantKey':plant,'parentPlanNumber':parent,'source':src}

          out={'targetMunicipalities':TARGET,'municipalities':{},'summary':{}}
          all_unclassified=[]; inheritance=[]; remaining=[]
          for mc,name in TARGET.items():
              rows=[]; counts=defaultdict(int)
              for pn,info in sorted(current[mc].items()):
                  plant=classified[mc].get(pn)
                  inherit=None if plant else inherited(mc,pn)
                  status=plant or ('inheritable:'+inherit['plantKey'] if inherit else 'unclassified')
                  counts[status]+=1
                  row={'planNumber':pn,'sewerTypes':sorted(x for x in info['sewerTypes'] if x is not None),'sourceFeatures':info['features'],'elementIds':info['elementIds'],'classification':plant,'inheritance':inherit}
                  rows.append(row)
                  if not plant:
                      rec={'municipalityCode':mc,'municipality':name,'planNumber':pn,'sewerTypes':row['sewerTypes']}
                      all_unclassified.append(rec)
                      if inherit: inheritance.append({**rec,**inherit})
                      else: remaining.append(rec)
              out['municipalities'][str(mc)]={'name':name,'currentWastewaterCatchments':len(rows),'counts':dict(counts),'catchments':rows}
          cph_remaining=[r for r in remaining if r['municipalityCode']==101]
          prefix_counts=Counter(re.match(r'^\d+',r['planNumber']).group(0)[:1] if re.match(r'^\d+',r['planNumber']) else 'OTHER' for r in cph_remaining)
          out['summary']={
            'currentWastewaterCatchments':sum(x['currentWastewaterCatchments'] for x in out['municipalities'].values()),
            'unclassifiedBeforeInheritance':len(all_unclassified),
            'safeInheritanceCandidates':len(inheritance),
            'safeInheritanceByPlant':dict(Counter(x['plantKey'] for x in inheritance)),
            'remainingAfterInheritance':len(remaining),
            'copenhagenRemainingAfterInheritance':len(cph_remaining),
            'copenhagenRemainingFirstDigit':dict(prefix_counts),
            'inheritanceCandidates':inheritance,
            'remaining':remaining
          }
          Path('labs/spildevandskort/data/lynetten-coverage-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in out['summary'].items() if k not in ('inheritanceCandidates','remaining')},ensure_ascii=False))
          for mc,v in out['municipalities'].items():print(mc,v['name'],v['counts'])
          PY
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/spildevandskort/data/lynetten-coverage-audit.json
          git commit -m 'Refine Lynetten completeness audit' || exit 0
          git push
