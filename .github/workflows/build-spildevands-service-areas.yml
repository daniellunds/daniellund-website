name: Build wastewater service areas

on:
  push:
    paths:
      - 'scripts/build-spildevands-service-areas.py'
      - 'scripts/rebuild-spildevandsoplande.py'
      - '.github/workflows/build-spildevands-service-areas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet requests shapely

      - name: Rebuild detailed sewer catchments
        run: python scripts/rebuild-spildevandsoplande.py

      - name: QA detailed catchments
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          from shapely.geometry import shape
          data=Path('labs/spildevandskort/data')
          features=[]
          for i in range(1,5):
              with gzip.open(data/f'spildevandsoplande-{i}.geojson.gz','rt',encoding='utf-8') as f:
                  features.extend(json.load(f)['features'])
          meta=json.loads((data/'spildevandsoplande-meta.json').read_text(encoding='utf-8'))
          codes={f['properties']['sewerTypeCode'] for f in features}
          assert codes=={1,2,3,4,6},codes
          assert all(f['properties'].get('displayType') for f in features)
          assert all(f['properties'].get('planStatus')=='Vedtaget' for f in features)
          assert len({f['properties']['municipalityCode'] for f in features})==97
          assert not any(f['properties']['sewerTypeCode']==5 for f in features)
          for f in features:
              g=shape(f['geometry']); assert not g.is_empty and g.is_valid,f['properties']
          print('DETAILED_CATCHMENT_QA_OK',len(features),meta)
          PY

      - name: Build service-area geometry
        run: python scripts/build-spildevands-service-areas.py

      - name: QA service-area output
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          from shapely.geometry import shape
          data=Path('labs/spildevandskort/data')
          with gzip.open(data/'service-areas.geojson.gz','rt',encoding='utf-8') as f:
              fc=json.load(f)
          meta=json.loads((data/'service-areas-meta.json').read_text(encoding='utf-8'))
          assert fc['type']=='FeatureCollection'
          assert 60 <= len(fc['features']) <= 80, len(fc['features'])
          assert meta['includedCurrentSewerTypeCodes']==[1,2,3,4,6]
          assert meta['excludedCurrentSewerTypeCodes']==[5]
          assert meta['rawFeatureCount'] >= 60000
          assert meta['excludedUnseweredFeatureCount'] > 8000
          ids=set()
          for f in fc['features']:
              p=f['properties']; oid=p['operatorBrandId']
              assert oid not in ids, oid; ids.add(oid)
              assert p['legacyBrandIds']
              assert set(p['sewerTypeCodes']).issubset({1,2,3,4,6})
              g=shape(f['geometry']); assert not g.is_empty and g.is_valid, oid
          assert 'vandcenter-syd' in ids
          assert 'aquadjurs' in ids
          print('SERVICE_AREA_QA_OK',len(fc['features']),meta)
          PY

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            labs/spildevandskort/data/spildevandsoplande-1.geojson.gz \
            labs/spildevandskort/data/spildevandsoplande-2.geojson.gz \
            labs/spildevandskort/data/spildevandsoplande-3.geojson.gz \
            labs/spildevandskort/data/spildevandsoplande-4.geojson.gz \
            labs/spildevandskort/data/spildevandsoplande-meta.json \
            labs/spildevandskort/data/service-areas.geojson.gz \
            labs/spildevandskort/data/service-areas-meta.json
          if git diff --cached --quiet; then
            echo 'Generated wastewater geometry unchanged.'
            exit 0
          fi
          git commit -m 'Update verified Plandata wastewater geometry'
          git pull --rebase origin main
          git push origin HEAD:main
