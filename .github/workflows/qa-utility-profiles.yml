name: QA utility profiles
on:
  push:
    paths:
      - 'labs/spildevandskort/**'
      - '.github/workflows/qa-utility-profiles.yml'
  pull_request:
    paths:
      - 'labs/spildevandskort/**'
      - '.github/workflows/qa-utility-profiles.yml'
permissions:
  contents: read
jobs:
  profile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static profile QA
        shell: bash
        run: |
          set -euo pipefail
          test -s labs/spildevandskort/profiles.js
          test -s labs/spildevandskort/profile-integration.js
          test -s labs/spildevandskort/profiles.css
          test -s labs/spildevandskort/data/utility-profiles-index.json
          test -s labs/spildevandskort/wastewater-relations.js
          test -s labs/spildevandskort/data/model/wastewater-relations.json
          node --check labs/spildevandskort/profiles.js
          node --check labs/spildevandskort/profile-integration.js
          node --check labs/spildevandskort/wastewater-relations.js
          node --check scripts/check-wastewater-relations.cjs
          node scripts/check-facility-registry.cjs
          node scripts/check-wastewater-relations.cjs
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('labs/spildevandskort/data')
          brands=json.loads((root/'brands.json').read_text(encoding='utf-8'))['brands']
          valid={b['id'] for b in brands}|{'biofos','moelleaavaerket','laesoe-forsyning'}
          index=json.loads((root/'utility-profiles-index.json').read_text(encoding='utf-8'))
          assert len(index.get('files',[]))>=8,index
          profiles={}
          for name in index['files']:
              path=root/name
              assert path.is_file() and path.stat().st_size>0,name
              data=json.loads(path.read_text(encoding='utf-8'))
              overlap=set(profiles)&set(data.get('profiles',{}))
              assert not overlap,('duplicate profile ids',overlap)
              profiles.update(data.get('profiles',{}))
          assert len(profiles)>=76, len(profiles)
          assert set(profiles)<=valid, set(profiles)-valid
          required={
            'din-forsyning','fors','envafors','aquadjurs','arwos','bluekolding','vandmiljoe-randers','silkeborg-forsyning','samn-forsyning','vejle-spildevand',
            'klar-forsyning','frederiksberg-forsyning','fredericia-spildevand','hilleroed-forsyning','forsyning-helsingoer','skanderborg-forsyning','herning-vand','vestforsyning','energi-viborg-vand','provas',
            'kalundborg-forsyning','frederikshavn-forsyning','broenderslev-forsyning','hjoerring-vandselskab','hedensted-spildevand','htk-forsyning','ikast-brande-spildevand','assens-forsyning','billund-vand-energi','beof',
            'faxe-forsyning','ffv','gribskov-forsyning','guldborgsund-forsyning','fredensborg-forsyning','halsnaes-forsyning','ishoej-forsyning','jammerbugt-forsyning','kerteminde-forsyning','fanoe-vand',
            'glostrup-forsyning','taarnby-forsyning','ltf','lolland-forsyning','odsherred-forsyning','ringsted-forsyning','vordingborg-forsyning','langeland-forsyning','middelfart-spildevand','nordfyns-forsyning',
            'favrskov-forsyning','lemvig-vand','mariagerfjord-vand','morsoe-forsyning','nyborg-forsyning','rebild-forsyning','rksk-forsyning','samsoe-spildevand','skive-vand','sonfor',
            'struer-energi','syddjurs-spildevand','thisted-vand','toender-forsyning','vand-og-affald','vejen-forsyning','vesthimmerlands-vand','aeroe-forsyning','laesoe-forsyning','moelleaavaerket'
          }
          assert required<=set(profiles),required-set(profiles)
          url_re=re.compile(r'^https://[^\s]+$')
          for bid,p in profiles.items():
              assert p.get('name')
              assert url_re.match(p.get('website','')), (bid,'website',p.get('website'))
              assert p.get('phone'), (bid,'phone')
              links=[]
              for c in p.get('contacts',[]):
                  assert c.get('name') and c.get('title'), (bid,c)
                  for key in ('linkedin','sourceUrl'):
                      if c.get(key): assert url_re.match(c[key]), (bid,key,c[key])
                  if c.get('linkedin'): links.append(c['linkedin'])
              assert len(links)==len(set(links)), (bid,'duplicate LinkedIn')
              for pr in p.get('projects',[]):
                  assert pr.get('name') and pr.get('status') and pr.get('description'), (bid,pr)
                  assert url_re.match(pr.get('url','')), (bid,'project',pr.get('url'))
          expected_names={
              'langeland-forsyning':'Langeland Energi & Forsyning',
              'mariagerfjord-vand':'Ren Forsyning Mariagerfjord',
              'nyborg-forsyning':'Nyborg Forsyning',
              'thisted-vand':'Thy Forsyning',
              'vesthimmerlands-vand':'Vesthimmerlands Forsyning',
              'vand-og-affald':'Vand & Affald'
          }
          for bid,name in expected_names.items():
              assert profiles[bid]['name']==name,(bid,profiles[bid]['name'],name)
          print('PROFILE_STATIC_QA_OK',len(profiles),'profiles',len(index['files']),'files')
          PY
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/profile-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/labs/spildevandskort/ >/dev/null && break; sleep 1; done
      - name: Test profiles desktop and mobile
        env:
          MAP_URL: http://127.0.0.1:4173/labs/spildevandskort/
        run: |
          cat > /tmp/profile_qa.py <<'PY'
          import asyncio,os
          from playwright.async_api import async_playwright
          async def check(browser,mobile=False):
              viewport={'width':390,'height':844} if mobile else {'width':1440,'height':900}
              ctx=await browser.new_context(viewport=viewport,is_mobile=mobile)
              page=await ctx.new_page(); errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              r=await page.goto(os.environ['MAP_URL'],wait_until='domcontentloaded',timeout=60000)
              assert r and r.ok,r.status if r else None
              await page.wait_for_function("state.profiles && state.profiles.size>=74",timeout=30000)
              await page.wait_for_function("typeof spildevandskortCanonicalUiState==='function' && spildevandskortCanonicalUiState().parity.matches===76",timeout=30000)
              await page.wait_for_function("state.wastewaterRelations?.counts?.auditedOrganizations===10",timeout=30000)
              await page.wait_for_function("Number(document.querySelector('#activePlantCount')?.textContent)>700",timeout=60000)

              # Regression: batch 1.
              await page.locator('#search').fill('HOFOR')
              await page.wait_for_selector('.brand-row[data-brand-id="hofor"] .profile-mini',timeout=10000)
              await page.locator('.brand-row[data-brand-id="hofor"] .profile-mini').click()
              assert '33 95 33 95' in await page.locator('#detailContent').inner_text()
              await page.locator('[data-profile-tab="people"]').click()
              assert 'Rebekka Nymark' in await page.locator('#profileTabBody').inner_text()
              await page.locator('#closeDetail').click()

              # Regression: batch 2.
              await page.locator('#search').fill('AquaDjurs')
              await page.wait_for_selector('.brand-row[data-brand-id="aquadjurs"] .profile-mini')
              await page.locator('.brand-row[data-brand-id="aquadjurs"] .profile-mini').click()
              assert '87 58 19 00' in await page.locator('#detailContent').inner_text()
              await page.locator('[data-profile-tab="projects"]').click()
              assert 'Fornæs Renseanlæg' in await page.locator('#profileTabBody').inner_text()
              await page.locator('#closeDetail').click()

              # Historical names resolve to the one canonical organization/profile.
              await page.locator('#search').fill('Nordfyns Forsyning')
              await page.wait_for_selector('.brand-row[data-organization-id="org:vandcenter-syd"] .profile-mini')
              assert await page.locator('.brand-row[data-organization-id="org:vandcenter-syd"]').count()==1
              await page.locator('.brand-row[data-organization-id="org:vandcenter-syd"] .profile-mini').click()
              assert 'VandCenter Syd' in await page.locator('.profile-head h2').inner_text()
              await page.locator('#closeDetail').click()
              await page.locator('#search').fill('Syddjurs Spildevand')
              await page.wait_for_selector('.brand-row[data-organization-id="org:aquadjurs"] .profile-mini')
              assert await page.locator('.brand-row[data-organization-id="org:aquadjurs"]').count()==1
              await page.locator('.brand-row[data-organization-id="org:aquadjurs"] .profile-mini').click()
              assert 'AquaDjurs' in await page.locator('.profile-head h2').inner_text()
              await page.locator('#closeDetail').click()

              # Regression: batch 3.
              await page.locator('#search').fill('Energi Viborg Vand')
              await page.wait_for_selector('.brand-row[data-brand-id="energi-viborg-vand"] .profile-mini')
              await page.locator('.brand-row[data-brand-id="energi-viborg-vand"] .profile-mini').click()
              assert '89 29 28 00' in await page.locator('#detailContent').inner_text()
              await page.locator('#closeDetail').click()

              # Regression: batch 4.
              await page.locator('#search').fill('Assens Forsyning')
              await page.wait_for_selector('.brand-row[data-brand-id="assens-forsyning"] .profile-mini')
              await page.locator('.brand-row[data-brand-id="assens-forsyning"] .profile-mini').click()
              assert '63 44 90 00' in await page.locator('#detailContent').inner_text()
              await page.locator('#closeDetail').click()

              # Regression: batch 5.
              await page.locator('#search').fill('Kerteminde Forsyning')
              await page.wait_for_selector('.brand-row[data-brand-id="kerteminde-forsyning"] .profile-mini')
              await page.locator('.brand-row[data-brand-id="kerteminde-forsyning"] .profile-mini').click()
              overview=await page.locator('#detailContent').inner_text()
              assert '70 25 33 33' in overview,overview
              await page.locator('[data-profile-tab="people"]').click()
              people=await page.locator('#profileTabBody').inner_text()
              assert 'Joakim Krenz' in people and 'Henning L. Hansen' in people and 'Kemal Kökten' in people,people
              await page.locator('[data-profile-tab="projects"]').click()
              projects=await page.locator('#profileTabBody').inner_text()
              assert 'Ny spildevandsplan' in projects,projects
              await page.locator('#closeDetail').click()

              # Regression: batch 6.
              await page.locator('#search').fill('Tårnby Forsyning')
              await page.wait_for_selector('.brand-row[data-brand-id="taarnby-forsyning"] .profile-mini')
              await page.locator('.brand-row[data-brand-id="taarnby-forsyning"] .profile-mini').click()
              overview=await page.locator('#detailContent').inner_text()
              assert '32 46 20 30' in overview,overview
              await page.locator('[data-profile-tab="people"]').click()
              assert 'Anja Whittard Dalberg' in await page.locator('#profileTabBody').inner_text()
              await page.locator('#closeDetail').click()

              # Batch 7: SONFOR current wastewater leadership and project.
              await page.locator('#search').fill('SONFOR')
              await page.wait_for_selector('.brand-row[data-brand-id="sonfor"] .profile-mini')
              await page.locator('.brand-row[data-brand-id="sonfor"] .profile-mini').click()
              assert '88 43 53 00' in await page.locator('#detailContent').inner_text()
              await page.locator('[data-profile-tab="people"]').click()
              assert 'Stinne Stokkebo' in await page.locator('#profileTabBody').inner_text()
              await page.locator('[data-profile-tab="projects"]').click()
              assert 'Projekt Værdivand' in await page.locator('#profileTabBody').inner_text()
              await page.locator('#closeDetail').click()

              # Batch 8: legacy Thisted map id resolves to current Thy Forsyning profile.
              await page.locator('#search').fill('Thisted Vand')
              await page.wait_for_selector('.brand-row[data-brand-id="thisted-vand"] .profile-mini')
              await page.locator('.brand-row[data-brand-id="thisted-vand"] .profile-mini').click()
              overview=await page.locator('#detailContent').inner_text()
              assert 'Thy Forsyning' in overview and '88 91 77 77' in overview,overview
              await page.locator('[data-profile-tab="people"]').click()
              people=await page.locator('#profileTabBody').inner_text()
              assert 'Jens Grønkjær Grandjean-Thomsen' in people,people
              await page.locator('[data-profile-tab="projects"]').click()
              assert 'Fremtidens renseanlægsstruktur' in await page.locator('#profileTabBody').inner_text()
              await page.locator('#closeDetail').click()

              # Canonical/current presentation names from the organization audit.
              for query,expected,bid in [
                  ('Langeland Forsyning','Langeland Energi & Forsyning','langeland-forsyning'),
                  ('Mariagerfjord Vand','Ren Forsyning Mariagerfjord','mariagerfjord-vand'),
                  ('Nyborg Forsyning & Service','Nyborg Forsyning','nyborg-forsyning'),
                  ('Vesthimmerlands Vand','Vesthimmerlands Forsyning','vesthimmerlands-vand'),
                  ('Vand og Affald','Vand & Affald','vand-og-affald')
              ]:
                  await page.locator('#search').fill(query);await page.wait_for_timeout(180)
                  assert await page.locator(f'.brand-row[data-brand-id="{bid}"]').count()==1,(query,bid)
                  await page.locator(f'.brand-row[data-brand-id="{bid}"] .profile-mini').click()
                  assert (await page.locator('.profile-head h2').inner_text()).strip()==expected,(query,expected)
                  section=page.locator('.wastewater-semantics')
                  assert await section.get_attribute('data-wastewater-audit-status')=='not-audited',(query,expected)
                  facts=await section.locator('.fact').evaluate_all("els=>Object.fromEntries(els.map(el=>[el.querySelector('span')?.textContent.trim(),el.querySelector('strong')?.textContent.trim()]))")
                  assert facts.get('Egne/driftede aktive renseanlæg')=='Ikke verificeret',(query,facts)
                  await page.locator('#closeDetail').click()

              # Delopgave 8 list semantics: owner-only, routed and unaudited cases.
              await page.locator('#search').fill('BIOFOS')
              await page.wait_for_selector('.brand-row[data-organization-id="org:biofos"]')
              row_text=await page.locator('.brand-row[data-organization-id="org:biofos"]').inner_text()
              assert 'Fælles renseorganisation' in row_text and '3 egne/driftede renseanlæg' in row_text,row_text
              await page.locator('#search').fill('Frederiksberg Forsyning')
              await page.wait_for_selector('.brand-row[data-organization-id="org:frederiksberg-forsyning"]')
              row_text=await page.locator('.brand-row[data-organization-id="org:frederiksberg-forsyning"]').inner_text()
              assert '0 egne/driftede renseanlæg' in row_text and 'Behandles hos BIOFOS' in row_text,row_text
              await page.locator('#search').fill('Silkeborg Forsyning')
              await page.wait_for_selector('.brand-row[data-organization-id="org:silkeborg-forsyning"]')
              assert 'Anlægstal ikke verificeret' in await page.locator('.brand-row[data-organization-id="org:silkeborg-forsyning"]').inner_text()

              # Delopgave 8: broad profile sample covers every audited relation case
              # plus one deliberately unaudited organization. Counts are read from
              # labelled facts, not inferred from PULS source-record totals.
              cases=[
                  ('org:biofos','verified','3',['Fælles renseorganisation','Renseanlæg Lynetten','Renseanlæg Damhusåen','Spildevandscenter Avedøre']),
                  ('org:aarhus-vand','verified','4',['Netforsyning · driver renseanlæg']),
                  ('org:vandcenter-syd','verified','8',['Netforsyning · driver renseanlæg']),
                  ('org:aquadjurs','verified','10',['Netforsyning · driver renseanlæg']),
                  ('org:moelleaavaerket','verified','1',['Fælles renseorganisation']),
                  ('org:frederiksberg-forsyning','verified','0',['BIOFOS · Renseanlæg Lynetten','BIOFOS · Renseanlæg Damhusåen']),
                  ('org:glostrup-forsyning','verified','0',['BIOFOS · Spildevandscenter Avedøre']),
                  ('org:ishoej-forsyning','verified','0',['BIOFOS · præcis anlægsfordeling ikke verificeret']),
                  ('org:ltf','verified','0',['Mølleåværket','BIOFOS · dele af kommunen','medejer af Mølleåværket']),
                  ('org:fanoe-vand','verified','0',['DIN Forsyning · Renseanlæg Øst']),
                  ('org:silkeborg-forsyning','not-audited','Ikke verificeret',['roller ikke fuldt auditeret'])
              ]
              for organization_id,audit_status,expected_count,snippets in cases:
                  await page.evaluate("id=>openBrandProfile(id)",organization_id)
                  section=page.locator('.wastewater-semantics')
                  assert await section.get_attribute('data-wastewater-audit-status')==audit_status,organization_id
                  facts=await section.locator('.fact').evaluate_all("els=>Object.fromEntries(els.map(el=>[el.querySelector('span')?.textContent.trim(),el.querySelector('strong')?.textContent.trim()]))")
                  assert facts.get('Egne/driftede aktive renseanlæg')==expected_count,(organization_id,facts)
                  text=await section.inner_text()
                  assert 'aktive puls-poster' in text.lower(),(organization_id,text)
                  for snippet in snippets: assert snippet in text,(organization_id,snippet,text)
                  await page.locator('#closeDetail').click()

              assert not errors,errors
              if mobile:
                  overflow=await page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')
                  assert overflow<=3,f'overflow={overflow}'
              label='mobile' if mobile else 'desktop'
              await page.screenshot(path=f'profile-{label}.png',full_page=True)
              print(f'PROFILE_{label.upper()}_QA_OK profiles=74')
              await ctx.close()
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  await check(browser,False);await check(browser,True)
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/profile_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utility-profile-qa-screenshots
          path: profile-*.png
          if-no-files-found: ignore
