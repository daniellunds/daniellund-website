name: Audit current Rudersdal 2025 plan data source

on:
  push:
    paths:
      - '.github/workflows/audit-rudersdal-2025-network.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read current Rudersdal minimap layer configuration
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session(); base='https://kort.rudersdal.dk/spatialmap'; mid='ab8dcca4-cc5c-458d-8096-7b46ddb1bc76'
          def call(label,params,method='get'):
              try:
                  r=getattr(s,method)(base,params=params,timeout=15)
                  print('\n===',label,r.status_code,r.url,'COOKIES',s.cookies.get_dict(),'===')
                  print(r.text[:150000]); return r
              except Exception as e: print(label,'ERROR',repr(e)); return None
          call('SESSION',{'page':'spatialserver.session.create'})
          call('MINIMAP',{'page':'minimap2-generic-data-access','datasource':'minimap2_minimap','command':'read-id','id':mid,'jsonformat':'compact'})
          call('CLIENTINFO',{'page':'minimap2.get-clientinfo','jsonformat':'compact'})
          call('LAYERS',{'page':'minimap2-generic-data-access','datasource':'minimap2_layers','command':'read-id','id':mid,'jsonformat':'compact'})
          call('CONTROLS',{'page':'minimap2-generic-data-access','datasource':'minimap2_controls','command':'read-id','id':mid,'jsonformat':'compact'})
          call('PRINCIPAL',{'page':'spatialserver.principal.get-principal'})
          PY
