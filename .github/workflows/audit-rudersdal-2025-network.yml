name: Audit current Rudersdal 2025 plan data source

on:
  push:
    paths:
      - '.github/workflows/audit-rudersdal-2025-network.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Rudersdal minimap configuration
        run: |
          python - <<'PY'
          import requests,re,json
          s=requests.Session()
          base='https://kort.rudersdal.dk/spatialmap'
          targets=[
            ('version',{'page':'minimap2.get-version-by-id','id':'ab8dcca4-cc5c-458d-8096-7b46ddb1bc76'}),
            ('clientinfo',{'page':'minimap2.get-clientinfo'}),
            ('generic',{'page':'minimap2-generic-data-access'}),
          ]
          for name,params in targets:
              try:
                  r=s.get(base,params=params,timeout=12)
                  print('\n===',name,r.status_code,r.url,r.headers.get('content-type'),len(r.content),'===')
                  print(r.text[:120000])
              except Exception as e: print(name,'ERROR',repr(e))
          # Also inspect loader source for the API contract/parameter names.
          for u in [
            'https://kort.rudersdal.dk/clientapi/minimap2/2.14.x/minimap.js',
            'https://kort.rudersdal.dk/clientapi/minimap2/mmloader.js'
          ]:
              try:
                  r=s.get(u,timeout=12); t=r.text
                  print('\n=== JS',u,r.status_code,len(t),'===')
                  for needle in ['generic-data-access','getfeature','featureinfo','cbinfo','query']:
                      for m in list(re.finditer(needle,t,re.I))[:8]:
                          print('JS_HIT',needle,re.sub(r'\s+',' ',t[max(0,m.start()-1000):m.start()+2500])[:3500])
              except Exception as e: print('JS_ERROR',repr(e))
          PY
