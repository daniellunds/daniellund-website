name: Audit current Rudersdal 2025 plan data source

on:
  push:
    paths:
      - '.github/workflows/audit-rudersdal-2025-network.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture current Rudersdal map click responses
        run: |
          python - <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1600,'height':1400})
                  captured=[]

                  async def on_response(resp):
                      u=resp.url
                      low=u.lower()
                      if not any(k in low for k in ('getfeatureinfo','spatialquery','query','click','featureinfo','sfs/rest','spatialmap?page=')):
                          return
                      if 'kort.rudersdal.dk' not in low:
                          return
                      try:
                          ct=(resp.headers.get('content-type') or '').lower()
                          body=await resp.text() if any(x in ct for x in ('text','json','xml','html')) else ''
                      except Exception:
                          body=''
                      if body and len(body)>120000: body=body[:120000]
                      captured.append({'url':u,'status':resp.status,'contentType':resp.headers.get('content-type'),'body':body})

                  page.on('response',lambda r: asyncio.create_task(on_response(r)))
                  await page.goto('https://rudersdal.dkplan.dk/3788',wait_until='networkidle',timeout=60000)
                  await page.wait_for_timeout(3000)
                  act=page.get_by_text('Klik for at aktivere kortet',exact=False)
                  if await act.count():
                      try: await act.first.click(timeout=10000)
                      except Exception as e: print('ACTIVATE_ERROR',repr(e))
                      await page.wait_for_timeout(8000)

                  # Find likely map containers/canvases.
                  candidates=await page.locator('div,canvas').evaluate_all("els=>els.map(e=>{const r=e.getBoundingClientRect(),c=e.className||'',id=e.id||'';return {tag:e.tagName,id,class:String(c),x:r.x,y:r.y,w:r.width,h:r.height}}).filter(x=>x.w>500&&x.h>250).sort((a,b)=>b.w*b.h-a.w*a.h).slice(0,30)")
                  print('MAP_CANDIDATES',json.dumps(candidates,ensure_ascii=False))
                  mapbox=None
                  for c in candidates:
                      if ('mini' in (c['class']+' '+c['id']).lower() or c['tag']=='CANVAS') and c['w']>500 and c['h']>250:
                          mapbox=c; break
                  if not mapbox:
                      # Prefer a large rectangle lower in page, not body wrapper.
                      for c in candidates:
                          if c['h']<800 and c['y']>200:
                              mapbox=c;break
                  print('CHOSEN_MAP',json.dumps(mapbox,ensure_ascii=False))
                  if not mapbox:
                      print('NO_MAP_BOX'); await browser.close(); return

                  # Click a grid; reset capture after initial map load.
                  captured.clear()
                  x0,y0,w,h=mapbox['x'],mapbox['y'],mapbox['w'],mapbox['h']
                  points=[]
                  for fy in (0.18,0.32,0.46,0.60,0.74,0.86):
                      for fx in (0.14,0.28,0.42,0.56,0.70,0.84):
                          points.append((x0+w*fx,y0+h*fy,fx,fy))
                  for idx,(x,y,fx,fy) in enumerate(points):
                      before=len(captured)
                      try:
                          await page.mouse.click(x,y)
                          await page.wait_for_timeout(700)
                      except Exception as e:
                          print('CLICK_ERROR',idx,fx,fy,repr(e)); continue
                      # print visible popup text after each click if any
                      txt=''
                      for sel in ['.ol-popup','.popup','.minimap-popup','.spatialmap-popup','.ol-overlay-container-stopevent']:
                          loc=page.locator(sel)
                          if await loc.count():
                              try:
                                  vals=await loc.all_inner_texts(); vals=[re.sub(r'\s+',' ',v).strip() for v in vals if v.strip()]
                                  if vals: txt=' | '.join(vals)[:8000]; break
                              except: pass
                      if txt: print('POPUP',idx,fx,fy,txt)
                      if len(captured)>before:
                          print('CLICK_CAPTURE_COUNT',idx,fx,fy,len(captured)-before)

                  await page.wait_for_timeout(2500)
                  print('CAPTURED_RESPONSES',json.dumps(captured,ensure_ascii=False)[:350000])
                  await browser.close()
          asyncio.run(main())
          PY
