name: Audit current Rudersdal 2025 plan data source

on:
  push:
    paths:
      - '.github/workflows/audit-rudersdal-2025-network.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Inspect DKplan network and current plan content
        run: |
          python - <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          URL='https://rudersdal.dkplan.dk/plan/5#/'
          NEEDLES=('mølleåværket','molleaavaerket','renseanlæg','renseanlaeg','kloakopland','søllerød','soelleroed')

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1440,'height':1000})
                  responses=[]
                  async def inspect_response(response):
                      url=response.url
                      ctype=(response.headers.get('content-type') or '').lower()
                      if not any(x in ctype for x in ('json','text','javascript','xml')):
                          return
                      if not any(host in url for host in ('rudersdal.dkplan.dk','dkplan','gopublic')):
                          return
                      try:
                          body=await response.text()
                      except Exception:
                          return
                      low=body.lower()
                      hits=[n for n in NEEDLES if n in low]
                      if hits:
                          snippets=[]
                          for needle in hits[:4]:
                              i=low.find(needle)
                              snippets.append(re.sub(r'\s+',' ',body[max(0,i-260):i+650])[:950])
                          responses.append({'url':url,'contentType':ctype,'hits':hits,'snippets':snippets})
                  page.on('response',lambda r: asyncio.create_task(inspect_response(r)))
                  r=await page.goto(URL,wait_until='domcontentloaded',timeout=60000)
                  print('HTTP',r.status if r else None)
                  await page.wait_for_timeout(15000)
                  print('TITLE',await page.title())
                  text=re.sub(r'\s+',' ',await page.locator('body').inner_text())
                  print('BODY_TEXT',text[:12000])
                  resources=await page.evaluate("performance.getEntriesByType('resource').map(e=>e.name)")
                  print('RESOURCES',json.dumps(resources,ensure_ascii=False))
                  storage=await page.evaluate("({local:{...localStorage},session:{...sessionStorage}})")
                  print('STORAGE',json.dumps(storage,ensure_ascii=False)[:20000])
                  await page.wait_for_timeout(3000)
                  print('MATCHING_RESPONSES',json.dumps(responses,ensure_ascii=False)[:60000])
                  await browser.close()
          asyncio.run(main())
          PY
