name: Audit current Rudersdal 2025 plan data source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-rudersdal-2025-network.yml'
      - 'scripts/audit_rudersdal_current.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Audit current Rudersdal 2025 plan network
        run: python scripts/audit_rudersdal_current.py
      - name: Commit audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/audits/rudersdal-2025-network.json
          if git diff --cached --quiet; then
            echo 'No audit changes'
          else
            git commit -m 'Capture Rudersdal 2025 plan source audit'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
