name: Audit current Rudersdal 2025 plan data source

on:
  push:
    paths:
      - '.github/workflows/audit-rudersdal-2025-network.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe current Rudersdal sewer catchment service
        run: |
          python - <<'PY'
          import requests, re
          base='https://kort.rudersdal.dk'
          urls=[
            base+'/wms?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetCapabilities&SERVICENAME=extern-spildevandsplan2025',
            base+'/wfs?SERVICE=WFS&VERSION=1.1.0&REQUEST=GetCapabilities&SERVICENAME=extern-spildevandsplan2025',
            base+'/wfs?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities&SERVICENAME=extern-spildevandsplan2025',
            base+'/spatialmap?page=minimap2-generic-data-access',
          ]
          for u in urls:
              try:
                  r=requests.get(u,timeout=35)
                  print('\nURL',u,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
                  t=r.text
                  for needle in ['theme-gidas_status_kloakoplandecustomergeoview_wfs_2025','kloakopland','rense','anlaeg','anlæg','recipient']:
                      if needle.lower() in t.lower():
                          i=t.lower().find(needle.lower())
                          print('HIT',needle,re.sub(r'\s+',' ',t[max(0,i-1200):i+3500])[:4700])
                  print('HEAD',re.sub(r'\s+',' ',t[:6000]))
              except Exception as e:
                  print('ERROR',u,repr(e))

          # Try likely public WFS type names directly.
          names=[
            'theme-gidas_status_kloakoplandecustomergeoview_wfs_2025',
            'gidas_status_kloakoplandecustomergeoview_wfs_2025',
          ]
          for name in names:
              for ver in ['1.1.0','2.0.0']:
                  params={'SERVICE':'WFS','VERSION':ver,'REQUEST':'GetFeature','TYPENAME':name,'COUNT':'5','MAXFEATURES':'5','OUTPUTFORMAT':'application/json','SERVICENAME':'extern-spildevandsplan2025'}
                  try:
                      r=requests.get(base+'/wfs',params=params,timeout=35)
                      print('\nGETFEATURE',name,ver,r.status_code,r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
                      print(r.text[:20000])
                  except Exception as e: print('GETFEATURE_ERROR',repr(e))
          PY
