name: Audit current Rudersdal 2025 plan data source

on:
  push:
    paths:
      - '.github/workflows/audit-rudersdal-2025-network.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Inspect current Rudersdal treatment-plant and map sources
        run: |
          python - <<'PY'
          import asyncio, json, re, requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          pages=['3588','3795','3796','3797','3798','3806','6119','3788']
          for pid in pages:
              u=f'https://rudersdal.dkplan.dk/{pid}'
              r=requests.get(u,timeout=30)
              soup=BeautifulSoup(r.text,'html.parser')
              text=' '.join(soup.stripped_strings)
              print(f'\n=== STATIC {pid} {r.status_code} {soup.title.string if soup.title else ""} ===')
              print(text[:25000])
              print('IFRAMES',json.dumps([x.get('src') for x in soup.find_all('iframe')],ensure_ascii=False))
              for tag in soup.find_all(['script','a']):
                  val=tag.get('src') or tag.get('href') or ''
                  if any(k in val.lower() for k in ('map','mini','sweco','novafos','wfs','arcgis','geojson','service')):
                      print('RESOURCE_OR_LINK',val)

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1440,'height':1200})
                  reqs=[]
                  def record(req):
                      u=req.url
                      if any(k in u.lower() for k in ('map','mini','sweco','novafos','wfs','arcgis','geojson','feature','service','api')):
                          reqs.append(u)
                  page.on('request',record)
                  await page.goto('https://rudersdal.dkplan.dk/3788',wait_until='networkidle',timeout=60000)
                  await page.wait_for_timeout(3000)
                  buttons=page.get_by_text('Klik for at aktivere kortet',exact=False)
                  if await buttons.count():
                      try:
                          await buttons.first.click(timeout=10000)
                          await page.wait_for_timeout(12000)
                      except Exception as e:
                          print('MAP_CLICK_ERROR',repr(e))
                  print('MAP_FRAMES',json.dumps([f.url for f in page.frames],ensure_ascii=False))
                  print('MAP_REQUESTS',json.dumps(list(dict.fromkeys(reqs)),ensure_ascii=False)[:100000])
                  print('MAP_BODY',re.sub(r'\s+',' ',await page.locator('body').inner_text())[:20000])
                  await browser.close()
          asyncio.run(main())
          PY
