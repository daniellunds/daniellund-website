name: QA WWTP catchment pilot

on:
  push:
    paths:
      - 'labs/spildevandskort/wwtp-catchments.js'
      - 'labs/spildevandskort/index.html'
      - 'labs/spildevandskort/data/wwtp-catchment-pilot.geojson'
      - 'labs/spildevandskort/data/wwtp-catchment-pilot-meta.json'
      - 'labs/spildevandskort/data/wwtp-catchment-relations.json'
      - 'scripts/qa_wwtp_catchment_pilot.py'
      - 'scripts/qa_wwtp_catchment_browser.py'
      - '.github/workflows/qa-wwtp-catchment-pilot.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static pilot QA
        run: |
          node --check labs/spildevandskort/wwtp-catchments.js
          test -s labs/spildevandskort/data/wwtp-catchment-pilot.geojson
          test -s labs/spildevandskort/data/wwtp-catchment-pilot-meta.json
          python scripts/qa_wwtp_catchment_pilot.py
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4184 --bind 127.0.0.1 >/tmp/wwtp-pilot-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4184/labs/spildevandskort/ >/dev/null && break; sleep 1; done
      - name: Test plant click and catchment highlight
        env:
          MAP_URL: http://127.0.0.1:4184/labs/spildevandskort/
        run: python scripts/qa_wwtp_catchment_browser.py
