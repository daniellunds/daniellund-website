name: QA labs spildevandskort
on:
  push:
    paths:
      - 'labs/spildevandskort/**'
      - '.github/workflows/qa-labs-spildevandskort.yml'
  pull_request:
    paths:
      - 'labs/spildevandskort/**'
      - '.github/workflows/qa-labs-spildevandskort.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static asset QA
        shell: bash
        run: |
          set -euo pipefail
          test -s labs/spildevandskort/index.html
          test -s labs/spildevandskort/styles.css
          test -s labs/spildevandskort/fonts/SwecoSans-Regular.woff2
          test -s labs/spildevandskort/fonts/SwecoSans-Medium.woff2
          test -s labs/spildevandskort/fonts/SwecoSans-Italic.woff2
          grep -q 'font-family:"Sweco Sans"' labs/spildevandskort/styles.css
          grep -q 'SwecoSans-Regular.woff2' labs/spildevandskort/styles.css
          grep -q 'SwecoSans-Medium.woff2' labs/spildevandskort/styles.css
          grep -q 'SwecoSans-Italic.woff2' labs/spildevandskort/styles.css
          grep -q 'SwecoSans-Regular.woff2' labs/spildevandskort/index.html
          grep -q 'SwecoSans-Medium.woff2' labs/spildevandskort/index.html
          test -s labs/spildevandskort/app1.js
          test -s labs/spildevandskort/app2.js
          test -s labs/spildevandskort/projects.js
          test -s labs/spildevandskort/projects.css
          test -s labs/spildevandskort/project-geocoder.js
          test -s labs/spildevandskort/basemaps.js
          test -s labs/spildevandskort/data/project-locations.json
          test -s labs/spildevandskort/data/brands.json
          test -s labs/spildevandskort/data/spildevandsoplande-meta.json
          test -s labs/spildevandskort/wastewater-relations.js
          test -s labs/spildevandskort/data/model/wastewater-relations.json
          for i in 1 2 3 4; do
            test -s "labs/spildevandskort/data/spildevandsoplande-$i.geojson.gz"
            gzip -t "labs/spildevandskort/data/spildevandsoplande-$i.geojson.gz"
          done
          node --check labs/spildevandskort/app1.js
          node --check labs/spildevandskort/app2.js
          node --check labs/spildevandskort/projects.js
          node --check labs/spildevandskort/project-geocoder.js
          node --check labs/spildevandskort/basemaps.js
          node --check labs/spildevandskort/wastewater-relations.js
          node scripts/check-facility-registry.cjs
          node scripts/check-plant-presentation.cjs
          node scripts/check-wastewater-relations.cjs
          python - <<'PY'
          import json, gzip
          from pathlib import Path
          root=Path('labs/spildevandskort/data')
          font_root=Path('labs/spildevandskort/fonts')
          for name in ['SwecoSans-Regular.woff2','SwecoSans-Medium.woff2','SwecoSans-Italic.woff2']:
              raw=(font_root/name).read_bytes()
              assert raw[:4]==b'wOF2',(name,raw[:4])
              assert len(raw)>5000,(name,len(raw))
          b=json.loads((root/'brands.json').read_text())
          meta=json.loads((root/'spildevandsoplande-meta.json').read_text())
          loc=json.loads((root/'project-locations.json').read_text())
          features=[]
          for i in range(1,5):
              with gzip.open(root/f'spildevandsoplande-{i}.geojson.gz','rt',encoding='utf-8') as f:
                  features.extend(json.load(f).get('features',[]))
          rendered=len(features)
          codes={int(x['properties']['sewerTypeCode']) for x in features}
          assert b.get('brandCount') == 73
          assert b.get('municipalityCount') == 97
          assert len(b.get('brands',[])) == 73
          assert meta.get('rawFeatureCount',0) >= 60000,meta
          assert meta.get('municipalityCount') == 97,meta
          assert meta.get('includedCurrentSewerTypeCodes') == [1,2,3,4,6],meta
          assert meta.get('excludedCurrentSewerTypeCodes') == [5],meta
          assert meta.get('excludedUnseweredFeatureCount',0) > 8000,meta
          assert meta.get('invalidOrEmptyGeometryCount') == 0,meta
          assert rendered == meta.get('mapFeatureCount'),(rendered,meta)
          assert 300 <= rendered <= 500,rendered
          assert codes == {1,2,3,4,6},codes
          assert all(x['properties'].get('displayType') for x in features)
          assert all(x['properties'].get('planStatus')=='Vedtaget' for x in features)
          anchors=loc.get('anchors',[])
          assert len(anchors)>=20,len(anchors)
          for a in anchors:
              assert a.get('label') and a.get('matches')
              assert 54 <= float(a['lat']) <= 58.5 and 7.5 <= float(a['lon']) <= 16,(a['label'],a['lat'],a['lon'])
              assert a.get('precision')=='område',a
              assert str(a.get('sourceUrl','')).startswith('https://'),a
          rewater=[a for a in anchors if 'aarhus rewater' in [x.lower() for x in a.get('matches',[])]]
          assert len(rewater)==1 and rewater[0]['label']=='Tangkrogen',rewater
          assert 'aarhusvand.dk' in rewater[0]['sourceUrl'],rewater
          print(f"STATIC_QA_OK brands=73 PlandataRaw={meta['rawFeatureCount']} renderedFeatures={rendered} sewerCodes={sorted(codes)} projectAnchors={len(anchors)}")
          PY
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/map-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/labs/spildevandskort/ >/dev/null && break; sleep 1; done
      - name: Run desktop and mobile QA
        env:
          MAP_URL: http://127.0.0.1:4173/labs/spildevandskort/
        run: |
          cat > /tmp/qa.py <<'PY'
          import asyncio, os, re
          from playwright.async_api import async_playwright

          EXPECTED=['Hovedstaden','Nordsjælland','Sjælland','Bornholm','Fyn','Syd- og Sønderjylland','Midtjylland','Nordjylland']

          async def check(browser, mobile=False):
              viewport={"width":390,"height":844} if mobile else {"width":1440,"height":900}
              context=await browser.new_context(viewport=viewport, is_mobile=mobile)
              page=await context.new_page()
              errors=[]
              page.on('pageerror', lambda e: errors.append(str(e)))
              response=await page.goto(os.environ['MAP_URL'],wait_until='domcontentloaded',timeout=60000)
              assert response and response.ok, f'HTTP {response.status if response else "none"}'
              await page.wait_for_selector('.leaflet-container',timeout=30000)
              await page.wait_for_function("Number(document.querySelector('#brandCount')?.textContent)>60",timeout=30000)
              await page.wait_for_function("typeof spildevandskortCanonicalUiState==='function' && spildevandskortCanonicalUiState().parity.matches===76",timeout=30000)
              await page.wait_for_function("Number(document.querySelector('#projectCount')?.textContent)>80",timeout=30000)
              await page.wait_for_function("document.querySelectorAll('.region-group').length===8",timeout=30000)
              await page.wait_for_function("document.querySelectorAll('#map .leaflet-interactive').length>100",timeout=60000)
              await page.wait_for_function("Number(document.querySelector('#activePlantCount')?.textContent)>0",timeout=60000)
              await page.wait_for_timeout(1000)

              await page.wait_for_function("""async()=>{await document.fonts.ready;return [...document.fonts].some(f=>f.family.replace(/['"]/g,'')==='Sweco Sans'&&f.status==='loaded')}""",timeout=15000)
              font_qa=await page.evaluate("""() => ({
                body:getComputedStyle(document.body).fontFamily,
                heading:getComputedStyle(document.querySelector('.brand-header h1')).fontFamily,
                tab:getComputedStyle(document.querySelector('.tab')).fontFamily,
                leaflet:getComputedStyle(document.querySelector('.leaflet-control-zoom-in')).fontFamily,
                loaded:[...document.fonts].filter(f=>f.family.replace(/['"]/g,'')==='Sweco Sans'&&f.status==='loaded').map(f=>({weight:f.weight,style:f.style}))
              })""")
              for key in ['body','heading','tab','leaflet']:
                  assert 'Sweco Sans' in font_qa[key],(key,font_qa)
              assert any(x['weight']=='400' and x['style']=='normal' for x in font_qa['loaded']),font_qa
              assert any(('500' in x['weight'] or '500 900' in x['weight']) and x['style']=='normal' for x in font_qa['loaded']),font_qa

              brands=int((await page.locator('#brandCount').inner_text()).strip())
              plants=int(re.sub(r'\D','',await page.locator('#activePlantCount').inner_text()) or 0)
              projects=int(re.sub(r'\D','',await page.locator('#projectCount').inner_text()) or 0)
              regions=await page.locator('.region-group').count()
              interactive=await page.locator('#map .leaflet-interactive').count()
              names=await page.locator('.region-name').all_inner_texts()
              status_visible=await page.locator('#statusBanner').is_visible()
              map_box=await page.locator('#map').bounding_box()

              assert brands == 74, f'canonicalOrganizationCount={brands}'
              canonical=await page.evaluate("spildevandskortCanonicalUiState()")
              assert canonical['organizationCount']==74,canonical
              assert canonical['sourceIdentityCount']==76,canonical
              assert canonical['visibleOrganizationCount']==74,canonical
              assert len(canonical['renderedOrganizationIds'])==74 and len(set(canonical['renderedOrganizationIds']))==74,canonical
              assert canonical['parity']=={'checked':76,'matches':76,'mismatchCount':0},canonical
              assert plants == 27, f'verifiedPlantCount={plants}'
              assert (await page.locator('#activePlantCount + span').inner_text()).strip()=='verificerede anlæg'
              assert projects >= 100, f'projectCount={projects}'
              assert regions == 8, f'regionGroups={regions}'
              assert names == EXPECTED, names
              assert interactive > 100, f'leafletInteractive={interactive}'
              assert not status_visible, 'statusBanner shows data-loading error'
              assert map_box and map_box['width']>250 and map_box['height']>180, map_box
              assert await page.locator('#brandControls').is_visible()
              assert not await page.locator('#plantControls').is_visible()
              assert not await page.locator('#projectControls').is_visible()
              assert await page.locator('.leaflet-control-layers').count()==1

              puls_schema=await page.evaluate("""() => {
                const cap=state.plants.find(p=>Object.prototype.hasOwnProperty.call(p.sourceProperties||{},'DesignedCapacity'));
                const load=state.plants.find(p=>Object.prototype.hasOwnProperty.call(p.sourceProperties||{},'AuthorizedLoad'));
                const vol=state.plants.find(p=>Object.prototype.hasOwnProperty.call(p.sourceProperties||{},'LatestDischargeVolume'));
                return {
                  nullParser:n(null)===null && n(undefined)===null && n('')===null && n('   ')===null,
                  capacityMapped:!!cap && cap.capacity===cap.sourceProperties.DesignedCapacity,
                  loadMapped:!!load && load.approvedLoad===load.sourceProperties.AuthorizedLoad,
                  volumeMapped:!!vol && vol.latestVolume===vol.sourceProperties.LatestDischargeVolume,
                  activeWithCapacity:state.plants.filter(p=>p.active && n(p.capacity)!==null).length
                };
              }""")
              assert puls_schema['nullParser'], puls_schema
              assert puls_schema['capacityMapped'], puls_schema
              assert puls_schema['loadMapped'], puls_schema
              assert puls_schema['volumeMapped'], puls_schema
              assert puls_schema['activeWithCapacity'] >= 700, puls_schema

              # Canonical organization presentation: legacy/source identities remain searchable but do not create duplicate rows.
              await page.locator('#search').fill('Nordfyns Forsyning')
              await page.wait_for_timeout(200)
              assert await page.locator('.brand-row').count()==1
              assert 'VandCenter Syd' in await page.locator('.brand-row').first.inner_text()
              await page.locator('#search').fill('Syddjurs Spildevand')
              await page.wait_for_timeout(200)
              assert await page.locator('.brand-row').count()==1
              assert 'AquaDjurs' in await page.locator('.brand-row').first.inner_text()
              await page.locator('#search').fill('Langeland Forsyning')
              await page.wait_for_timeout(200)
              assert await page.locator('.brand-row').count()==1
              assert 'Langeland Energi & Forsyning' in await page.locator('.brand-row').first.inner_text()
              assert 'aktive renseanlæg' not in (await page.locator('.brand-row').first.inner_text()).lower()
              await page.locator('#search').fill('')

              await page.locator('.region-group[data-region="hovedstaden"] .region-toggle').click()
              assert await page.locator('.region-group[data-region="hovedstaden"] .brand-row').count() > 0
              await page.locator('#search').fill('Fyn')
              await page.wait_for_timeout(250)
              assert await page.locator('.region-group[data-region="fyn"] .brand-row').count() > 0
              await page.locator('#search').fill('')

              await page.locator('.tab[data-tab="plants"]').click()
              await page.wait_for_timeout(300)
              assert await page.locator('#plantControls').is_visible()
              assert not await page.locator('#brandControls').is_visible()
              assert not await page.locator('#projectControls').is_visible()
              assert await page.locator('#showVerifiedPlants').is_checked()
              assert await page.locator('#showPulsRecords').is_checked()
              default_plant_rows=await page.locator('.plant-row').count()
              assert default_plant_rows > 600, f'defaultPlantRows={default_plant_rows}'
              await page.locator('#showPulsRecords').uncheck()
              await page.wait_for_timeout(300)
              verified_plant_rows=await page.locator('.plant-row').count()
              assert verified_plant_rows == 27, f'verifiedPlantRows={verified_plant_rows}'

              await page.locator('.tab[data-tab="projects"]').click()
              await page.wait_for_timeout(1500)
              assert await page.locator('#projectControls').is_visible()
              assert not await page.locator('#brandControls').is_visible()
              assert not await page.locator('#plantControls').is_visible()
              project_rows=await page.locator('.project-row').count()
              project_markers=await page.locator('#map .project-marker-shell').count()
              assert project_rows >= 100, f'projectRows={project_rows}'
              assert project_markers >= 20, f'projectMarkers={project_markers}'
              assert project_markers < project_rows, f'expected withheld projects: markers={project_markers} rows={project_rows}'
              assert await page.locator('#projectLegend').is_visible()
              assert await page.locator('.project-row.unmapped').count() > 0

              geo=await page.evaluate("projectGeorefStrategyCounts()")
              assert geo['withheld'] > 0, geo
              assert geo['puls']+geo['anchor']+geo['dawa'] >= 20, geo

              await page.locator('#projectCategory').select_option('advanced')
              await page.wait_for_timeout(200)
              advanced_rows=await page.locator('.project-row').count()
              assert advanced_rows >= 5, f'advancedRows={advanced_rows}'
              await page.locator('#projectCategory').select_option('all')
              await page.locator('#search').fill('Aarhus ReWater')
              await page.wait_for_timeout(200)
              assert await page.locator('.project-row').count() >= 1
              await page.locator('.project-row').first.click()
              detail=await page.locator('#detailContent').inner_text()
              assert 'forsyningsprojekt' in detail.lower() and 'Aarhus ReWater' in detail,detail
              assert 'Tangkrogen' in detail,detail
              assert 'Avanceret rensning' in detail,detail
              assert 'Områdeplacering' in detail,detail
              await page.locator('#closeDetail').click()
              await page.wait_for_timeout(250)
              assert not await page.locator('#detailPanel').evaluate("el=>el.classList.contains('open')")
              await page.locator('#search').fill('')
              label='mobile' if mobile else 'desktop'
              await page.screenshot(path=f'qa-projects-{label}.png',full_page=True)

              await page.locator('.tab[data-tab="brands"]').click()
              assert await page.locator('#brandControls').is_visible()
              assert not await page.locator('#projectControls').is_visible()
              before=len(errors)
              await page.locator('#zoomSelected').click()
              await page.wait_for_timeout(250)
              assert len(errors)==before, f'zoomSelected error={errors[before:]}'
              assert not errors, f'pageerrors={errors}'

              if mobile:
                  overflow=await page.evaluate("document.documentElement.scrollWidth-document.documentElement.clientWidth")
                  assert overflow <= 3, f'horizontal overflow={overflow}px'

              await page.screenshot(path=f'qa-{label}.png',full_page=True)
              print(f'{label.upper()}_QA_OK brands={brands} verifiedPlants={plants} projects={projects} projectRows={project_rows} projectMarkers={project_markers} withheld={geo["withheld"]} advancedRows={advanced_rows} regions={regions} leafletInteractive={interactive} defaultPlantRows={default_plant_rows} verifiedPlantRows={verified_plant_rows} activeWithCapacity={puls_schema["activeWithCapacity"]} map={round(map_box["width"])}x{round(map_box["height"])} font={font_qa["body"]}')
              await context.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  await check(browser,False)
                  await check(browser,True)
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spildevandskort-qa-screenshots
          path: qa-*.png
          if-no-files-found: ignore
