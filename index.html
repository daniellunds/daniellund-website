<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Lund Sørensen - Landskabsarkitekt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }
        .fade-in {
            animation: fadeIn 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#fff8f0] min-h-screen relative overflow-x-hidden flex flex-col items-center justify-center text-center p-6 py-12">

    <div class="fixed inset-0 z-0 pointer-events-none"
         style="background-image: 
            radial-gradient(circle at 20% 80%, rgba(255, 182, 153, 0.3) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(255, 244, 214, 0.5) 0%, transparent 50%),
            radial-gradient(circle at 40% 40%, rgba(255, 182, 153, 0.1) 0%, transparent 50%);">
    </div>

    <div class="relative z-10 fade-in max-w-3xl">
        
        <h1 class="text-5xl md:text-7xl font-semibold mb-4 text-gray-900 tracking-tight">
            Daniel Lund Sørensen
        </h1>

        <h2 class="text-2xl md:text-3xl text-gray-600 mb-8 font-light">
            MSc Landscape Architecture
        </h2>
        
        <div class="flex flex-col md:flex-row gap-4 justify-center">
            <a 
                href="https://www.linkedin.com/in/daniel-lund-s%C3%B8rensen/" 
                target="_blank" 
                rel="noopener noreferrer"
                class="bg-gray-900 text-white hover:bg-gray-700 font-medium py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105 shadow-lg shadow-orange-100"
            >
                LinkedIn
            </a>

            <a 
                href="mailto:mail@daniellund.dk" 
                class="border-2 border-gray-800 text-gray-900 hover:bg-gray-800 hover:text-white font-medium py-3 px-8 rounded-full transition-all duration-300"
            >
                Kontakt mig
            </a>
        </div>
    </div>

    <footer class="relative mt-16 text-gray-500 text-sm z-10">
        &copy; <span id="year"></span> Daniel Lund Sørensen
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
