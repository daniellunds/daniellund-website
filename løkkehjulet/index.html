<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Løkkehjulet</title>
<style>
:root{--tour-yellow:#FEDD00;--paper:#fbfaf6;--ink:#171717;--muted:#6f6a5a;--line:#d9d3bf;--line2:#ece6d4;--r:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--tour-yellow);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{width:min(980px,calc(100vw - 48px));margin:38px auto 46px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:850;margin:0 0 16px;color:#2e2800}h1{margin:0;font-size:clamp(64px,10vw,132px);line-height:.82;letter-spacing:-.075em;color:var(--ink)}.subtitle{margin:18px 0 26px;color:#4c4300;font-size:16px;font-weight:650}.wheel-area{position:relative;width:min(76vw,680px);height:min(76vw,680px);margin:0 auto 26px;border-radius:50%}canvas{width:100%;height:100%;display:block;cursor:pointer;filter:drop-shadow(0 18px 46px rgba(74,61,0,.24))}.center-face{position:absolute;left:50%;top:50%;width:38%;height:auto;display:block;z-index:8;pointer-events:none;transform:translate(-50%,-50%) rotate(0rad);transform-origin:center center;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.32))}.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:none}.pointer-head{width:34px;height:34px;border-radius:50%;background:var(--tour-yellow);border:7px solid var(--ink);box-shadow:0 4px 12px rgba(74,61,0,.22)}.pointer-stem{width:8px;height:42px;background:var(--ink);border-radius:999px;margin-top:-4px}.pointer-tip{width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:36px solid var(--ink);margin-top:-2px;filter:drop-shadow(0 4px 6px rgba(74,61,0,.22))}.result{min-height:74px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}.result-label{color:#5c5000;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.result-value{font-size:clamp(1.8rem,3vw,2.8rem);line-height:1;font-weight:900;letter-spacing:-.05em;color:var(--ink)}.badge{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--tour-yellow);font-size:.92rem;font-weight:800;border:1px solid rgba(23,23,23,.22)}@media(max-width:760px){.wrap{width:100%;margin:0;padding:24px 14px 30px}.eyebrow{font-size:10px;margin-bottom:12px}h1{font-size:clamp(58px,18vw,92px)}.subtitle{margin-top:14px;font-size:14px}.wheel-area{width:min(92vw,680px);height:min(92vw,680px)}.center-face{width:39%}.pointer{top:-12px}.pointer-head{width:30px;height:30px;border-width:6px}.pointer-stem{height:34px}.pointer-tip{border-left-width:18px;border-right-width:18px;border-top-width:31px}}
</style>
</head>
<body>
<div class="wrap"><div class="eyebrow">Tour de Løkke 2026</div><h1>Løkkehjulet</h1><p class="subtitle">Klik på hjulet og se resultatet</p><div class="wheel-area"><div class="pointer"><div class="pointer-head"></div><div class="pointer-stem"></div><div class="pointer-tip"></div></div><canvas id="wheel" width="800" height="800"></canvas><img id="centerFace" class="center-face" src="./lokke.png?v=14" alt="" /></div><div class="result"><div class="result-label">Resultat</div><div class="result-value" id="result">Klar til spin</div></div><div class="badge">Klik direkte på hjulet for at spinne</div></div>
<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const resultEl=document.getElementById("result");
const centerFace=document.getElementById("centerFace");
const TAU=Math.PI*2;
const itemCodes=[[216,108],[82,248,100,118,105,110],[72,118,105,100,118,105,110],[82,111,115,233],[67,97,118,97],[67,104,97,109,112,97,103,110,101],[71,105,110,32,38,32,116,111,110,105,99],[77,111,106,105,116,111],[74,111,115,101,112,104,32,83,112,114,105,116,122,101,108],[87,104,105,115,107,121],[82,111,109],[86,111,100,107,97],[76,105,107,248,114],[83,104,111,116,115]];
const items=itemCodes.map(c=>String.fromCodePoint(...c));
const colors=["#FEDD00","#171717","#fbfaf6","#c9a227","#e8c65a","#8b7a2b","#f5e8a8","#6f6a5a","#d7b13f","#fff4bd","#b9824d","#477a9d","#6f8f62","#9d4a42"];
let rotation=0;
let spinning=false;
const cx=canvas.width/2;
const cy=canvas.height/2;
const outerRadius=350;
const innerRadius=54;
const sliceAngle=TAU/items.length;
function normalizeAngle(angle){return((angle%TAU)+TAU)%TAU}
function updateFaceRotation(){centerFace.style.transform=`translate(-50%,-50%) rotate(${rotation}rad)`}
function getTextColor(hex){return["#171717","#6f6a5a","#477a9d","#6f8f62","#9d4a42","#8b7a2b","#b9824d"].includes(hex)?"#fbfaf6":"#171717"}
function drawWheel(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.beginPath();ctx.arc(cx,cy,outerRadius+14,0,TAU);ctx.fillStyle="#171717";ctx.fill();ctx.beginPath();ctx.arc(cx,cy,outerRadius+5,0,TAU);ctx.fillStyle="#fbfaf6";ctx.fill();for(let i=0;i<items.length;i++){const start=rotation+i*sliceAngle-Math.PI/2;const end=start+sliceAngle;const color=colors[i%colors.length];ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,outerRadius,start,end);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle="rgba(23,23,23,0.24)";ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(start+sliceAngle/2);ctx.textAlign="right";ctx.fillStyle=getTextColor(color);ctx.font=items[i].length>13?"900 21px Arial":"900 25px Arial";ctx.shadowColor="rgba(251,250,246,0.30)";ctx.shadowBlur=2;ctx.fillText(items[i],outerRadius-24,10);ctx.restore()}ctx.beginPath();ctx.arc(cx,cy,innerRadius,0,TAU);ctx.fillStyle="#fbfaf6";ctx.fill();ctx.beginPath();ctx.arc(cx,cy,innerRadius,0,TAU);ctx.lineWidth=5;ctx.strokeStyle="#171717";ctx.stroke();updateFaceRotation()}
function easeSuspense(t){return Math.sin((t*Math.PI)/2)}
function getSelectedIndex(currentRotation){return Math.floor(normalizeAngle(-currentRotation)/sliceAngle)%items.length}
function spinWheel(){if(spinning)return;spinning=true;resultEl.textContent="Spinner...";const chosenIndex=Math.floor(Math.random()*items.length);const targetSliceCenter=chosenIndex*sliceAngle+sliceAngle/2;const finalBaseRotation=-targetSliceCenter;const extraTurns=4+Math.floor(Math.random()*3);const normalizedDelta=normalizeAngle(finalBaseRotation-rotation);const targetRotation=rotation+normalizedDelta+extraTurns*TAU;const startRotation=rotation;const duration=7600;const startTime=performance.now();function animate(now){const elapsed=now-startTime;const t=Math.min(elapsed/duration,1);const eased=easeSuspense(t);rotation=startRotation+(targetRotation-startRotation)*eased;drawWheel();if(t<1){requestAnimationFrame(animate)}else{rotation=normalizeAngle(targetRotation);drawWheel();resultEl.textContent=items[getSelectedIndex(rotation)];spinning=false}}requestAnimationFrame(animate)}
canvas.addEventListener("click",spinWheel);
drawWheel();
</script>
</body>
</html>
