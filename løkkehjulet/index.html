<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Løkkehjulet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#2b2f38 0%,#171a21 45%,#0f1116 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{width:100%;max-width:920px;padding:24px;text-align:center}h1{margin:0 0 8px;font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.03em}.subtitle{margin:0 0 24px;color:#c7cedb}.wheel-area{position:relative;width:min(82vw,720px);height:min(82vw,720px);margin:0 auto 24px}canvas{width:100%;height:100%;display:block;cursor:pointer;filter:drop-shadow(0 18px 28px rgba(0,0,0,.35))}.center-face{position:absolute;left:50%;top:50%;width:38%;height:auto;display:block;z-index:8;pointer-events:none;transform:translate(-50%,-50%) rotate(0rad);transform-origin:center center;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.32))}.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:none}.pointer-head{width:28px;height:28px;border-radius:50%;background:#ffd54a;border:4px solid #fff6cc;box-shadow:0 4px 12px rgba(0,0,0,.35)}.pointer-stem{width:8px;height:38px;background:#ffd54a;border-radius:999px;margin-top:-2px}.pointer-tip{width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:32px solid #ffd54a;margin-top:-2px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}.result{min-height:70px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}.result-label{color:#c7cedb;font-size:.95rem}.result-value{font-size:clamp(1.6rem,3vw,2.5rem);font-weight:700;color:#ffd54a}.badge{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.08);color:#dfe6f2;font-size:.92rem}
</style>
</head>
<body>
<div class="wrap"><h1>Løkkehjulet</h1><p class="subtitle">Klik på hjulet og se resultatet</p><div class="wheel-area"><div class="pointer"><div class="pointer-head"></div><div class="pointer-stem"></div><div class="pointer-tip"></div></div><canvas id="wheel" width="800" height="800"></canvas><img id="centerFace" class="center-face" src="./lokke.png?v=13" alt="" /></div><div class="result"><div class="result-label">Resultat</div><div class="result-value" id="result">Klar til spin</div></div><div class="badge">Klik direkte på hjulet for at spinne</div></div>
<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const resultEl=document.getElementById("result");
const centerFace=document.getElementById("centerFace");
const TAU=Math.PI*2;
const itemCodes=[[216,108],[82,248,100,118,105,110],[72,118,105,100,118,105,110],[82,111,115,233],[67,97,118,97],[67,104,97,109,112,97,103,110,101],[71,105,110,32,38,32,116,111,110,105,99],[77,111,106,105,116,111],[74,111,115,101,112,104,32,83,112,114,105,116,122,101,108],[87,104,105,115,107,121],[82,111,109],[86,111,100,107,97],[76,105,107,248,114],[83,104,111,116,115]];
const items=itemCodes.map(c=>String.fromCodePoint(...c));
const colors=["#d94f4f","#e07a5f","#f2cc8f","#81b29a","#3d405b","#6d597a","#b56576","#457b9d","#2a9d8f","#8d6e63","#ffb703","#90be6d","#577590","#f28482"];
let rotation=0;
let spinning=false;
const cx=canvas.width/2;
const cy=canvas.height/2;
const outerRadius=350;
const innerRadius=54;
const sliceAngle=TAU/items.length;
function normalizeAngle(angle){return((angle%TAU)+TAU)%TAU}
function updateFaceRotation(){centerFace.style.transform=`translate(-50%,-50%) rotate(${rotation}rad)`}
function drawWheel(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.beginPath();ctx.arc(cx,cy,outerRadius+12,0,TAU);ctx.fillStyle="#11161f";ctx.fill();for(let i=0;i<items.length;i++){const start=rotation+i*sliceAngle-Math.PI/2;const end=start+sliceAngle;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,outerRadius,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="rgba(255,255,255,0.18)";ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(start+sliceAngle/2);ctx.textAlign="right";ctx.fillStyle="#ffffff";ctx.font=items[i].length>13?"bold 21px Arial":"bold 25px Arial";ctx.shadowColor="rgba(0,0,0,0.35)";ctx.shadowBlur=4;ctx.fillText(items[i],outerRadius-24,10);ctx.restore()}ctx.beginPath();ctx.arc(cx,cy,innerRadius,0,TAU);ctx.fillStyle="#f4f1ea";ctx.fill();ctx.beginPath();ctx.arc(cx,cy,innerRadius,0,TAU);ctx.lineWidth=5;ctx.strokeStyle="rgba(255,255,255,0.85)";ctx.stroke();updateFaceRotation()}
function easeSuspense(t){return Math.sin((t*Math.PI)/2)}
function getSelectedIndex(currentRotation){return Math.floor(normalizeAngle(-currentRotation)/sliceAngle)%items.length}
function spinWheel(){if(spinning)return;spinning=true;resultEl.textContent="Spinner...";const chosenIndex=Math.floor(Math.random()*items.length);const targetSliceCenter=chosenIndex*sliceAngle+sliceAngle/2;const finalBaseRotation=-targetSliceCenter;const extraTurns=4+Math.floor(Math.random()*3);const normalizedDelta=normalizeAngle(finalBaseRotation-rotation);const targetRotation=rotation+normalizedDelta+extraTurns*TAU;const startRotation=rotation;const duration=7600;const startTime=performance.now();function animate(now){const elapsed=now-startTime;const t=Math.min(elapsed/duration,1);const eased=easeSuspense(t);rotation=startRotation+(targetRotation-startRotation)*eased;drawWheel();if(t<1){requestAnimationFrame(animate)}else{rotation=normalizeAngle(targetRotation);drawWheel();resultEl.textContent=items[getSelectedIndex(rotation)];spinning=false}}requestAnimationFrame(animate)}
canvas.addEventListener("click",spinWheel);
drawWheel();
</script>
</body>
</html>
