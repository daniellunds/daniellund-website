<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--tour-yellow:#FEDD00;--ink:#151515;--muted:#4c4300}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.34) 0%,rgba(255,255,255,.05) 32%,rgba(255,255,255,0) 58%),radial-gradient(circle at center,#ffe96b 0%,#FEDD00 48%,#efc900 100%);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:-15%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0deg,rgba(255,255,255,.16) 1.2deg,transparent 1.2deg,transparent 12deg);opacity:.42;mix-blend-mode:screen}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,rgba(255,255,255,.28) 0 1px,transparent 1.5px);background-size:10px 10px;mask:radial-gradient(circle at center,rgba(0,0,0,.95),rgba(0,0,0,.18) 55%,transparent 78%);opacity:.26}.wrap{position:relative;z-index:1;width:min(980px,calc(100vw - 48px));margin:34px auto 46px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:900;margin:0 0 14px;color:#2e2800}h1{margin:0 0 28px;font-size:clamp(64px,10vw,132px);line-height:.82;letter-spacing:-.075em;color:var(--ink);font-weight:950;text-shadow:0 2px 0 rgba(255,255,255,.25)}.wheel-area{position:relative;width:min(76vw,680px);height:min(76vw,680px);margin:0 auto 18px;border-radius:50%}canvas{width:100%;height:100%;display:block;cursor:pointer;filter:drop-shadow(0 22px 48px rgba(84,59,0,.32))}.center-face{position:absolute;left:50%;top:50%;width:34%;height:auto;display:block;z-index:8;pointer-events:none;transform:translate(-50%,-50%) rotate(0rad);transform-origin:center center;object-fit:contain;filter:drop-shadow(0 10px 19px rgba(0,0,0,.36))}.pointer{position:absolute;top:-19px;left:50%;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;align-items:center;pointer-events:none}.pointer-head{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff8c7 0%,#ffe26b 25%,#d99c00 67%,#8a5a00 100%);border:4px solid #161616;box-shadow:inset 0 2px 6px rgba(255,255,255,.65),0 7px 18px rgba(80,57,0,.28)}.pointer-head:after{content:"";display:block;width:18px;height:18px;border-radius:50%;margin:8px auto;background:radial-gradient(circle at 38% 30%,#fffef0 0%,#ffd84f 55%,#9b6500 100%);box-shadow:inset 0 1px 3px rgba(255,255,255,.62)}.pointer-stem{width:9px;height:42px;background:#161616;border-radius:999px;margin-top:-3px}.pointer-tip{width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:48px solid #161616;margin-top:-2px;filter:drop-shadow(0 6px 10px rgba(81,57,0,.3));position:relative}.pointer-tip:after{content:"";position:absolute;left:-14px;top:-42px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:32px solid #ffe26b;opacity:.85}.result-panel{width:min(820px,calc(100vw - 42px));margin:0 auto;padding:8px 0 0;background:transparent;border:0;box-shadow:none;backdrop-filter:none;text-align:center}.result-panel.is-changing{animation:resultFade .38s ease-out}.result-kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:950;color:#6a5a00;margin:0 0 8px}.result-title{margin:0;font-size:clamp(28px,4vw,46px);line-height:.98;font-weight:950;letter-spacing:-.04em;color:#151515}.result-description{margin:13px auto 0;max-width:760px;font-size:clamp(15px,1.55vw,17px);line-height:1.55;font-weight:500;color:rgba(35,30,0,.76)}@keyframes resultFade{0%{opacity:.25;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(max-width:760px){.wrap{width:100%;margin:0;padding:24px 14px 30px}.eyebrow{font-size:10px;margin-bottom:12px}h1{font-size:clamp(58px,18vw,92px);margin-bottom:22px}.wheel-area{width:min(92vw,680px);height:min(92vw,680px)}.center-face{width:35%}.pointer{top:-13px}.pointer-head{width:34px;height:34px}.pointer-head:after{width:14px;height:14px;margin:7px auto}.pointer-stem{height:34px}.pointer-tip{border-left-width:19px;border-right-width:19px;border-top-width:38px}.result-panel{width:min(92vw,760px);padding-top:6px}.result-description{font-size:15px;line-height:1.45}}
</style>
</head>
<body>
<div class="wrap"><div class="eyebrow">Grand R&#233;tard 2026</div><h1>Løkkehjulet</h1><div class="wheel-area"><div class="pointer"><div class="pointer-head"></div><div class="pointer-stem"></div><div class="pointer-tip"></div></div><canvas id="wheel" width="900" height="900"></canvas><img id="centerFace" class="center-face" src="./lokke.png?v=29" alt="" /></div><section class="result-panel" id="resultPanel" aria-live="polite"><div class="result-kicker">RESULTAT</div><h2 class="result-title" id="resultTitle">RESULTAT</h2><p class="result-description" id="resultDescription">Drej hjulet</p></section></div>
<script>
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),resultTitle=document.getElementById("resultTitle"),resultDescription=document.getElementById("resultDescription"),resultPanel=document.getElementById("resultPanel"),centerFace=document.getElementById("centerFace"),TAU=Math.PI*2;
const drinkData=[{"id":1,"label":"Estrella Damm","bgColor":"#2E7D32","textColor":"#FFFFFF","description":"Barcelonas absolutte hjerteblod og Lars Løkkes faste rugbrødsmotor. Det er den catalanske udgave af en helt klassisk Grøn Tuborg eller Carlsberg Pilsner – bare skænket iskold fra fad i solen. Er den mod forventning ikke på hanerne på den lokale bar, så bed bartenderen om en San Miguel eller Mahou, som leverer præcis samme sprøde feriestemning."},{"id":2,"label":"Rødvin","bgColor":"#5B1E31","textColor":"#FFFFFF","description":"Brændstof til de dybe politiske studehandler over tapasbordet. Hvor vi i Danmark ofte bestiller en tung italiensk Ripasso eller californisk Zinfandel til bøffen, skal I her bede tjeneren om et glas lokal catalansk Priorat eller en klassisk Rioja Crianza. Er de ikke på glas-kortet, så bed om Ribera del Duero, som næsten altid er ren verdensklasse til prisen."},{"id":3,"label":"Shots","bgColor":"#1A1A1A","textColor":"#FFFFFF","description":"Selve konceptet kender vi alle fra baren hjemme, men indholdet skal selvfølgelig være Spaniens svar på en Gammel Dansk, Fernet Branca eller Arnbitter! Bed bartenderen om en runde Hierbas (voldsom grøn urtelikør) eller Anís del Mono. Ryster han på hovedet, så råb på Orujo de Hierbas eller ganske enkelt iskold Tequila."},{"id":4,"label":"Cava","bgColor":"#D4AF37","textColor":"#000000","description":"Cataloniens stolte svar på fransk champagne eller nytårs-Asti, og selve motoren i den lokale fest. Bestil en flaske til bordet på tapasbaren – kig efter den ikoniske, matte sorte Freixenet Cordón Negro på kortet. Har restauranten en anden hus-Cava, så snup en tør Codorníu Brut."},{"id":5,"label":"Cider","bgColor":"#D32F2F","textColor":"#FFFFFF","description":"Den perfekte brobygger på caféen. Hvor vi i Danmark forbinder cider med en hvinende sød Somersby eller Mokaï, er det i Spanien en tør voksendrik. Spørg i baren, om de har den catalanske Mooma eller galiciske Maeloc på flaske. Kigger bartenderen undrende, så bed om en traditionel nordspansk Sidra Trabanco eller El Gaitero."},{"id":6,"label":"Moritz","bgColor":"#43A047","textColor":"#FFFFFF","description":"Den historiske kult-øl med den gule etiket, brygget midt i centrum af Barcelona. Det er byens svar på en Tuborg Classic eller en Nørrebro Bryghus – lidt mere smag og lokal stolthed. Har caféen ikke Moritz på kortet, så bed om en Alhambra Reserva 1925, som ofte serveres i en smuk mønstret glasflaske helt uden etiket."},{"id":7,"label":"Rosé","bgColor":"#F48FB1","textColor":"#000000","description":"Den lyserøde siesta-starter. Hvor danskerne sværger til fransk Provence-rosé, hedder det her Rosado og laves magisk godt lige i baghaven. Bed tjeneren om en kold Garnacha Rosado fra Navarra eller en Torres De Casta, og understreg med håndtegn, at glasset skal være så koldt, at det dugger."},{"id":8,"label":"Joseph Spritzel","bgColor":"#FF7A00","textColor":"#FFFFFF","description":"Når solen bager over Barcelona, og udeserveringen koger, er der brug for noget ultimativt læskende. Dette felt er hjulets frikort til samtlige former for Spritz! Bed tjeneren om at blande på lokal Cava i stedet for Prosecco – uanset om I bestiller en klassisk orange Aperol Spritz, en voksenbitter Campari Spritz, en sommerfrisk Hugo Spritz eller en syrlig Limoncello Spritz."},{"id":9,"label":"Sangría de Cava","bgColor":"#AD1457","textColor":"#FFFFFF","description":"Hjulets absolutte krone! Det er Cataloniens svar på en opgraderet dansk havefest-punch. Bestil en hel kande på strandbaren: Frisk frugt, masser af is og et skvæt likør overhældt med iskold Cava. Kan restauranten kun finde ud af at lave almindelig rød sangria, så spørg efter luksus-sangriaen Lolea No. 2."},{"id":10,"label":"Vermut","bgColor":"#4A148C","textColor":"#FFFFFF","description":"Barcelonas hellige weekend-religion. Det minder i stemning lidt om dansk portvinshygge eller en rød Martini. Gå ind på en lokal bodega ved frokosttid og bestil 'un vermut de la casa' – så får I en bittersød, rød kryddervin serveret over is med en grøn oliven og appelsin. Har baren mærker på kortet, så bed om Yzaguirre eller Miró."},{"id":11,"label":"Voll-Damm","bgColor":"#1B5E20","textColor":"#FFFFFF","description":"Hjulets store farefelt! Den mørkegrønne dåse (eller flaske) med 7,2% dobbeltmalt er Spaniens svar på en Elefantøl eller Master Brew – det er baglokale-øllen, man bunder, når svære politiske reformer skal på plads. Har baren den ikke, så bed tjeneren om en Mahou Maestra eller Estrella Galicia 1906, der leverer præcis samme tunge procenter."},{"id":12,"label":"Hvidvin","bgColor":"#FFF9C4","textColor":"#000000","description":"Den rene, kolde terrasse-benzin. Svarer til den sprøde Sauvignon Blanc eller Pinot Grigio, man nyder i sommerhuset. Når tjeneren kommer ned til bordet, så bed om et glas Verdejo fra Rueda – iskold, tør og fuld af citrusnoter. Har de den ikke på glas, så peg på galicisk Albariño eller husets hvide, som ofte er Torres Viña Sol."},{"id":13,"label":"Cocktail","bgColor":"#81D4FA","textColor":"#000000","description":"Hjulets store cocktail-lotto, hvor I slipper for den bitre tonic og kan bestille præcis den lokale drink, ganen lyster! I Barcelona betyder det frit valg på øverste hylde af spanske bar-klassikere – uanset om stemningen er til en kande Agua de Valencia fyldt med Cava og spiritus, en opkvikkende Carajillo med espresso, en Kalimotxo med rødvin og cola, eller en læskende Pomada med lokal gin og citron."},{"id":14,"label":"Likør","bgColor":"#5D4037","textColor":"#FFFFFF","description":"Spaniens suveræne svar på Baileys eller Dooley's efter middagen! Når regningen eller desserten skal bestilles, så bed tjeneren om et glas Licor de Crema Catalana (ofte mærket Melody) med is – smager af flydende crème brûlée. Har de den ikke, så bed om folkefavoritten Ruavieja Crema, der slår irsk Baileys med længder."}];
let rotation=0,spinning=false,audioCtx=null,lastTickIndex=null,lastTickTime=0;
const cx=canvas.width/2,cy=canvas.height/2,outerRadius=396,segmentOuterRadius=346,innerRadius=86,bulbRingRadius=373,sliceAngle=TAU/drinkData.length;
function normalizeAngle(angle){return((angle%TAU)+TAU)%TAU}
function updateFaceRotation(){centerFace.style.transform=`translate(-50%,-50%) rotate(${rotation}rad)`}
function easeSuspense(t){return Math.sin((t*Math.PI)/2)}
function getSelectedIndex(currentRotation){return Math.floor(normalizeAngle(-currentRotation)/sliceAngle)%drinkData.length}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}
function playTick(){if(!audioCtx)return;const now=audioCtx.currentTime,length=Math.floor(audioCtx.sampleRate*.024),buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++){const fade=1-i/length;data[i]=(Math.random()*2-1)*fade}const noise=audioCtx.createBufferSource();noise.buffer=buffer;const filter=audioCtx.createBiquadFilter();filter.type="bandpass";filter.frequency.setValueAtTime(1650,now);filter.Q.setValueAtTime(7,now);const gain=audioCtx.createGain();gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(.12,now+.002);gain.gain.exponentialRampToValueAtTime(.0001,now+.032);noise.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);noise.start(now);noise.stop(now+.035);const tap=audioCtx.createOscillator(),tapGain=audioCtx.createGain();tap.type="triangle";tap.frequency.setValueAtTime(260,now);tapGain.gain.setValueAtTime(.0001,now);tapGain.gain.linearRampToValueAtTime(.035,now+.002);tapGain.gain.exponentialRampToValueAtTime(.0001,now+.018);tap.connect(tapGain);tapGain.connect(audioCtx.destination);tap.start(now);tap.stop(now+.02)}
function drawCircle(r,fill){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function drawBulbs(){const count=42;for(let i=0;i<count;i++){const a=-Math.PI/2+i/count*TAU,x=cx+Math.cos(a)*bulbRingRadius,y=cy+Math.sin(a)*bulbRingRadius,glow=ctx.createRadialGradient(x,y,1,x,y,17);glow.addColorStop(0,"rgba(255,255,255,.95)");glow.addColorStop(.35,"rgba(255,244,174,.86)");glow.addColorStop(1,"rgba(255,244,174,0)");ctx.beginPath();ctx.arc(x,y,17,0,TAU);ctx.fillStyle=glow;ctx.fill();const bulb=ctx.createRadialGradient(x-2,y-2,1,x,y,7);bulb.addColorStop(0,"#fffef8");bulb.addColorStop(.56,"#fff0a2");bulb.addColorStop(1,"#c29418");ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fillStyle=bulb;ctx.fill()}}
function drawSeparator(angle){const inner=innerRadius+16,outer=segmentOuterRadius-7,x1=cx+Math.cos(angle)*inner,y1=cy+Math.sin(angle)*inner,x2=cx+Math.cos(angle)*outer,y2=cy+Math.sin(angle)*outer;ctx.save();ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="#5b5b5b";ctx.lineWidth=8;ctx.stroke();ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="#e1e1e1";ctx.lineWidth=4;ctx.stroke();const px=cx+Math.cos(angle)*(segmentOuterRadius-4),py=cy+Math.sin(angle)*(segmentOuterRadius-4),peg=ctx.createRadialGradient(px-4,py-4,1,px,py,11);peg.addColorStop(0,"#fff");peg.addColorStop(.48,"#d8d8d8");peg.addColorStop(1,"#6c6c6c");ctx.beginPath();ctx.arc(px,py,10,0,TAU);ctx.fillStyle=peg;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#555";ctx.stroke();ctx.restore()}
function labelAnchor(label){if(label.length>=14)return -(segmentOuterRadius-27);if(label.length>=10)return -(segmentOuterRadius-24);if(label.length<=5)return -(segmentOuterRadius-20);return -(segmentOuterRadius-22)}
function getLabelStyle(segment){let size=34;if(segment.label.length>=14)size=20;else if(segment.label.length>=10)size=23;else if(segment.label.length>=8)size=28;return{fill:segment.textColor,stroke:segment.textColor==="#000000"?"rgba(255,255,255,.50)":"rgba(0,0,0,.42)",font:`400 ${size}px "Rye","Arial Black",Impact,Arial,sans-serif`,anchorX:labelAnchor(segment.label)}}
function updateResult(segment){resultPanel.classList.remove("is-changing");void resultPanel.offsetWidth;resultTitle.textContent=segment.label;resultDescription.textContent=segment.description;resultPanel.classList.add("is-changing")}
function drawWheel(){ctx.clearRect(0,0,canvas.width,canvas.height);drawCircle(outerRadius+12,"rgba(80,50,0,.92)");const rim=ctx.createRadialGradient(cx-90,cy-110,60,cx,cy,outerRadius+10);rim.addColorStop(0,"#fff4ae");rim.addColorStop(.23,"#ffd85c");rim.addColorStop(.48,"#bc8110");rim.addColorStop(.72,"#624000");rim.addColorStop(1,"#f5cb3a");drawCircle(outerRadius,rim);drawCircle(outerRadius-14,"#2a1c00");drawCircle(outerRadius-24,"#f0c84f");drawBulbs();drawCircle(segmentOuterRadius+8,"#2c1d00");for(let i=0;i<drinkData.length;i++){const segment=drinkData[i],start=rotation+i*sliceAngle-Math.PI/2,end=start+sliceAngle,mid=start+sliceAngle/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.fillStyle=segment.bgColor;ctx.fill();const shine=ctx.createRadialGradient(cx+Math.cos(mid)*80,cy+Math.sin(mid)*80,18,cx+Math.cos(mid)*195,cy+Math.sin(mid)*195,segmentOuterRadius);shine.addColorStop(0,"rgba(255,255,255,.26)");shine.addColorStop(.42,"rgba(255,255,255,.04)");shine.addColorStop(1,"rgba(0,0,0,.18)");ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.fillStyle=shine;ctx.fill();ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.strokeStyle="rgba(0,0,0,.22)";ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(mid+Math.PI);const labelStyle=getLabelStyle(segment);ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillStyle=labelStyle.fill;ctx.font=labelStyle.font;ctx.lineWidth=6;ctx.strokeStyle=labelStyle.stroke;ctx.shadowColor="rgba(0,0,0,.18)";ctx.shadowBlur=2;ctx.strokeText(segment.label,labelStyle.anchorX,0);ctx.fillText(segment.label,labelStyle.anchorX,0);ctx.restore()}for(let i=0;i<drinkData.length;i++)drawSeparator(rotation+i*sliceAngle-Math.PI/2);const center=ctx.createRadialGradient(cx-24,cy-25,8,cx,cy,innerRadius);center.addColorStop(0,"#fff");center.addColorStop(.48,"#f2eee4");center.addColorStop(.76,"#c7b98f");center.addColorStop(1,"#72531a");drawCircle(innerRadius+7,"#2b1b00");drawCircle(innerRadius,center);ctx.beginPath();ctx.arc(cx,cy,innerRadius-7,0,TAU);ctx.lineWidth=6;ctx.strokeStyle="rgba(255,255,255,.75)";ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,innerRadius+2,0,TAU);ctx.lineWidth=5;ctx.strokeStyle="#7c5700";ctx.stroke();updateFaceRotation()}
function spinWheel(){if(spinning)return;initAudio();spinning=true;lastTickIndex=getSelectedIndex(rotation);lastTickTime=performance.now();const chosenIndex=Math.floor(Math.random()*drinkData.length),targetSliceCenter=chosenIndex*sliceAngle+sliceAngle/2,finalBaseRotation=-targetSliceCenter,extraTurns=4+Math.floor(Math.random()*3),normalizedDelta=normalizeAngle(finalBaseRotation-rotation),targetRotation=rotation+normalizedDelta+extraTurns*TAU,startRotation=rotation,duration=7600,startTime=performance.now();function animate(now){const elapsed=now-startTime,t=Math.min(elapsed/duration,1),eased=easeSuspense(t);rotation=startRotation+(targetRotation-startRotation)*eased;drawWheel();const tickIndex=getSelectedIndex(rotation);if(tickIndex!==lastTickIndex&&now-lastTickTime>38){playTick();lastTickIndex=tickIndex;lastTickTime=now}if(t<1){requestAnimationFrame(animate)}else{rotation=normalizeAngle(targetRotation);drawWheel();updateResult(drinkData[getSelectedIndex(rotation)]);spinning=false}}requestAnimationFrame(animate)}
canvas.addEventListener("click",spinWheel);
document.fonts.ready.then(drawWheel);
drawWheel();
</script>
