:root{--tour-yellow:#FEDD00;--ink:#151515;--muted:#4c4300}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.34) 0%,rgba(255,255,255,.05) 32%,rgba(255,255,255,0) 58%),radial-gradient(circle at center,#ffe96b 0%,#FEDD00 48%,#efc900 100%);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:-15%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0deg,rgba(255,255,255,.16) 1.2deg,transparent 1.2deg,transparent 12deg);opacity:.42;mix-blend-mode:screen}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,rgba(255,255,255,.28) 0 1px,transparent 1.5px);background-size:10px 10px;mask:radial-gradient(circle at center,rgba(0,0,0,.95),rgba(0,0,0,.18) 55%,transparent 78%);opacity:.26}.wrap{position:relative;z-index:1;width:min(980px,calc(100vw - 48px));margin:34px auto 46px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:900;margin:0 0 14px;color:#2e2800}h1{margin:0 0 28px;font-size:clamp(64px,10vw,132px);line-height:.82;letter-spacing:-.075em;color:var(--ink);font-weight:950;text-shadow:0 2px 0 rgba(255,255,255,.25)}.wheel-area{position:relative;width:min(76vw,680px);height:min(76vw,680px);margin:0 auto 18px;border-radius:50%}canvas{width:100%;height:100%;display:block;cursor:pointer;filter:drop-shadow(0 22px 48px rgba(84,59,0,.32))}.center-face{position:absolute;left:50%;top:50%;width:34%;height:auto;display:block;z-index:8;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%) rotate(0rad) scale(1);transform-origin:center center;object-fit:contain;filter:drop-shadow(0 0 14px rgba(0,0,0,.16)) drop-shadow(0 4px 18px rgba(0,0,0,.14)) drop-shadow(0 12px 30px rgba(0,0,0,.12));-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-callout:none;touch-action:none}.pointer{position:absolute;top:-19px;left:50%;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;align-items:center;pointer-events:none}.pointer-head{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff8c7 0%,#ffe26b 25%,#d99c00 67%,#8a5a00 100%);border:4px solid #161616;box-shadow:inset 0 2px 6px rgba(255,255,255,.65),0 7px 18px rgba(80,57,0,.28)}.pointer-head:after{content:"";display:block;width:18px;height:18px;border-radius:50%;margin:8px auto;background:radial-gradient(circle at 38% 30%,#fffef0 0%,#ffd84f 55%,#9b6500 100%);box-shadow:inset 0 1px 3px rgba(255,255,255,.62)}.pointer-stem{width:9px;height:42px;background:#161616;border-radius:999px;margin-top:-3px}.pointer-tip{width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:48px solid #161616;margin-top:-2px;filter:drop-shadow(0 6px 10px rgba(81,57,0,.3));position:relative}.pointer-tip:after{content:"";position:absolute;left:-14px;top:-42px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:32px solid #ffe26b;opacity:.85}.result-panel{width:min(820px,calc(100vw - 42px));margin:0 auto;padding:8px 0 0;background:transparent;border:0;box-shadow:none;backdrop-filter:none;text-align:center}.result-panel.is-changing{animation:resultFade .38s ease-out}.result-kicker{min-height:15px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:950;color:#6a5a00;margin:0 0 8px}.result-title{margin:0;font-size:clamp(28px,4vw,46px);line-height:.98;font-weight:950;letter-spacing:-.04em;color:#151515}.result-description{margin:13px auto 0;max-width:760px;font-size:clamp(15px,1.55vw,17px);line-height:1.55;font-weight:500;color:rgba(35,30,0,.76)}.result-description b{font-weight:850;color:#151515}.result-description:empty{margin-top:0}.mood-section{width:min(560px,92vw);margin:62px auto 0;opacity:.86}.mood-title{margin:0 0 14px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:950;color:#6a5a00}.mood-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.12);box-shadow:0 18px 42px rgba(84,59,0,.22)}.mood-video iframe{width:100%;height:100%;border:0;display:block}@keyframes resultFade{0%{opacity:.25;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(max-width:760px){.wrap{width:100%;margin:0;padding:24px 14px 30px}.eyebrow{font-size:10px;margin-bottom:12px}h1{font-size:clamp(58px,18vw,92px);margin-bottom:22px}.wheel-area{width:min(92vw,680px);height:min(92vw,680px)}.center-face{width:35%}.pointer{top:-13px}.pointer-head{width:34px;height:34px}.pointer-head:after{width:14px;height:14px;margin:7px auto}.pointer-stem{height:34px}.pointer-tip{border-left-width:19px;border-right-width:19px;border-top-width:38px}.result-panel{width:min(92vw,760px);padding-top:6px}.result-description{font-size:15px;line-height:1.45}.mood-section{margin-top:48px}.mood-video{border-radius:18px}}

<div class="wrap"><div class="eyebrow">Grand R&#233;tard 2026</div><h1>Løkkehjulet</h1><div class="wheel-area"><div class="pointer"><div class="pointer-head"></div><div class="pointer-stem"></div><div class="pointer-tip"></div></div><canvas id="wheel" width="900" height="900"></canvas><img id="centerFace" class="center-face" src="/l%C3%B8kkehjulet/lokke.png" alt="" draggable="false" /></div><section class="result-panel" id="resultPanel" aria-live="polite"><div class="result-kicker" id="resultKicker"></div><h2 class="result-title" id="resultTitle">Klar til spin</h2><p class="result-description" id="resultDescription">Pro tip: Jo længere tid du trykker Løkke på næsen jo mere spinner han...</p><div class="mood-section"><p class="mood-title">Kom i feriestemning</p><div class="mood-video"><iframe src="https://www.youtube-nocookie.com/embed/dHIXVJ8byF4" title="Kom i feriestemning" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></div></section></div>
<script>
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),resultKicker=document.getElementById("resultKicker"),resultTitle=document.getElementById("resultTitle"),resultDescription=document.getElementById("resultDescription"),resultPanel=document.getElementById("resultPanel"),centerFace=document.getElementById("centerFace"),TAU=Math.PI*2;
let resultBuffer=null,resultBufferPromise=null;
const drinkData=[{"id":1,"label":"Estrella Damm","bgColor":"#2E7D32","description":"Hovedfeltets foretrukne fadbamse og selve rugbrødsmotoren på de flade etaper. Det er den slags øl, der ikke angriber løbet, men holder sammen på det, mens Ramblaen glider forbi i varm, catalansk tomgang. Den catalanske udgave af en klassisk Grøn Tuborg – perfekt, når vi bare skal sidde på hjul. Er den mod forventning ikke i hanerne, så stik af i et hidsigt udbrud og kræv en <b>San Miguel</b> eller <b>Mahou</b>, som leverer præcis samme sprøde feriestemning."},{"id":2,"label":"Rødvin","bgColor":"#5B1E31","description":"Det klassiske smøremiddel, når morgendagens taktik skal på plads, og rollerne i feltet skal fordeles efter en hård dag på asfalten. Det er mytologisk. Det er smukt. Hvor vi i Danmark ofte tager en tung Ripasso, skal vi her rykke ind over midten med diamanter i benene og bestille et glas lokal catalansk <b>Priorat</b> eller en klassisk <b>Rioja Crianza</b>. Går sportsdirektøren i baglås, så diktér en <b>Ribera del Duero</b>, der altid leverer en sand kaptajns-præstation til prisen."},{"id":3,"label":"Shots","bgColor":"#1A1A1A","description":"Så rammer vi stigningerne uden for kategori! Vejen rejser sig foran os som en ond drøm, og benene begynder at træde firkanter. Konceptet kender vi fra baren hjemme, men her skal der flydende højspænding til for at genoplive kroppen. Hug i pedalerne, gå i udbrud og forlang en runde <b>Hierbas</b> (voldsom grøn urtelikør) eller <b>Anís del Mono</b>. Ryster bartenderen på hovedet, så tru med et mistillidsvotum og råb på <b>Orujo de Hierbas</b> eller en aggressiv, iskold <b>Patxaran</b>."},{"id":4,"label":"Cava","bgColor":"#D4AF37","description":"Sejrsboblerne! Vi har knap nok forladt den neutrale zone, men det er aldrig for tidligt at udråbe sejren. Det er Cataloniens svar på champagne. Indkald til uformelt pressemøde på tapasbaren, og kig efter den ikoniske, sorte <b>Freixenet Cordón Negro</b> på kortet. Er den ikke på køl, så udvis politisk fleksibilitet og indgå et fornuftigt kompromis om en tør <b>Codorníu Brut</b>."},{"id":5,"label":"Cider","bgColor":"#D32F2F","description":"Den perfekte brobygger, når vandbærerne er gået fuldstændig sukkerkolde bagest i feltet og skal have lidt frisk at styrke sig på. Her taler vi ikke hvinende sød og forfalsket cider som Somersby, men benhård, tør voksendrik. Spørg baren, om de har den catalanske <b>Mooma</b> eller galiciske <b>Maeloc</b> på flaske. Kigger de dumt, så fald tilbage i gruppettoen og træk på en sikker, traditionel nordspansk <b>Sidra Trabanco</b> eller <b>El Gaitero</b>."},{"id":6,"label":"Moritz","bgColor":"#43A047","description":"Den gule førertrøje inden for catalansk brygkunst! En historisk kult-øl brygget midt i Barcelona – et sandt privilegium for den selvstændige udbryder, der har slået et hul til feltet og nægter at ligge i læ bag de store kommercielle hold. Har caféen ikke Moritz, så lav en pragmatisk løsning og bed om en <b>Alhambra Reserva 1925</b> i den grønne flaske uden etiket. Nydes allerbedst på fortovet med en klassisk lys, spansk <b>Fortuna</b> i mundvigen, mens man holder den ægte siesta-kadence."},{"id":7,"label":"Rosé","bgColor":"#F48FB1","description":"Den lyserøde siesta-starter, og den ubetinget mest lirens måde at holde hviledag på i Touren. Her kalder vi den Rosado, og den smager magisk godt. Lav en hurtig studehandel med tjeneren om en kold <b>Garnacha Rosado fra Navarra</b> eller en <b>Torres De Casta</b>, og insister med tydelige håndtegn på, at glasset skal dugge som en iskold drikkedunk."},{"id":8,"label":"Joseph Spritzel","bgColor":"#FF7A00","description":"Når hedebølgen rammer feltet på vej op ad Col du Tourmalet, og holdet har brændt sine sidste tændstikker, er dette feltets officielle redningskrans. Vi skifter den italienske Prosecco ud med lokal <b>Cava</b> – og forlanger den naturligvis serveret fuldstændig kælderkold. Uanset om temperamentet hælder til en klassisk <b>Aperol Spritz</b>, en voksenbitter <b>Campari Spritz</b>, en sommerfrisk <b>Hugo Spritz</b> eller en syrlig <b>Limoncello Spritz</b>, er det en fængslende fornøjelse!"},{"id":9,"label":"Sangría de Cava","bgColor":"#AD1457","description":"Kongeetapen! Det her er kronjuvelen på det catalanske menukort. Sæt holdet i front på strandbaren, bestil en hel kande og nyd frisk frugt overhældt med iskold <b>Cava</b>. Hvis baren kun kan finde ud af at levere en fesen rød standard-sangria, så tag ansvar og kræv luksus-udgaven <b>Lolea No. 2</b>."},{"id":10,"label":"Vermut","bgColor":"#4A148C","description":"Barcelonas hellige weekend-ritual og den perfekte optakt til en flad etape. Det er bittersød, rød kryddervin serveret over is – ren balsam for sjælen, når feltet bare ruller afsted i ren paradekørsel med laveste puls. Gå ind på en mørk bodega, a la Toga Vinstue, og bestil 'un vermut de la casa', eller få skrevet <b>Yzaguirre</b> eller <b>Miró</b> direkte ind i regeringsgrundlaget."},{"id":11,"label":"Voll-Damm","bgColor":"#1B5E20","description":"STYRT I FELTET! Når taktikken ramler, kaos breder sig, og krisen truer i geledderne, rykker vi direkte ind bagerst i holdbussen for at lave damage control. Den mørkegrønne dåse med 7,2% dobbeltmalt er nemlig øllen, man bunder, når de tungeste kriser skal løses og modparten skal drikkes under bordet - en velkendt teknik! Den kalder på akut røg til lungerne – præcis den slags tiltrængte, lynhurtige mørke <b>Ducados</b>, man instinktivt flår frem efter lange forhandlinger. Er baren tør for Voll-Damm, så bestil en <b>Mahou Maestra</b> eller <b>Estrella Galicia 1906</b>."},{"id":12,"label":"Hvidvin","bgColor":"#FFF9C4","description":"Den kølige belønning, når vi sidder sikkert og triller i gruppettoen. Der er harmoni i rækkerne. Når tjeneren kommer ned til bordet, så diktér et glas <b>Verdejo fra Rueda</b> – iskold, tør og fuld af citrus. Har de den ikke på glas, så tag teten og peg på galicisk <b>Albariño</b> eller vinkortets altid driftssikre klassiker, <b>Torres Viña Sol</b>."},{"id":13,"label":"Cocktail","bgColor":"#81D4FA","description":"Hjulets store enkeltstart! Her kører vi vores eget løb, alene mod uret og med dagsformen som eneste hjælper. Frit valg på øverste hylde – uanset om ruten dikterer en farlig <b>Agua de Valencia</b>, gade-klassikeren <b>Kalimotxo</b> (rødvin og cola) eller en læskende <b>Pomada</b>. Og bestiller vi en brændende varm <b>Carajillo</b>, er det praktisk talt et lokalt lovkrav at tænde en spansk <b>Nobel</b>-cigaret til kaffen."},{"id":14,"label":"Likør","bgColor":"#5D4037","description":"Selve belønningen, når det sidste tråd er trådt, målstregen er krydset, og roen endelig sænker sig over målområdet. Tiden er inde til at læne sig dybt tilbage i sædet og nyde Spaniens suveræne svar på Baileys. Bed tjeneren om et glas <b>Licor de Crema Catalana</b> – gå direkte efter mærket <b>Melody</b>, der smager af flydende crème brûlée. Alternativt må vi forhandle os til folkefavoritten <b>Ruavieja Crema</b>."}];
let rotation=0,spinning=false,audioCtx=null,lastTickIndex=null,lastTickTime=0,faceScale=1,pressStartTime=0;
const cx=canvas.width/2,cy=canvas.height/2,outerRadius=396,segmentOuterRadius=346,innerRadius=86,bulbRingRadius=373,sliceAngle=TAU/drinkData.length;
function randomFloat(){const cryptoObj=window.crypto||window.msCrypto;if(cryptoObj&&cryptoObj.getRandomValues){const values=new Uint32Array(1);cryptoObj.getRandomValues(values);return values[0]/4294967296}return Math.random()}
function randomInt(max){const cryptoObj=window.crypto||window.msCrypto;if(cryptoObj&&cryptoObj.getRandomValues){const values=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{cryptoObj.getRandomValues(values)}while(values[0]>=limit);return values[0]%max}return Math.floor(Math.random()*max)}
function normalizeAngle(angle){return((angle%TAU)+TAU)%TAU}
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
function updateFaceRotation(){centerFace.style.transform=`translate(-50%,-50%) rotate(${rotation}rad) scale(${faceScale})`}
function pressFace(){faceScale=.94;updateFaceRotation()}
function releaseFace(){faceScale=1;updateFaceRotation()}
function easeSuspense(t){return 1-Math.pow(1-t,4)}
function getSelectedIndex(currentRotation){return Math.floor(normalizeAngle(-currentRotation)/sliceAngle)%drinkData.length}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}
function loadResultSound(){if(!audioCtx)return null;if(resultBuffer)return Promise.resolve(resultBuffer);if(!resultBufferPromise){resultBufferPromise=fetch("/l%C3%B8kkehjulet/openbeer.wav").then(response=>response.arrayBuffer()).then(buffer=>audioCtx.decodeAudioData(buffer)).then(decoded=>{resultBuffer=decoded;return decoded}).catch(()=>{resultBufferPromise=null;return null})}return resultBufferPromise}
function playResultDing(){if(!audioCtx)return;if(!resultBuffer){loadResultSound();return}const now=audioCtx.currentTime,source=audioCtx.createBufferSource(),gain=audioCtx.createGain();source.buffer=resultBuffer;gain.gain.setValueAtTime(.92,now);source.connect(gain);gain.connect(audioCtx.destination);source.start(now)}
function playTick(){if(!audioCtx)return;const now=audioCtx.currentTime,length=Math.floor(audioCtx.sampleRate*.024),buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++){const fade=1-i/length;data[i]=(Math.random()*2-1)*fade}const noise=audioCtx.createBufferSource();noise.buffer=buffer;const filter=audioCtx.createBiquadFilter();filter.type="bandpass";filter.frequency.setValueAtTime(1650,now);filter.Q.setValueAtTime(7,now);const gain=audioCtx.createGain();gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(.12,now+.002);gain.gain.exponentialRampToValueAtTime(.0001,now+.032);noise.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);noise.start(now);noise.stop(now+.035);const tap=audioCtx.createOscillator(),tapGain=audioCtx.createGain();tap.type="triangle";tap.frequency.setValueAtTime(260,now);tapGain.gain.setValueAtTime(.0001,now);tapGain.gain.linearRampToValueAtTime(.035,now+.002);tapGain.gain.exponentialRampToValueAtTime(.0001,now+.018);tap.connect(tapGain);tapGain.connect(audioCtx.destination);tap.start(now);tap.stop(now+.02)}
function drawCircle(r,fill){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function drawBulbs(){const count=42;for(let i=0;i<count;i++){const a=-Math.PI/2+i/count*TAU,x=cx+Math.cos(a)*bulbRingRadius,y=cy+Math.sin(a)*bulbRingRadius,glow=ctx.createRadialGradient(x,y,1,x,y,17);glow.addColorStop(0,"rgba(255,255,255,.95)");glow.addColorStop(.35,"rgba(255,244,174,.86)");glow.addColorStop(1,"rgba(255,244,174,0)");ctx.beginPath();ctx.arc(x,y,17,0,TAU);ctx.fillStyle=glow;ctx.fill();const bulb=ctx.createRadialGradient(x-2,y-2,1,x,y,7);bulb.addColorStop(0,"#fffef8");bulb.addColorStop(.56,"#fff0a2");bulb.addColorStop(1,"#c29418");ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fillStyle=bulb;ctx.fill()}}
function drawSeparator(angle){const inner=innerRadius+16,outer=segmentOuterRadius-7,x1=cx+Math.cos(angle)*inner,y1=cy+Math.sin(angle)*inner,x2=cx+Math.cos(angle)*outer,y2=cy+Math.sin(angle)*outer;ctx.save();ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="#5b5b5b";ctx.lineWidth=8;ctx.stroke();ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="#e1e1e1";ctx.lineWidth=4;ctx.stroke();const px=cx+Math.cos(angle)*(segmentOuterRadius-4),py=cy+Math.sin(angle)*(segmentOuterRadius-4),peg=ctx.createRadialGradient(px-4,py-4,1,px,py,11);peg.addColorStop(0,"#fff");peg.addColorStop(.48,"#d8d8d8");peg.addColorStop(1,"#6c6c6c");ctx.beginPath();ctx.arc(px,py,10,0,TAU);ctx.fillStyle=peg;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#555";ctx.stroke();ctx.restore()}
function labelAnchor(label){if(label.length>=14)return -(segmentOuterRadius-27);if(label.length>=10)return -(segmentOuterRadius-24);if(label.length<=5)return -(segmentOuterRadius-20);return -(segmentOuterRadius-22)}
function getLabelStyle(segment){let size=34;if(segment.label.length>=14)size=20;else if(segment.label.length>=10)size=23;else if(segment.label.length>=8)size=28;const fill=segment.label==="Shots"?"#FFFFFF":"#000000";return{fill:fill,stroke:fill==="#000000"?"rgba(255,255,255,.50)":"rgba(0,0,0,.42)",font:`400 ${size}px "Rye","Arial Black",Impact,Arial,sans-serif`,anchorX:labelAnchor(segment.label)}}
function highlightDescription(segment){return segment.description}
function flashResult(){resultPanel.classList.remove("is-changing");void resultPanel.offsetWidth;resultPanel.classList.add("is-changing")}
function updateResult(segment){resultKicker.textContent="RESULTAT";resultTitle.textContent=segment.label;resultDescription.innerHTML=highlightDescription(segment);flashResult()}
function updateSpinning(){resultKicker.textContent="";resultTitle.textContent="Spinner...";resultDescription.innerHTML="";flashResult()}
function drawWheel(){ctx.clearRect(0,0,canvas.width,canvas.height);drawCircle(outerRadius+12,"rgba(80,50,0,.92)");const rim=ctx.createRadialGradient(cx-90,cy-110,60,cx,cy,outerRadius+10);rim.addColorStop(0,"#fff4ae");rim.addColorStop(.23,"#ffd85c");rim.addColorStop(.48,"#bc8110");rim.addColorStop(.72,"#624000");rim.addColorStop(1,"#f5cb3a");drawCircle(outerRadius,rim);drawCircle(outerRadius-14,"#2a1c00");drawCircle(outerRadius-24,"#f0c84f");drawBulbs();drawCircle(segmentOuterRadius+8,"#2c1d00");for(let i=0;i<drinkData.length;i++){const segment=drinkData[i],start=rotation+i*sliceAngle-Math.PI/2,end=start+sliceAngle,mid=start+sliceAngle/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.fillStyle=segment.bgColor;ctx.fill();const shine=ctx.createRadialGradient(cx+Math.cos(mid)*80,cy+Math.sin(mid)*80,18,cx+Math.cos(mid)*195,cy+Math.sin(mid)*195,segmentOuterRadius);shine.addColorStop(0,"rgba(255,255,255,.26)");shine.addColorStop(.42,"rgba(255,255,255,.04)");shine.addColorStop(1,"rgba(0,0,0,.18)");ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.fillStyle=shine;ctx.fill();ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.strokeStyle="rgba(0,0,0,.22)";ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(mid+Math.PI);const labelStyle=getLabelStyle(segment);ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillStyle=labelStyle.fill;ctx.font=labelStyle.font;ctx.lineWidth=6;ctx.strokeStyle=labelStyle.stroke;ctx.shadowColor="rgba(0,0,0,.18)";ctx.shadowBlur=2;ctx.strokeText(segment.label,labelStyle.anchorX,0);ctx.fillText(segment.label,labelStyle.anchorX,0);ctx.restore()}for(let i=0;i<drinkData.length;i++)drawSeparator(rotation+i*sliceAngle-Math.PI/2);const center=ctx.createRadialGradient(cx-24,cy-25,8,cx,cy,innerRadius);center.addColorStop(0,"#fff");center.addColorStop(.48,"#f2eee4");center.addColorStop(.76,"#c7b98f");center.addColorStop(1,"#72531a");drawCircle(innerRadius+7,"#2b1b00");drawCircle(innerRadius,center);ctx.beginPath();ctx.arc(cx,cy,innerRadius-7,0,TAU);ctx.lineWidth=6;ctx.strokeStyle="rgba(255,255,255,.75)";ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,innerRadius+2,0,TAU);ctx.lineWidth=5;ctx.strokeStyle="#7c5700";ctx.stroke();updateFaceRotation()}
function spinWheel(holdMs=0){if(spinning)return;initAudio();loadResultSound();spinning=true;updateSpinning();lastTickIndex=getSelectedIndex(rotation);lastTickTime=performance.now();const charge=clamp((holdMs-90)/2200,0,1),chosenIndex=randomInt(drinkData.length),targetSliceAngle=(chosenIndex+.12+randomFloat()*.76)*sliceAngle,finalBaseRotation=-targetSliceAngle,extraTurns=4+Math.floor(charge*5)+randomInt(3),normalizedDelta=normalizeAngle(finalBaseRotation-rotation),targetRotation=rotation+normalizedDelta+extraTurns*TAU,startRotation=rotation,duration=9300+charge*4200+randomFloat()*2600,startTime=performance.now(),landThreshold=.99996;function finishSpin(){rotation=normalizeAngle(targetRotation);drawWheel();updateResult(drinkData[getSelectedIndex(rotation)]);playResultDing();spinning=false}function animate(now){const elapsed=now-startTime,t=Math.min(elapsed/duration,1),eased=easeSuspense(t);rotation=startRotation+(targetRotation-startRotation)*eased;drawWheel();const tickIndex=getSelectedIndex(rotation);if(tickIndex!==lastTickIndex&&now-lastTickTime>38){playTick();lastTickIndex=tickIndex;lastTickTime=now}if(t<1&&eased<landThreshold){requestAnimationFrame(animate)}else{finishSpin()}}requestAnimationFrame(animate)}
centerFace.addEventListener("contextmenu",event=>{event.preventDefault()});
centerFace.addEventListener("pointerdown",event=>{event.preventDefault();initAudio();loadResultSound();pressStartTime=performance.now();try{centerFace.setPointerCapture(event.pointerId)}catch(error){}pressFace()});
centerFace.addEventListener("pointerup",event=>{event.preventDefault();event.stopPropagation();const holdMs=pressStartTime?performance.now()-pressStartTime:0;pressStartTime=0;releaseFace();spinWheel(holdMs)});
centerFace.addEventListener("pointercancel",()=>{pressStartTime=0;releaseFace()});
centerFace.addEventListener("pointerleave",releaseFace);
centerFace.addEventListener("click",event=>{event.preventDefault();event.stopPropagation()});
canvas.addEventListener("click",()=>spinWheel(0));
document.fonts.ready.then(drawWheel);
drawWheel();
</script>
