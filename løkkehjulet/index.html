<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Løkkehjulet</title>
<style>
:root{--tour-yellow:#FEDD00;--ink:#151515;--muted:#4c4300}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.34) 0%,rgba(255,255,255,.05) 32%,rgba(255,255,255,0) 58%),radial-gradient(circle at center,#ffe96b 0%,#FEDD00 48%,#efc900 100%);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:-15%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0deg,rgba(255,255,255,.16) 1.2deg,transparent 1.2deg,transparent 12deg);opacity:.42;mix-blend-mode:screen}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,rgba(255,255,255,.28) 0 1px,transparent 1.5px);background-size:10px 10px;mask:radial-gradient(circle at center,rgba(0,0,0,.95),rgba(0,0,0,.18) 55%,transparent 78%);opacity:.26}.wrap{position:relative;z-index:1;width:min(980px,calc(100vw - 48px));margin:34px auto 46px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:900;margin:0 0 14px;color:#2e2800}h1{margin:0 0 28px;font-size:clamp(64px,10vw,132px);line-height:.82;letter-spacing:-.075em;color:var(--ink);font-weight:950;text-shadow:0 2px 0 rgba(255,255,255,.25)}.wheel-area{position:relative;width:min(76vw,680px);height:min(76vw,680px);margin:0 auto 26px;border-radius:50%}canvas{width:100%;height:100%;display:block;cursor:pointer;filter:drop-shadow(0 22px 48px rgba(84,59,0,.32))}.center-face{position:absolute;left:50%;top:50%;width:38%;height:auto;display:block;z-index:8;pointer-events:none;transform:translate(-50%,-50%) rotate(0rad);transform-origin:center center;object-fit:contain;filter:drop-shadow(0 10px 19px rgba(0,0,0,.36))}.pointer{position:absolute;top:-19px;left:50%;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;align-items:center;pointer-events:none}.pointer-head{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff8c7 0%,#ffe26b 25%,#d99c00 67%,#8a5a00 100%);border:4px solid #161616;box-shadow:inset 0 2px 6px rgba(255,255,255,.65),0 7px 18px rgba(80,57,0,.28)}.pointer-head:after{content:"";display:block;width:18px;height:18px;border-radius:50%;margin:8px auto;background:radial-gradient(circle at 38% 30%,#fffef0 0%,#ffd84f 55%,#9b6500 100%);box-shadow:inset 0 1px 3px rgba(255,255,255,.62)}.pointer-stem{width:9px;height:42px;background:#161616;border-radius:999px;margin-top:-3px}.pointer-tip{width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:48px solid #161616;margin-top:-2px;filter:drop-shadow(0 6px 10px rgba(81,57,0,.3));position:relative}.pointer-tip:after{content:"";position:absolute;left:-14px;top:-42px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:32px solid #ffe26b;opacity:.85}.result{min-height:74px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}.result-label{color:#5c5000;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:900}.result-value{font-size:clamp(1.8rem,3vw,2.8rem);line-height:1;font-weight:950;letter-spacing:-.05em;color:var(--ink)}@media(max-width:760px){.wrap{width:100%;margin:0;padding:24px 14px 30px}.eyebrow{font-size:10px;margin-bottom:12px}h1{font-size:clamp(58px,18vw,92px);margin-bottom:22px}.wheel-area{width:min(92vw,680px);height:min(92vw,680px)}.center-face{width:39%}.pointer{top:-13px}.pointer-head{width:34px;height:34px}.pointer-head:after{width:14px;height:14px;margin:7px auto}.pointer-stem{height:34px}.pointer-tip{border-left-width:19px;border-right-width:19px;border-top-width:38px}}
</style>
</head>
<body>
<div class="wrap"><div class="eyebrow">Grand Rétard 2026</div><h1>Løkkehjulet</h1><div class="wheel-area"><div class="pointer"><div class="pointer-head"></div><div class="pointer-stem"></div><div class="pointer-tip"></div></div><canvas id="wheel" width="900" height="900"></canvas><img id="centerFace" class="center-face" src="./lokke.png?v=18" alt="" /></div><div class="result"><div class="result-label">Resultat</div><div class="result-value" id="result">Klar til spin</div></div></div>
<script>
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),resultEl=document.getElementById("result"),centerFace=document.getElementById("centerFace"),TAU=Math.PI*2;
const items=["Øl","Rødvin","Hvidvin","Rosé","Cava","Champagne","Gin & tonic","Mojito","Joseph Spritzel","Whisky","Rom","Vodka","Likør","Shots"];
const colors=["#49A8FF","#F6A400","#FFF25A","#F12222","#F2D7B1","#D5B23E","#FFFDF4","#45A9FF","#FF1E1E","#FFF15B","#CFAE2D","#4CB3FF","#111111","#63E11F"];
let rotation=0,spinning=false,audioCtx=null,lastTickIndex=null,lastTickTime=0;
const cx=canvas.width/2,cy=canvas.height/2,outerRadius=396,segmentOuterRadius=346,innerRadius=86,bulbRingRadius=373,sliceAngle=TAU/items.length;
function normalizeAngle(angle){return((angle%TAU)+TAU)%TAU}
function updateFaceRotation(){centerFace.style.transform=`translate(-50%,-50%) rotate(${rotation}rad)`}
function easeSuspense(t){return Math.sin((t*Math.PI)/2)}
function getSelectedIndex(currentRotation){return Math.floor(normalizeAngle(-currentRotation)/sliceAngle)%items.length}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}
function playTick(){if(!audioCtx)return;const now=audioCtx.currentTime,length=Math.floor(audioCtx.sampleRate*.024),buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++){const fade=1-i/length;data[i]=(Math.random()*2-1)*fade}const noise=audioCtx.createBufferSource();noise.buffer=buffer;const filter=audioCtx.createBiquadFilter();filter.type="bandpass";filter.frequency.setValueAtTime(1650,now);filter.Q.setValueAtTime(7,now);const gain=audioCtx.createGain();gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(.12,now+.002);gain.gain.exponentialRampToValueAtTime(.0001,now+.032);noise.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);noise.start(now);noise.stop(now+.035);const tap=audioCtx.createOscillator(),tapGain=audioCtx.createGain();tap.type="triangle";tap.frequency.setValueAtTime(260,now);tapGain.gain.setValueAtTime(.0001,now);tapGain.gain.linearRampToValueAtTime(.035,now+.002);tapGain.gain.exponentialRampToValueAtTime(.0001,now+.018);tap.connect(tapGain);tapGain.connect(audioCtx.destination);tap.start(now);tap.stop(now+.02)}
function drawCircle(r,fill){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function drawBulbs(){const count=42;for(let i=0;i<count;i++){const a=-Math.PI/2+i/count*TAU,x=cx+Math.cos(a)*bulbRingRadius,y=cy+Math.sin(a)*bulbRingRadius,glow=ctx.createRadialGradient(x,y,1,x,y,17);glow.addColorStop(0,"rgba(255,255,255,.95)");glow.addColorStop(.35,"rgba(255,244,174,.86)");glow.addColorStop(1,"rgba(255,244,174,0)");ctx.beginPath();ctx.arc(x,y,17,0,TAU);ctx.fillStyle=glow;ctx.fill();const bulb=ctx.createRadialGradient(x-2,y-2,1,x,y,7);bulb.addColorStop(0,"#fffef8");bulb.addColorStop(.56,"#fff0a2");bulb.addColorStop(1,"#c29418");ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fillStyle=bulb;ctx.fill()}}
function drawSeparator(angle){const inner=innerRadius+16,outer=segmentOuterRadius-7,x1=cx+Math.cos(angle)*inner,y1=cy+Math.sin(angle)*inner,x2=cx+Math.cos(angle)*outer,y2=cy+Math.sin(angle)*outer;ctx.save();ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="#5b5b5b";ctx.lineWidth=8;ctx.stroke();ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="#e1e1e1";ctx.lineWidth=4;ctx.stroke();const px=cx+Math.cos(angle)*(segmentOuterRadius-4),py=cy+Math.sin(angle)*(segmentOuterRadius-4),peg=ctx.createRadialGradient(px-4,py-4,1,px,py,11);peg.addColorStop(0,"#fff");peg.addColorStop(.48,"#d8d8d8");peg.addColorStop(1,"#6c6c6c");ctx.beginPath();ctx.arc(px,py,10,0,TAU);ctx.fillStyle=peg;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#555";ctx.stroke();ctx.restore()}
function getLabelStyle(label,color){const isDark=color==="#111111";return{fill:isDark?"#fff":"#111",stroke:isDark?"rgba(0,0,0,.42)":"rgba(255,255,255,.42)",font:label.length>13?'950 24px "Arial Black",Impact,Arial,sans-serif':'950 34px "Arial Black",Impact,Arial,sans-serif'}}
function drawWheel(){ctx.clearRect(0,0,canvas.width,canvas.height);drawCircle(outerRadius+12,"rgba(80,50,0,.92)");const rim=ctx.createRadialGradient(cx-90,cy-110,60,cx,cy,outerRadius+10);rim.addColorStop(0,"#fff4ae");rim.addColorStop(.23,"#ffd85c");rim.addColorStop(.48,"#bc8110");rim.addColorStop(.72,"#624000");rim.addColorStop(1,"#f5cb3a");drawCircle(outerRadius,rim);drawCircle(outerRadius-14,"#2a1c00");drawCircle(outerRadius-24,"#f0c84f");drawBulbs();drawCircle(segmentOuterRadius+8,"#2c1d00");for(let i=0;i<items.length;i++){const start=rotation+i*sliceAngle-Math.PI/2,end=start+sliceAngle,mid=start+sliceAngle/2,color=colors[i%colors.length];ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.fillStyle=color;ctx.fill();const shine=ctx.createRadialGradient(cx+Math.cos(mid)*80,cy+Math.sin(mid)*80,18,cx+Math.cos(mid)*195,cy+Math.sin(mid)*195,segmentOuterRadius);shine.addColorStop(0,"rgba(255,255,255,.26)");shine.addColorStop(.42,"rgba(255,255,255,.04)");shine.addColorStop(1,"rgba(0,0,0,.18)");ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.fillStyle=shine;ctx.fill();ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,segmentOuterRadius,start,end);ctx.closePath();ctx.strokeStyle="rgba(0,0,0,.22)";ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(mid);const labelStyle=getLabelStyle(items[i],color);ctx.textAlign="right";ctx.fillStyle=labelStyle.fill;ctx.font=labelStyle.font;ctx.lineWidth=7;ctx.strokeStyle=labelStyle.stroke;ctx.shadowColor="rgba(0,0,0,.18)";ctx.shadowBlur=2;ctx.strokeText(items[i],segmentOuterRadius-34,12);ctx.fillText(items[i],segmentOuterRadius-34,12);ctx.restore()}for(let i=0;i<items.length;i++)drawSeparator(rotation+i*sliceAngle-Math.PI/2);const center=ctx.createRadialGradient(cx-24,cy-25,8,cx,cy,innerRadius);center.addColorStop(0,"#fff");center.addColorStop(.48,"#f2eee4");center.addColorStop(.76,"#c7b98f");center.addColorStop(1,"#72531a");drawCircle(innerRadius+7,"#2b1b00");drawCircle(innerRadius,center);ctx.beginPath();ctx.arc(cx,cy,innerRadius-7,0,TAU);ctx.lineWidth=6;ctx.strokeStyle="rgba(255,255,255,.75)";ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,innerRadius+2,0,TAU);ctx.lineWidth=5;ctx.strokeStyle="#7c5700";ctx.stroke();updateFaceRotation()}
function spinWheel(){if(spinning)return;initAudio();spinning=true;resultEl.textContent="Spinner...";lastTickIndex=getSelectedIndex(rotation);lastTickTime=performance.now();const chosenIndex=Math.floor(Math.random()*items.length),targetSliceCenter=chosenIndex*sliceAngle+sliceAngle/2,finalBaseRotation=-targetSliceCenter,extraTurns=4+Math.floor(Math.random()*3),normalizedDelta=normalizeAngle(finalBaseRotation-rotation),targetRotation=rotation+normalizedDelta+extraTurns*TAU,startRotation=rotation,duration=7600,startTime=performance.now();function animate(now){const elapsed=now-startTime,t=Math.min(elapsed/duration,1),eased=easeSuspense(t);rotation=startRotation+(targetRotation-startRotation)*eased;drawWheel();const tickIndex=getSelectedIndex(rotation);if(tickIndex!==lastTickIndex&&now-lastTickTime>38){playTick();lastTickIndex=tickIndex;lastTickTime=now}if(t<1){requestAnimationFrame(animate)}else{rotation=normalizeAngle(targetRotation);drawWheel();resultEl.textContent=items[getSelectedIndex(rotation)];spinning=false}}requestAnimationFrame(animate)}
canvas.addEventListener("click",spinWheel);drawWheel();
</script>
</body>
</html>
